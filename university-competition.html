<script>
(()=>{
  const p=new URLSearchParams(location.search);
  const legacy={results:'schedule','group-standings':'groups',standings:'knockout',teams:'rosters',sources:'resources'};
  const requestedView=p.get('view');
  if(legacy[requestedView])p.set('view',legacy[requestedView]);
  const requested=p.get('competition')||'';
  const gender=/women/.test(requested)||p.get('gender')==='women'?'women':'men';
  const slug=gender==='women'?'university-goseong-women-2026':'university-goseong-men-2026';
  p.set('competition',slug);
  p.set('gender',gender);
  p.delete('layout');
  const next=location.pathname+'?'+p.toString()+location.hash;
  if(next!==location.pathname+location.search+location.hash)history.replaceState(null,'',next);
  window.KVL_COMPETITION_PAGE_V2={production:true,deferRender:true,collectionRoot:'/data/competitions/'};
})();
</script>

<script>
(()=>{
  const body=document.body,p=new URLSearchParams(location.search),slug=p.get('competition')||'';
  body.dataset.kvlFamily='domestic';
  body.dataset.kvlGender=/-women-/.test(slug)?'women':'men';
  addEventListener('pageshow',event=>{if(event.persisted)requestAnimationFrame(()=>{body.dataset.kvlRenderState='ready';});});
