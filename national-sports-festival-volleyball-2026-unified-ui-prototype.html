<script>
/* Normalize the entry URL before the shared competition loader reads ?competition=. */
(function(){
'use strict';
const allowed=['national-sports-festival-men-general-2026','national-sports-festival-men-university-2026','national-sports-festival-men-u18-2026','national-sports-festival-women-general-2026','national-sports-festival-women-u18-2026'];
const url=new URL(location.href);
if(!allowed.includes(url.searchParams.get('competition'))){
  url.searchParams.set('competition',allowed[0]);url.searchParams.delete('team');url.searchParams.delete('date');url.searchParams.delete('view');
  history.replaceState(null,'',url.pathname+url.search);
}
window.KVL_COMPETITION_PAGE_V2={production:false,deferRender:true,collectionRoot:'/data/competitions/'};
})();
</script>

<body class="kvl1180-prototype kvl-competition-template-v2 kvl-nsf-unified" data-kvl-render-state="loading">
<script>
(function(){
const slug=new URLSearchParams(location.search).get('competition')||'';
document.body.dataset.kvlFamily='domestic';
document.body.dataset.kvlGender=slug.includes('-women-')?'women':'men';
})();
</script>
<p id="kvlCompetitionLoading" role="status">대회 정보를 불러오는 중입니다.</p>
<main data-kvl-shell hidden></main>
<noscript>대회 프로토타입은 JavaScript가 필요합니다.</noscript>
<footer class="site-footer">© K-Volley Lab. Korean Volleyball Data &amp; Analytics.</footer>
<script>
/* Add only the five-division switch to the real V2 shell, leaving rendering with the common engine. */
(function(){'use strict';
const divisions=[
 {slug:'national-sports-festival-men-general-2026',label:'남자 일반부',gender:'men'},
 {slug:'national-sports-festival-men-university-2026',label:'남자 대학부',gender:'men'},
 {slug:'national-sports-festival-men-u18-2026',label:'남자 18세 이하부',gender:'men'},
 {slug:'national-sports-festival-women-general-2026',label:'여자 일반부',gender:'women'},
 {slug:'national-sports-festival-women-u18-2026',label:'여자 18세 이하부',gender:'women'}
];
const slug=new URLSearchParams(location.search).get('competition')||divisions[0].slug;
const toUrl=target=>{
 const url=new URL(location.href);url.searchParams.set('competition',target);url.searchParams.delete('team');url.searchParams.delete('date');
 const view=url.searchParams.get('view');
 if(!['overview','schedule','knockout','rosters','resources'].includes(view))url.searchParams.delete('view');
 return url.pathname+url.search;
};
function mount(){
 const main=document.querySelector('[data-kvl-shell]'),bar=main?.querySelector('.kvl1180-controlbar');
 if(!bar||main.querySelector('.kvl-nsf-division-switch'))return false;
 const nav=document.createElement('nav');nav.className='kvl-nsf-division-switch';nav.setAttribute('aria-label','전국체육대회 배구 종별 선택');
 const label=document.createElement('span');label.className='kvl-nsf-division-label';label.textContent='종별 선택';
 const links=document.createElement('div');links.className='kvl-nsf-division-links';
 const select=document.createElement('select');select.className='kvl-nsf-division-mobile';select.setAttribute('aria-label','배구 종별 선택');
 for(const [gender,name] of [['men','남자부'],['women','여자부']]){
  const group=document.createElement('optgroup');group.label=name;
  for(const d of divisions.filter(item=>item.gender===gender)){
   const a=document.createElement('a');a.href=toUrl(d.slug);a.textContent=d.label;a.dataset.gender=d.gender;
   if(d.slug===slug){a.classList.add('is-active');a.setAttribute('aria-current','page');}
   links.appendChild(a);
   const option=document.createElement('option');option.value=d.slug;option.textContent=d.label;option.selected=d.slug===slug;
   group.appendChild(option);
  }select.appendChild(group);
 }
 select.addEventListener('change',()=>{location.assign(toUrl(select.value));});
 nav.append(label,links,select);bar.before(nav);
 const genderSwitch=bar.querySelector('.kvl1180-gender');if(genderSwitch)genderSwitch.remove();
 const groupsTab=bar.querySelector('.kvl1180-tabs a[data-view="groups"]');if(groupsTab)groupsTab.remove();
 const tabNames={schedule:'경기일정·결과',knockout:'대진·최종순위',rosters:'참가팀'};
 for(const [key,title] of Object.entries(tabNames)){const a=bar.querySelector('.kvl1180-tabs a[data-view="'+key+'"]');if(a)a.textContent=title;}
 const kpis=main.querySelector('.kvl1180-kpis');
 const second=kpis?.querySelector('.kvl1180-kpi:nth-child(2) .kvl1180-kpi-copy');
 if(second){const title=second.querySelector('span'),count=second.querySelector('strong'),unit=second.querySelector('small');if(title)title.textContent='대회 종별';if(count)count.textContent='5';if(unit)unit.textContent='개 종별';}
 /* In pure knockout competitions, the old "groups" KPI target is not meaningful. */
 const secondCard=kpis?.querySelector('.kvl1180-kpi:nth-child(2)');
 if(secondCard){delete secondCard.dataset.kvlTarget;secondCard.removeAttribute('role');secondCard.removeAttribute('tabindex');secondCard.onclick=null;secondCard.onkeydown=null;}
 const note=document.createElement('p');note.className='kvl-nsf-source-note';note.textContent='공식 개최정보 확인 · 참가 시·도, 실제 대진 및 세트별 경기결과는 원문 대조 후 연결합니다. 임의 경기·순위 없음.';
 bar.after(note);
 return true;
}
const shell=document.querySelector('[data-kvl-shell]');
if(!mount()){
 const observer=new MutationObserver(()=>{if(mount())observer.disconnect();});
 observer.observe(shell,{childList:true,subtree:true});
}
})();
</script>
