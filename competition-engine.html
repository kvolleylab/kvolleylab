</head><body class="kvl1180-prototype kvl-competition-template-v2" data-kvl-render-state="loading">
<script>
(()=>{
  const body=document.body,p=new URLSearchParams(location.search),slug=p.get('competition')||'';
  if(/^university-/.test(slug)){body.dataset.kvlFamily='domestic';}
  if(/-women-/.test(slug)){body.dataset.kvlGender='women';}
  else if(/-men-/.test(slug)){body.dataset.kvlGender='men';}
  const hide=()=>{body.dataset.kvlRenderState='leaving';};
  addEventListener('pageshow',event=>{
    if(!event.persisted)return;
    const shell=document.querySelector('[data-kvl-shell]');
    if(shell)shell.style.removeProperty('visibility');
    requestAnimationFrame(()=>{body.dataset.kvlRenderState='ready';});
  });
  document.addEventListener('click',event=>{
    if(event.defaultPrevented||event.button!==0||event.metaKey||event.ctrlKey||event.shiftKey||event.altKey)return;
    const link=event.target.closest('.kvl1180-tabs a[data-view], .kvl1180-gender a[data-gender-link]');
    if(!link||!link.href||link.getAttribute('aria-disabled')==='true')return;
    const next=new URL(link.href,location.href);
    if(next.origin!==location.origin)return;
    event.preventDefault();
    body.dataset.kvlRenderState='leaving';
    setTimeout(()=>{location.href=next.href;},110);
  },{capture:true});
  addEventListener('pagehide',hide,{capture:true});
  addEventListener('beforeunload',hide,{capture:true});
})();
</script>
<p id="kvlCompetitionLoading" role="status">대회 정보를 불러오는 중입니다.</p><main data-kvl-shell hidden></main>
<noscript>대회 정보를 보려면 JavaScript를 사용해 주세요.</noscript>
