</head><body class="kvl1180-prototype kvl-competition-template-v2" data-kvl-render-state="loading">
<script>
(()=>{
  const body=document.body,p=new URLSearchParams(location.search),slug=p.get('competition')||'';
  if(/^(?:v-league|kovo-cup)-/.test(slug))body.dataset.kvlFamily='pro';
  if(/-women-/.test(slug))body.dataset.kvlGender='women';
  else if(/-men-/.test(slug))body.dataset.kvlGender='men';
  addEventListener('pageshow',event=>{if(event.persisted)requestAnimationFrame(()=>{body.dataset.kvlRenderState='ready';});});
})();
</script>
