<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>로그인 | K-Volley Lab</title>
<link rel="stylesheet" href="assets/css/pretendard-global.css">
<link rel="stylesheet" href="assets/css/member-login-v1.css?v=20261124-invalid-password-v1">
<script type="module" src="assets/js/member-login-v1.mjs?v=20261124-invalid-password-v1"></script>
</head>
<body>
<header class="member-login-head"><a href="index.html"><img src="assets/images/brand/kvl-ball-domestic-navywhite.webp" alt=""><span><b>K-Volley Lab</b><small>MEMBER LOGIN</small></span></a></header>
<main class="member-login-shell">
<section class="member-login-card">
<p class="eyebrow">KVL MEMBER ACCESS</p>
<h1>로그인</h1>
<p class="intro">K-Volley Lab 로그인 페이지입니다. 현재는 운영 검수 단계로 허용된 관리자 계정만 이용할 수 있습니다.</p>
<form id="memberLoginForm">
<label>이메일<input id="memberEmail" type="email" autocomplete="username" required></label>
<label>비밀번호<input id="memberPassword" type="password" autocomplete="current-password" required></label>
<button id="memberLoginButton" type="submit">로그인</button>
</form>
<div id="memberSignedIn" hidden>
<span id="memberRoleBadge"></span><strong id="memberAccountEmail"></strong>
<p>로그인 상태가 확인되었습니다.</p>
<div class="member-signed-actions"><button id="memberContinueButton" type="button">홈으로</button><a href="players.html">선수·팀으로</a></div>
<button id="memberWorkspaceButton" class="secondary" type="button" hidden>관리자 선수 공간</button>
<button id="memberLogoutButton" class="secondary" type="button">로그아웃</button>
</div>
<p id="memberLoginMessage" role="alert" aria-live="assertive" hidden></p>
<div class="member-login-future"><b>회원가입은 아직 열지 않았습니다.</b><span>일반회원 오픈 전까지 새 계정 생성·카카오 로그인·본인확인은 제공하지 않습니다.</span></div>
</section>
</main>
</body></html>
