<title>로그인 | K-Volley Lab</title>

<body>
<header class="member-login-head"><a href="index.html"><img src="assets/images/brand/kvl-ball-domestic-navywhite.webp" alt=""><span><b>K-Volley Lab</b><small>MEMBER LOGIN</small></span></a></header>
<main class="member-login-shell">
<section class="member-login-card">
<p class="eyebrow">KVL MEMBER ACCESS</p><h1>로그인</h1>
<p class="intro">선수·팀의 개인화 기능을 위한 로그인 화면입니다. 현재는 관리자·검수 계정만 이용할 수 있으며 일반 회원가입은 아직 열지 않았습니다.</p>
<form id="memberLoginForm">
<label>이메일<input id="memberEmail" type="email" autocomplete="username" required></label>
<label>비밀번호<input id="memberPassword" type="password" autocomplete="current-password" required></label>
<button id="memberLoginButton" type="submit">로그인</button>
</form>
<div id="memberSignedIn" hidden>
<span id="memberRoleBadge"></span><strong id="memberAccountEmail"></strong>
<p>로그인 상태가 확인되었습니다.</p>
<button id="memberContinueButton" type="button">계속 이용하기</button>
<button id="memberLogoutButton" class="secondary" type="button">로그아웃</button>
</div>
<p id="memberLoginMessage" role="status"></p>
<div class="member-login-future"><b>일반회원 준비</b><span>이메일 가입 · 카카오 로그인 · 본인확인은 검수 후 순차 활성화합니다.</span></div>
</section>
</main>
</body></html>
