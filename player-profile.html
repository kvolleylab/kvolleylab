<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>선수 프로필 | K-Volley Lab</title>
  <link rel="stylesheet" href="domestic-style.css" />
  <link rel="stylesheet" href="assets/css/site-theme-light.css" />
  <script src="assets/js/unified-nav.js" defer></script>
  <style>
    .profile-layout{display:grid;grid-template-columns:1.25fr .95fr;gap:22px;margin-top:30px}.table{width:100%;border-collapse:collapse;overflow:hidden;border-radius:14px;background:rgba(255,255,255,.08)}.table th,.table td{padding:14px;border-bottom:1px solid rgba(255,255,255,.12);text-align:left}.table th{color:#d6b25e;width:34%}.stat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.stat{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);border-radius:16px;padding:18px}.stat b{display:block;color:#d6b25e;font-size:26px;margin-bottom:6px}.source-list{margin-top:18px}.source{padding:14px;border:1px solid rgba(255,255,255,.12);border-radius:14px;margin-bottom:10px;background:rgba(255,255,255,.05)}
    .national-summary{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0 18px}.national-chip{display:inline-flex;align-items:center;gap:7px;padding:8px 11px;border-radius:999px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.06);font-size:.84rem;font-weight:800}.national-chip strong{color:#d6b25e}.nt-timeline{position:relative;display:grid;gap:14px;margin-top:16px;padding-left:26px}.nt-timeline:before{content:"";position:absolute;left:8px;top:8px;bottom:8px;width:2px;background:rgba(255,255,255,.16)}.nt-item{position:relative;padding:17px 18px;border:1px solid rgba(255,255,255,.13);border-radius:17px;background:rgba(255,255,255,.06)}.nt-item:before{content:"";position:absolute;left:-24px;top:22px;width:12px;height:12px;border-radius:50%;background:#22d4bf;border:3px solid #071827;box-shadow:0 0 0 2px rgba(34,212,191,.38)}.nt-item.is-senior:before{background:#d6b25e;box-shadow:0 0 0 2px rgba(214,178,94,.42)}.nt-item-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.nt-item h3{margin:5px 0 7px}.nt-level{font-size:.78rem;font-weight:900;letter-spacing:.06em;color:#22d4bf}.nt-item.is-senior .nt-level{color:#d6b25e}.nt-result{flex:none;padding:6px 9px;border-radius:999px;background:rgba(255,255,255,.08);color:#cbd5e1;font-size:.78rem;font-weight:800}.nt-meta{display:flex;gap:12px;flex-wrap:wrap;color:#cbd5e1;font-size:.88rem}.profile-note{margin-top:12px;color:#cbd5e1;font-size:.88rem}.empty-panel{padding:24px;border:1px dashed rgba(255,255,255,.16);border-radius:16px;color:#cbd5e1}.section-head{display:flex;justify-content:space-between;gap:16px;align-items:end;flex-wrap:wrap}.section-head p{margin:0;color:#cbd5e1;font-size:.88rem}
    @media(max-width:820px){.profile-layout{grid-template-columns:1fr}.stat-grid{grid-template-columns:1fr 1fr}.nt-item-head{flex-direction:column}.nt-result{align-self:flex-start}}@media(max-width:520px){.stat-grid{grid-template-columns:1fr}.nt-timeline{padding-left:22px}}
  </style>
</head>
<body>
<header><div class="logo">K-Volley Lab</div></header>
<main>
  <div class="eyebrow">Player Profile · Integrated History</div>
  <h1 id="playerName">선수 프로필</h1>
  <p id="summary">선수 데이터를 불러오는 중입니다.</p>

  <div class="actions">
    <a class="btn ghost" href="player-search.html">검색으로 돌아가기</a>
    <a id="timelineLink" class="btn" href="growth-timeline.html">성장 타임라인 보기</a>
    <a id="cohortLink" class="btn ghost" href="player-cohort.html">출생연도 세대 보기</a>
  </div>

  <section class="profile-layout">
    <article class="card">
      <h3>기본 정보</h3>
      <table class="table"><tbody id="profileTable"></tbody></table>
      <p id="profileNote" class="profile-note"></p>
    </article>
    <article class="card">
      <h3>대표팀 추적 포인트</h3>
      <div class="stat-grid" id="statGrid"></div>
      <p>현재 구축된 공식·검증 대표팀 명단을 Player ID로 연결해 U대표 선발부터 성인대표 진입까지 추적합니다.</p>
    </article>
  </section>

  <section style="margin-top:28px">
    <div class="section-head"><div><div class="eyebrow">National Team Timeline</div><h2>국가대표 경력</h2></div><p>청소년·유스 대표 → 성인대표 순으로 표시</p></div>
    <div id="nationalSummary" class="national-summary"></div>
    <div id="nationalTimeline" class="nt-timeline"></div>
  </section>

  <section style="margin-top:28px">
    <h2>국내 성장 이력</h2>
    <div id="growthCards" class="grid"></div>
  </section>

  <section style="margin-top:28px">
    <h2>출처 기록</h2>
    <div id="sourceList" class="source-list"></div>
  </section>
</main>
<script>
const params=new URLSearchParams(location.search);
const playerId=params.get('id')||'';
const safe=v=>(v===undefined||v===null||v==='')?'-':v;
const esc=v=>String(v??'').replace(/[&<>\'\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
const NATIONAL_BASE='data/national/national_team_history_v1.json';
const NATIONAL_CONTEXT='data/national/national_team_context_v1.json';
const LINK_URL='data/national/player_id_links_v1.json';
const LEGACY_URLS=['data/national/national_team_history_2018_2019.json','data/national/national_team_history_2016_2017.json','data/national/national_team_history_2014_2015.json','data/national/national_team_roster_2014_u18.json','data/national/national_team_history_2012_2013.json','data/national/national_team_roster_2012_u20.json','data/national/national_team_history_2010_2011.json','data/national/national_team_status_2015_corrections.json','data/national/national_team_world_u23_2015.json','data/national/national_team_roster_2010_u18.json','data/national/national_team_research_2010_u20.json','data/national/national_team_roster_2019_u19.json'];
const getJson=async url=>{try{const r=await fetch(url);return r.ok?await r.json():null}catch{return null}};
const isAgeLevel=level=>/^U\d+$/i.test(String(level||'').trim());
const eventSort=e=>`${String(e?.year||'9999').padStart(4,'0')}-${e?.start_date||'99-99'}`;

async function loadProfile(){
  if(!playerId){document.getElementById('summary').textContent='선수 ID가 없습니다.';return;}
  const [master,domestic,growthData,domesticSources,nationalBase,nationalContext,linksData,...legacy]=await Promise.all([
    getJson('data/player_master.json'),getJson('data/domestic_players.json'),getJson('data/domestic_growth_history.json'),getJson('data/domestic_sources.json'),getJson(NATIONAL_BASE),getJson(NATIONAL_CONTEXT),getJson(LINK_URL),...LEGACY_URLS.map(getJson)
  ]);

  const national={events:[...(nationalBase?.events||[])],rosters:[...(nationalBase?.rosters||[])],sources:[...(nationalBase?.sources||[])]};
  const merge=n=>{if(!n)return;national.events=[...(n.events||[]),...national.events];national.rosters=[...(n.rosters||[]),...national.rosters];national.sources=[...(n.sources||[]),...national.sources];};
  merge(nationalContext);legacy.forEach(merge);
  national.events=national.events.filter((e,i,a)=>a.findIndex(x=>x.event_id===e.event_id)===i);

  const links=linksData?.links||[];
  const linkMap=new Map(links.map(x=>[`${x.name_ko}|${x.birth_date}`,x.player_id]));
  national.rosters.forEach(r=>{if(!r.player_id&&linkMap.has(`${r.name_ko}|${r.birth_date}`))r.player_id=linkMap.get(`${r.name_ko}|${r.birth_date}`);});

  const masterPlayer=(master||[]).find(p=>p.player_id===playerId)||null;
  const domesticPlayer=(domestic||[]).find(p=>p.player_id===playerId)||null;
  const linked=links.find(x=>x.player_id===playerId)||null;
  const nationalRows=national.rosters.filter(r=>r.player_id===playerId);
  const eventMap=new Map(national.events.map(e=>[e.event_id,e]));
  const nationalRecords=[];
  const seenEvents=new Set();
  nationalRows.forEach(r=>{const e=eventMap.get(r.event_id);if(!e||seenEvents.has(e.event_id))return;seenEvents.add(e.event_id);nationalRecords.push({event:e,roster:r});});
  nationalRecords.sort((a,b)=>eventSort(a.event).localeCompare(eventSort(b.event)));

  const growthEntry=(growthData||[]).find(g=>g.player_id===playerId);
  const histories=[...(growthEntry?.history||[])].sort((a,b)=>(a.year||9999)-(b.year||9999));
  const firstRoster=nationalRows[0]||null;
  const recentRoster=nationalRecords.length?nationalRecords[nationalRecords.length-1].roster:null;
  const recentGrowth=histories.length?histories[histories.length-1]:null;
  const nameKo=masterPlayer?.name_ko||linked?.name_ko||firstRoster?.name_ko||playerId;
  const nameEn=masterPlayer?.name_en||'';
  const birthDate=masterPlayer?.birth_date||linked?.birth_date||firstRoster?.birth_date||'';
  const birthYear=masterPlayer?.birth_year||Number(String(birthDate).slice(0,4))||null;
  const position=domesticPlayer?.current_position||masterPlayer?.primary_position||recentGrowth?.position||recentRoster?.position||'-';
  const height=masterPlayer?.height_cm||recentGrowth?.height_cm||recentRoster?.height_cm||null;
  const currentTeam=domesticPlayer?.current_team||recentGrowth?.team||'-';
  const currentLevel=domesticPlayer?.current_level||recentGrowth?.level||'-';

  document.title=`${nameKo} | K-Volley Lab`;
  document.getElementById('playerName').innerHTML=`${esc(nameKo)} <span class="meta">${esc(position)}</span>`;
  document.getElementById('summary').textContent=[nameEn,currentTeam,height?`${height}cm`:'키 확인 중',birthYear?`${birthYear}년생`:'출생연도 확인 중'].filter(Boolean).join(' · ');

  const timelineLink=document.getElementById('timelineLink');
  if(histories.length)timelineLink.href=`growth-timeline.html?id=${encodeURIComponent(playerId)}`;else timelineLink.hidden=true;
  const cohortLink=document.getElementById('cohortLink');
  if(birthYear)cohortLink.href=`player-cohort.html?country=KOR&gender=M&birth_year=${birthYear}`;else cohortLink.hidden=true;

  document.getElementById('profileTable').innerHTML=[
    ['선수 ID',playerId],['이름',nameKo],['영문명',nameEn],['생년월일',birthDate],['현재 소속',currentTeam],['현재 단계',currentLevel],['주 포지션',position],['현재 신장',height?`${height}cm`:'-']
  ].map(([k,v])=>`<tr><th>${k}</th><td>${esc(safe(v))}</td></tr>`).join('');
  document.getElementById('profileNote').textContent=masterPlayer?.note||(!masterPlayer&&linked?'Player Master 상세정보는 아직 연결 중이며 대표팀 명단의 Player ID 매칭 정보로 표시하고 있습니다.':'');

  const ageRecords=nationalRecords.filter(x=>isAgeLevel(x.event.level));
  const seniorRecords=nationalRecords.filter(x=>!isAgeLevel(x.event.level));
  const firstAge=ageRecords[0]?.event||null;
  const firstSenior=seniorRecords[0]?.event||null;
  document.getElementById('statGrid').innerHTML=[
    [firstAge?`${firstAge.level} · ${firstAge.year}`:'-','첫 U대표 확인'],[firstSenior?String(firstSenior.year):'-','성인대표 첫 진입'],[nationalRecords.length,'대표팀 대회'],[height?`${height}cm`:'-','현재 확인 신장']
  ].map(([n,t])=>`<div class="stat"><b>${esc(n)}</b><span>${t}</span></div>`).join('');

  document.getElementById('nationalSummary').innerHTML=[
    ['U대표',ageRecords.length],['성인대표',seniorRecords.length],['전체',nationalRecords.length]
  ].map(([label,n])=>`<span class="national-chip">${label} <strong>${n}</strong></span>`).join('');

  document.getElementById('nationalTimeline').innerHTML=nationalRecords.length?nationalRecords.map(({event:e,roster:r})=>{
    const senior=!isAgeLevel(e.level);
    return `<article class="nt-item ${senior?'is-senior':''}"><div class="nt-item-head"><div><div class="nt-level">${esc(e.level||'성인')} · ${esc(e.year||'')}</div><h3>${esc(e.competition_name_ko||e.competition_name_en||'대표팀 대회')}</h3></div><span class="nt-result">${esc(e.result||'결과 확인 중')}</span></div><div class="nt-meta"><span>${esc(e.organization||'-')}</span><span>${e.start_date?`${esc(e.start_date)}${e.end_date?` ~ ${esc(e.end_date)}`:''}`:'일정 확인 중'}</span><span>${r.shirt_no!=null?`#${esc(r.shirt_no)}`:'등번호 -'}</span><span>${esc(r.position||position)}</span>${r.height_cm?`<span>${esc(r.height_cm)}cm</span>`:''}${r.captain?'<span>Captain</span>':''}</div></article>`;
  }).join(''):'<div class="empty-panel">현재 Player ID로 연결된 국가대표 명단 기록이 없습니다. DB가 추가되면 자동으로 표시됩니다.</div>';

  document.getElementById('growthCards').innerHTML=histories.length?histories.map(h=>`<article class="card"><div class="eyebrow">${esc(h.year)} · ${esc(h.level)}</div><h3>${esc(h.team)}</h3><p>${esc(h.position||'-')} · ${h.height_cm?`${esc(h.height_cm)}cm`:'키 확인 중'}${h.grade?` · ${esc(h.grade)}학년`:''}</p></article>`).join(''):'<p>등록된 국내 성장 이력이 없습니다.</p>';

  const sourceMap=new Map((domesticSources||[]).map(s=>[s.source_id,s]));
  const sourceIds=new Set([...(domesticPlayer?.source_ids||[]),...histories.flatMap(h=>h.source_ids||[])]);
  const localSources=[...sourceIds].map(id=>sourceMap.get(id)).filter(Boolean);
  document.getElementById('sourceList').innerHTML=localSources.length?localSources.map(s=>`<div class="source"><b>${esc(s.title)}</b><p class="small">${esc(s.year||'-')} · ${esc(s.source_type||'-')} · ${esc(s.organization||'-')}</p><p>${esc(s.memo||'')}</p></div>`).join(''):'<p>등록된 국내 출처 기록이 없습니다. 대표팀 기록은 각 대표팀 히스토리 DB의 공식 출처를 기준으로 연결됩니다.</p>';
}
loadProfile();
</script>
</body>
</html>
