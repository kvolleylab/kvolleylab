<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>공식자료 보기 | K-Volley Lab</title>
  <meta name="robots" content="noindex,nofollow,noarchive,nosnippet,noimageindex" />
  <link rel="stylesheet" href="assets/css/style.css" />
  <link rel="stylesheet" href="assets/css/site-theme-light.css" />
  <script src="assets/js/unified-nav.js" defer></script>
  <style>
    :root{--bg:#071827;--deep:#04111d;--panel:rgba(255,255,255,.08);--line:rgba(255,255,255,.14);--gold:#d6b25e;--mint:#22d4bf;--text:#fff;--muted:#cbd5e1;--soft:#94a3b8}
    *{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:radial-gradient(circle at top,#102a43 0,var(--bg) 48%,var(--deep) 100%);color:var(--text)}
    main{max-width:1180px;margin:0 auto;padding:48px 20px 80px}.eyebrow{color:var(--mint);font-weight:800}.title{color:var(--gold);font-size:clamp(30px,4vw,48px);margin:10px 0}.meta{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.chip{border:1px solid var(--line);border-radius:999px;padding:7px 10px;color:var(--muted);font-size:13px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:20px;margin-top:18px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:12px 18px;border-radius:999px;text-decoration:none;font-weight:800;border:1px solid var(--line);color:var(--text);background:rgba(255,255,255,.06)}.btn.primary{background:var(--gold);color:var(--bg);border-color:var(--gold)}.viewer{margin-top:22px;border:1px solid var(--line);border-radius:18px;overflow:hidden;background:#fff;min-height:72vh}.viewer iframe{width:100%;height:78vh;border:0;display:block}.empty{padding:48px 24px;text-align:center;color:#334155;background:#fff}.back{display:inline-block;margin-bottom:18px;color:var(--gold);text-decoration:none;font-weight:800}
  </style>
</head>
<body>
  <main>
    <a class="back" href="pamphlet-archive.html">← 공식자료 아카이브</a>
    <div id="app"><p>자료를 불러오는 중입니다.</p></div>
  </main>
  <script>
    const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
    const id=new URLSearchParams(location.search).get('id');
    fetch('assets/data/official-source-archive.json',{cache:'no-store'})
      .then(r=>r.json())
      .then(data=>{
        const s=(data.sources||[]).find(x=>x.source_id===id);
        if(!s) throw new Error('해당 Source ID를 찾을 수 없습니다.');
        document.title=`${s.title} | K-Volley Lab`;
        const driveReady=Boolean(s.drive_file_id);
        const canView=driveReady&&s.public_access==='공개가능';
        const previewUrl=canView?`https://drive.google.com/file/d/${encodeURIComponent(s.drive_file_id)}/preview`:'';
        const directUrl=canView?(s.drive_url||`https://drive.google.com/file/d/${encodeURIComponent(s.drive_file_id)}/view`):'';
        const original=s.original_url?`<a class="btn" href="${esc(s.original_url)}" target="_blank" rel="noopener">공식 원문 페이지</a>`:'';
        const fileButton=canView?`<a class="btn primary" href="${esc(directUrl)}" target="_blank" rel="noopener">PDF 새 창에서 보기</a>`:'';
        const viewer=canView?`<div class="viewer"><iframe src="${esc(previewUrl)}" title="${esc(s.title)} PDF"></iframe></div>`:`<div class="viewer"><div class="empty"><strong>원본은 Google Drive에 보관되어 있습니다.</strong><br><br>${driveReady?'현재 공개 허용 상태가 아니므로 홈페이지에는 PDF를 표시하지 않습니다.':'Drive 원본이 아직 등록되지 않았습니다.'}</div></div>`;
        document.getElementById('app').innerHTML=`
          <div class="eyebrow">Official Source · ${esc(s.source_id)}</div>
          <h1 class="title">${esc(s.title)}</h1>
          <div class="meta"><span class="chip">${esc(s.year)}</span><span class="chip">${esc(s.category)}</span><span class="chip">발행: ${esc(s.publisher||'확인중')}</span><span class="chip">저장: ${esc(s.storage_provider||'-')}</span><span class="chip">Archive: ${esc(s.archive_status)}</span></div>
          <section class="panel"><strong>대회</strong><p>${esc(s.competition_name)}</p><strong>저장 위치</strong><p>${esc(s.drive_folder_path_label||'Google Drive')}</p><strong>공개 상태</strong><p>${esc(s.public_access)} · 라이선스 ${esc(s.license)}</p>${s.notes?`<strong>메모</strong><p>${esc(s.notes)}</p>`:''}<div class="actions">${fileButton}${original}</div></section>
          ${viewer}`;
      })
      .catch(err=>{document.getElementById('app').innerHTML=`<section class="panel"><h1>자료를 열 수 없습니다.</h1><p>${esc(err.message)}</p></section>`});
  </script>
</body>
</html>
