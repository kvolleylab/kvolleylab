  <script>
  (()=>{
    // Keep the live calendar renderer and enhance accessible control states.
    const main=document.querySelector('.cc-main');
    const root=document.getElementById('competitionCalendar');
    const controls=document.getElementById('competitionCalendarControls');
    const heading=document.getElementById('ccCalendarHeading');
    let firstRender=true;
    function connect(){
      // Stay in the 1180px comparison page when using year/month/filter links.
      // Tournament detail links remain untouched, as on the live page.
      main.querySelectorAll('a[href]').forEach(a=>{
        const raw=a.getAttribute('href');
        if(!raw)return;
        let url;
        try{url=new URL(raw,location.href)}catch{return}
        if(url.origin===location.origin&&url.pathname==='/competition-calendar.html'){
          url.pathname='/competition-calendar-homehero-prototype.html';
          const next=url.pathname+url.search+url.hash;
          if(raw!==next)a.setAttribute('href',next);
        }
      });
      const year=controls.querySelector('.cc-year-nav strong')?.textContent;
      const text=year?year+' 대회 일정':'대회 일정';
      if(heading.textContent!==text)heading.textContent=text;
      main.querySelectorAll('.cc-view-switch a').forEach(a=>{
        if(a.classList.contains('active'))a.setAttribute('aria-current','page');
        else a.removeAttribute('aria-current');
      });
      controls.querySelectorAll('[data-filter]').forEach(b=>b.setAttribute('aria-pressed',String(b.classList.contains('active'))));
      // Present the new Hero on first entry instead of the legacy renderer's
      // automatic jump to the current month. Later filter behavior is retained.
      if(firstRender&&root.querySelector('.cc-year-grid,.cc-month-layout,.cc-data-error')){
        firstRender=false;
        requestAnimationFrame(()=>requestAnimationFrame(()=>requestAnimationFrame(()=>{
          if(!location.hash)window.scrollTo({top:0,behavior:'instant'});
        })));
      }
    }
    const observer=new MutationObserver(connect);
    observer.observe(root,{childList:true,subtree:true});
    observer.observe(controls,{childList:true,subtree:true});
    connect();
    addEventListener('DOMContentLoaded',()=>{
      const schedule=document.querySelector('.kvl-global-nav a[href^="competition-calendar.html"]');
      if(schedule){schedule.classList.add('active');schedule.setAttribute('aria-current','page')}
    },{once:true});
  })();
  </script>
