<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>KVL 시안 반응형 검수</title><style>body{margin:0;font:14px Arial,sans-serif;background:#e8edf3}header{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:10px;padding:12px 16px;background:white;border-bottom:1px solid #d7dfeb;flex-wrap:wrap}button,select{padding:8px 12px;background:white;color:#442a70;border:1px solid #cdbce7;border-radius:5px}button[aria-pressed=true]{background:#5b3a8e;color:white}.stage{padding:16px;overflow:auto}iframe{border:0;background:white;transform-origin:top left;box-shadow:0 2px 15px #b1bece}label{display:flex;gap:8px;align-items:center}a{color:#442a70}</style></head><body><header><b>KVL 반응형 검수</b><button data-width="1600" aria-pressed="true">PC · 본문 1180</button><button data-width="390" aria-pressed="false">모바일 390</button><button data-width="360" aria-pressed="false">모바일 360</button><label>화면<select id="view"><option value="overview">대회 한눈에</option><option value="schedule">경기일정·결과</option><option value="groups">예선순위</option><option value="knockout">대진·최종순위</option><option value="rosters">참가국·선수명단</option><option value="resources">공식자료</option></select></label><label>스크린샷 위치<select id="anchor"><option value="top">상단</option><option value="meaning">대회 의미</option><option value="calendar">월간 달력</option><option value="content">선택 화면 본문</option><option value="roster">선수명단</option></select></label><span id="measure"></span></header><div class="stage"><iframe id="preview" title="KVL 반응형 미리보기" width="1600" height="1050" src="/previews/international-v1/index.html?competition=vnl-men-2026"></iframe></div><script>
const frame=document.getElementById('preview');let width=1600;
function resize(){frame.width=width;frame.height=width>680?1050:1050;const scale=Math.min(1,(innerWidth-32)/width);frame.style.transform=`scale(${scale})`;document.querySelector('.stage').style.height=(1050*scale)+'px';document.getElementById('measure').textContent=width+'px viewport';}
document.querySelectorAll('[data-width]').forEach(b=>b.onclick=()=>{width=+b.dataset.width;document.querySelectorAll('[data-width]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));resize();});
document.getElementById('view').onchange=e=>{frame.src='/previews/international-v1/index.html?competition=vnl-men-2026&view='+e.target.value;document.getElementById('anchor').value='top';};
document.getElementById('anchor').onchange=e=>{const d=frame.contentDocument;const selectors={meaning:'[data-kvl-section="qualifications"]',calendar:'[data-kvl-section="calendar"]',content:'.kvl1180-view:not([hidden])',roster:'#team-roster'};if(e.target.value==='top')frame.contentWindow.scrollTo(0,0);else d.querySelector(selectors[e.target.value])?.scrollIntoView({block:'start'});};
addEventListener('resize',resize);resize();
</script></body></html>
