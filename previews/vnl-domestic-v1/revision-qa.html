<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>KVL 모바일 화면 검수</title><style>body{margin:0;padding:24px;font:14px Arial,sans-serif;background:#e8edf3;color:#1b2b43}h1{font-size:19px;margin:0 0 8px}p{font-size:12px;color:#64748b;margin:0 0 20px}.screens{display:flex;align-items:flex-start;gap:22px;flex-wrap:wrap}section{flex:none}h2{font-size:13px;margin:0 0 10px}iframe{display:block;border:1px solid #dce3eb;border-radius:10px;background:white;height:800px;box-shadow:0 4px 15px #cad3e0}a{color:#5b3a8e}</style></head><body><h1>2026 VNL 남자부 · 팀 경기 · Hero 수정 검수</h1><p>같은 Competition Engine V2와 원본 데이터를 사용하는 실제 화면입니다. 각 화면 안에서 스크롤할 수 있습니다.</p><div class="screens"><section><h2>390px · 쿠바 경기 달력</h2><iframe title="390px 팀 달력" width="390" data-anchor=".dv2-team-calendar" src="/previews/vnl-domestic-v1/index.html?competition=vnl-men-2026&view=team&amp;team=CUB"></iframe></section><section><h2>360px · 기본으로 펼쳐진 전체 경기 목록</h2><iframe title="360px 팀 전체 목록" width="360" data-anchor=".dv2-team-match-list" src="/previews/vnl-domestic-v1/index.html?competition=vnl-men-2026&view=team&amp;team=CUB"></iframe></section><section><h2>390px · 국내 Hero (VNL 글자 크기)</h2><iframe title="390px 국내 Hero" width="390" src="/competition-engine.html?competition=university-goseong-men-2026&view=overview"></iframe></section></div><script>document.querySelectorAll('iframe[data-anchor]').forEach(frame=>frame.addEventListener('load',()=>{const doc=frame.contentDocument;const done=()=>{const el=doc.querySelector(frame.dataset.anchor);if(!doc.querySelector('.dv2-utility')||!el||el.hidden)return false;frame.contentWindow.scrollTo(0,el.getBoundingClientRect().top+frame.contentWindow.scrollY-72);return true;};if(done())return;const observer=new MutationObserver(()=>{if(done())observer.disconnect();});observer.observe(doc.body,{subtree:true,attributes:true,childList:true});}));</script></body></html>
