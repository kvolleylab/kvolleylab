<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>KVL 화면 검수</title><style>*{box-sizing:border-box}html,body{margin:0;padding:0}iframe{display:block;border:0}#tools{height:38px;background:#e8edf3;padding:5px 10px;font:12px Arial,sans-serif;display:flex;gap:12px;align-items:center}button{font:inherit;background:white;border:1px solid #abb8c8;border-radius:4px;cursor:pointer}</style></head><body><div id="tools"><span id="label"></span><button id="top">맨 위</button><button id="stakes">진출권 카드</button><button id="full">전체 화면</button></div><iframe id="frame" title="검수 화면"></iframe><script>
const p=new URLSearchParams(location.search),slug=p.get('competition')||'avc-men-cup-2026',width=Number(p.get('width'))||1440,before=p.get('source')==='before',f=document.getElementById('frame');document.body.style.width=width+'px';f.width=width;f.height=p.get('height')||1100;let source='/?competition='+slug;
if(before)source=slug==='avc-men-cup-2026'?'/reference/avc-men-cup.html':slug==='avc-men-continental-2026'?'/reference/international-competition-avc-men-continental-2026.html':'/reference/competition-engine.html?competition='+slug;
if(p.get('view'))source+=(source.includes('?')?'&':'?')+'view='+p.get('view');f.src=source;document.getElementById('label').textContent=(before?'운영 원본':'프로토타입')+' · '+width+'px';document.getElementById('top').onclick=()=>f.contentWindow.scrollTo(0,0);document.getElementById('stakes').onclick=()=>{const d=f.contentDocument;const e=d.querySelector('.kvl-preserved-meaning')||d.querySelector('.kvl1180-stakes-card');e?.scrollIntoView({block:'start'});};document.getElementById('full').onclick=()=>{f.height=f.contentDocument.documentElement.scrollHeight};
</script></body></html>
