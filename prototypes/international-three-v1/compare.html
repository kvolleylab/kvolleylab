<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>KVL 운영·프로토타입 비교 화면</title><style>*{box-sizing:border-box}body{margin:0;padding:22px;background:#e9eef4;color:#17365d;font:14px Arial,sans-serif}header{max-width:1280px;margin:0 auto 18px;display:flex;align-items:center;justify-content:space-between;gap:20px}h1{font-size:21px;margin:0 0 7px}p{margin:0;font-size:12px;color:#68788c}.screens{display:flex;gap:22px;justify-content:center}.screen{flex:none;position:relative;overflow:hidden;border-radius:9px;box-shadow:0 5px 24px #17365d19;background:white}.caption{height:34px;padding:10px 12px;font-size:11px;font-weight:bold;background:#17365d;color:white}.screen:last-child .caption{background:#0d6f3c}iframe{display:block;border:0;transform-origin:top left}button{padding:9px 12px;background:white;border:1px solid #c5d1de;color:#17365d;border-radius:5px;cursor:pointer}a{color:#496985;font-size:12px}</style></head><body><header><div><h1 id="title"></h1><p id="note"></p></div><div><button id="top">맨 위</button> <button id="stakes">국제진출권 카드</button> <a href="/review.html">검수 내역</a></div></header><div class="screens"><section class="screen"><div class="caption">운영 원본 · main 스냅샷</div><iframe id="before" title="운영 원본"></iframe></section><section class="screen"><div class="caption">프로토타입 v1 · 최신 국제대회 템플릿</div><iframe id="after" title="프로토타입"></iframe></section></div><script>
const p=new URLSearchParams(location.search),s=p.get('competition')||'avc-men-cup-2026',w=Number(p.get('width'))||390,names={'avc-men-cup-2026':'2026 AVC 남자컵','asian-games-men-2026':'2026 아시안게임 남자부','asian-games-women-2026':'2026 아시안게임 여자부','avc-men-continental-2026':'2026 AVC 남자 대륙선수권'};document.getElementById('title').textContent=names[s];document.getElementById('note').textContent=(w>680?'PC 1440px · 콘텐츠 1180px':'모바일 '+w+'px')+' · 같은 화면 너비로 비교';
const before=s==='avc-men-cup-2026'?'/reference/avc-men-cup.html':s==='avc-men-continental-2026'?'/reference/international-competition-avc-men-continental-2026.html':'/reference/competition-engine.html?competition='+s;const f1=document.getElementById('before'),f2=document.getElementById('after');f1.src=before;f2.src='/?competition='+s;
const scale=Math.min(1,(innerWidth-66)/(w*2));document.querySelectorAll('.screen').forEach(e=>{e.style.width=(w*scale)+'px';e.style.height=(innerHeight-108)+'px'});[f1,f2].forEach(f=>{f.width=w;f.height=(innerHeight-142)/scale;f.style.transform='scale('+scale+')'});
document.getElementById('top').onclick=()=>[f1,f2].forEach(f=>f.contentWindow.scrollTo(0,0));document.getElementById('stakes').onclick=()=>[f1,f2].forEach(f=>{const d=f.contentDocument,e=d.querySelector('.kvl-preserved-meaning')?.shadowRoot?.querySelector('.kvl1180-stakes-card')||d.querySelector('.kvl1180-stakes-card');if(e){e.scrollIntoView({block:'start',behavior:'instant'});f.contentWindow.scrollBy(0,w<768?-70:-14)}});
</script></body></html>
