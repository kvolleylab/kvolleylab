<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>2026-27 V-리그 | K-Volley Lab</title>
<meta name="description" content="2026-27 V-리그 남자부·여자부 일정, 순위, 참가팀과 포스트시즌.">
<script>
(()=>{
  const p=new URLSearchParams(location.search);
  const raw=(p.get('competition')||'').trim();
  const gender=(p.get('gender')||p.get('division')||'men').toLowerCase();
  const allowed=new Set(['v-league-men-2026-27','v-league-women-2026-27']);
  const slug=allowed.has(raw)?raw:(gender.startsWith('w')?'v-league-women-2026-27':'v-league-men-2026-27');
  p.set('competition',slug);
  if(!p.get('view'))p.set('view','overview');
  p.delete('gender');p.delete('division');
  location.replace('/competition-engine.html?'+p.toString());
})();
</script>
</head><body><p>2026-27 V-리그 페이지로 이동합니다.</p></body></html>
