<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 600" preserveAspectRatio="xMidYMid slice">
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#8f315e"/>
    <stop offset=".48" stop-color="#c65d84"/>
    <stop offset="1" stop-color="#ef9fba"/>
  </linearGradient>
  <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#d77697"/>
    <stop offset="1" stop-color="#8b3358"/>
  </linearGradient>
  <radialGradient id="sun" cx=".82" cy=".58" r=".24">
    <stop offset="0" stop-color="#fff7eb" stop-opacity=".95"/>
    <stop offset=".28" stop-color="#ffd6c9" stop-opacity=".55"/>
    <stop offset="1" stop-color="#ffd6c9" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="fade" x1="0" x2="1">
    <stop offset="0" stop-color="#6f2144" stop-opacity=".72"/>
    <stop offset=".55" stop-color="#6f2144" stop-opacity=".12"/>
    <stop offset="1" stop-color="#6f2144" stop-opacity="0"/>
  </linearGradient>
</defs>

<rect width="1800" height="600" fill="url(#sky)"/>
<rect width="1800" height="600" fill="url(#sun)"/>

