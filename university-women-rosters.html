<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>대학배구 여자부 선수명단 | K-Volley Lab</title>
<link rel="stylesheet" href="assets/css/style.css">
<link rel="stylesheet" href="assets/css/site-theme-light.css">
<script src="assets/js/unified-nav.js" defer></script>
<style>
.wr-main{max-width:1180px;margin:0 auto;padding:28px 18px 64px}.wr-hero{padding:28px;border:1px solid #e6e8ec;border-radius:18px;background:#fff}.wr-hero h1{margin:6px 0 8px}.wr-switch{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}.wr-switch a,.wr-back{display:inline-flex;padding:10px 14px;border:1px solid #d9dde5;border-radius:999px;text-decoration:none;color:inherit;background:#fff}.wr-switch a.is-active{background:#15233b;color:#fff;border-color:#15233b}.wr-controls{display:flex;gap:10px;flex-wrap:wrap;margin:24px 0 14px}.wr-controls input,.wr-controls select{padding:11px 12px;border:1px solid #d9dde5;border-radius:10px;background:#fff}.wr-count{margin:8px 0 14px;color:#667085}.wr-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.wr-card{display:block;padding:16px;border:1px solid #e4e7ec;border-radius:14px;background:#fff;color:inherit;text-decoration:none}.wr-card:hover{border-color:#9aa5b5;transform:translateY(-1px)}.wr-card-top{display:flex;justify-content:space-between;gap:12px}.wr-card h3{margin:0 0 5px;font-size:18px}.wr-school{font-size:13px;color:#667085}.wr-no{font-weight:800;font-size:18px}.wr-meta{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.wr-meta span{padding:5px 8px;border-radius:999px;background:#f3f5f8;font-size:12px}.wr-empty{padding:28px;text-align:center;border:1px dashed #ccd1da;border-radius:14px}.wr-source{margin-top:18px;font-size:12px;color:#7a8494}@media(max-width:900px){.wr-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:620px){.wr-grid{grid-template-columns:1fr}.wr-hero{padding:20px}.wr-controls input,.wr-controls select{width:100%}}
</style>
</head>
<body>
<header class="site-header"><a class="site-logo" href="index.html">K-Volley Lab</a><nav class="site-nav"></nav></header>
<main class="wr-main">
<section class="wr-hero">
<p class="eyebrow">OFFICIAL PAMPHLET SNAPSHOT · WOMEN</p>
<h1 id="wrTitle">대학배구 여자부 선수명단</h1>
<p id="wrDesc">공식 팸플릿 기준 대회별 등록선수를 표시합니다.</p>
<div class="wr-switch"><a id="wrU" href="university-women-rosters.html?competition=u-league">KUSF U-리그</a><a id="wrD" href="university-women-rosters.html?competition=danyang">단양대회</a><a class="wr-back" id="wrBack" href="university-league.html">대회 페이지로 돌아가기</a></div>
</section>
<div class="wr-controls"><input id="wrSearch" type="search" placeholder="선수명 또는 대학 검색"><select id="wrSchool"><option value="All">전체 대학</option></select><select id="wrPos"><option value="All">전체 포지션</option><option>S</option><option>OH</option><option>OP</option><option>MB</option><option>L</option></select><select id="wrGrade"><option value="All">전체 학년</option><option value="4">4학년</option><option value="3">3학년</option><option value="2">2학년</option><option value="1">1학년</option></select></div>
<div id="wrCount" class="wr-count">선수명단을 불러오는 중입니다.</div><div id="wrGrid" class="wr-grid"></div><p id="wrSource" class="wr-source"></p>
</main>
<footer class="site-footer">© 2026 K-Volley Lab. Korean Volleyball Data & Analytics.</footer>
<script>
(()=>{const q=new URLSearchParams(location.search),comp=q.get('competition')==='danyang'?'danyang':'u-league';const cfg=comp==='danyang'?{url:'data/domestic/university-danyang-women-2026.json',title:'2026 대한항공배 단양대회 여자부 선수명단',desc:'7개 대학 · 공식 팸플릿 Snapshot 기준',back:'university-competition-danyang.html',source:'2026 대한항공배 전국대학배구 단양대회 공식 팸플릿'}:{url:'data/domestic/university-u-league-women-2026.json',title:'2026 KUSF U-리그 여자부 선수명단',desc:'6개 대학 · 공식 팸플릿 Snapshot 기준',back:'university-league.html',source:'2026 KUSF U-리그 대학배구 공식 팸플릿'};const el=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]));let players=[];el('wrTitle').textContent=cfg.title;el('wrDesc').textContent=cfg.desc;el('wrBack').href=cfg.back;el(comp==='danyang'?'wrD':'wrU').classList.add('is-active');function render(){const s=el('wrSearch').value.trim().toLowerCase(),school=el('wrSchool').value,pos=el('wrPos').value,grade=el('wrGrade').value;const list=players.filter(p=>(!s||p.name.toLowerCase().includes(s)||p.s.toLowerCase().includes(s))&&(school==='All'||p.s===school)&&(pos==='All'||String(p.p).split('/').includes(pos))&&(grade==='All'||String(p.g)===grade)).sort((a,b)=>a.s.localeCompare(b.s)||Number(a.n)-Number(b.n)||a.name.localeCompare(b.name));el('wrCount').textContent=`등록선수 ${list.length}명 / 전체 ${players.length}명`;el('wrGrid').innerHTML=list.length?list.map(p=>`<a class="wr-card" href="player.html?id=${encodeURIComponent(p.id)}"><div class="wr-card-top"><div><h3>${esc(p.name)}</h3><div class="wr-school">${esc(p.s)} · ${esc(p.id)}</div></div><div class="wr-no">#${esc(p.n)}</div></div><div class="wr-meta"><span>${esc(p.g)}학년</span><span>${esc(p.p)}</span><span>${p.h?`${esc(p.h)}cm`:'키 확인 불가'}</span><span>${esc(p.dob)}</span></div></a>`).join(''):'<div class="wr-empty">조건에 맞는 선수가 없습니다.</div>'}fetch(cfg.url,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error(r.status);return r.json()}).then(data=>{players=data.players||[];const schools=[...new Set(players.map(p=>p.s))].sort((a,b)=>a.localeCompare(b));el('wrSchool').innerHTML='<option value="All">전체 대학</option>'+schools.map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join('');el('wrSource').textContent=`출처: ${cfg.source} · 검수/갱신 2026-08-23`;render()}).catch(()=>{el('wrCount').textContent='선수명단을 불러오지 못했습니다.';el('wrGrid').innerHTML='<div class="wr-empty">Roster 데이터 로딩 오류</div>'});['wrSearch','wrSchool','wrPos','wrGrade'].forEach(id=>el(id).addEventListener(id==='wrSearch'?'input':'change',render))})();
</script>
</body></html>
