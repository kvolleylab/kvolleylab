<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Draft Hub · PC·모바일 검토</title><style>*{box-sizing:border-box}body{margin:0;font:14px Arial,sans-serif;background:#e3e9f0;color:#183653}header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:15px 20px;background:#fff;border-bottom:1px solid #ccd8e4;position:sticky;top:0;z-index:2}h1{font-size:17px;margin:0}nav{display:flex;gap:7px;flex-wrap:wrap}button,a{color:inherit;font:inherit}button{border:1px solid #c7d4e2;background:#f3f6fa;border-radius:6px;padding:7px 10px;cursor:pointer}button[aria-pressed=true]{background:#173e69;color:#fff}main{padding:16px;overflow:auto}.review-stage{position:relative;margin:0 auto}iframe{display:block;border:0;box-shadow:0 4px 28px #17385c20;height:820px;margin:0;transform-origin:top left;background:#f4f7fb;max-width:none}p{margin:10px 0 0;color:#64778e;font-size:12px}@media(max-width:650px){header{align-items:flex-start;flex-direction:column}main{padding:10px}}</style></head><body><header><div><h1>Draft Hub 프로토타입</h1><p>실제 반응형 화면 · 가로 크기 선택</p></div><nav aria-label="검수 화면 크기"><button data-width="1440" aria-pressed="true">PC 1440</button><button data-width="1180" aria-pressed="false">PC 1180</button><button data-width="768" aria-pressed="false">태블릿 768</button><button data-width="390" aria-pressed="false">모바일 390</button><button data-width="360" aria-pressed="false">모바일 360</button><a href="draft-applicants-prototype.html">단독 화면 ↗</a></nav></header><main><div class="review-stage"><iframe id="draftFrame" title="드래프트 프로토타입" src="draft-applicants-prototype.html" style="width:1440px"></iframe></div></main><script>
const frame=document.getElementById('draftFrame'),stage=document.querySelector('.review-stage');let width=Number(location.hash.slice(1))||1440;
function fit(){const available=document.querySelector('main').clientWidth-32,scale=Math.min(1,available/width);frame.style.width=width+'px';frame.style.transform=scale===1?'none':'scale('+scale+')';stage.style.width=width*scale+'px';stage.style.height=820*scale+'px';}
document.querySelectorAll('[data-width]').forEach(b=>b.onclick=()=>{width=Number(b.dataset.width);document.querySelectorAll('[data-width]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));history.replaceState(null,'','#'+width);fit()});window.addEventListener('resize',fit);document.querySelector('[data-width="'+CSS.escape(String(width))+'"]')?.click();
</script></body></html>
