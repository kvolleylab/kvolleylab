<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>KVL 달력 프로토타입 · 실제 화면 검수</title>
<style>
body{margin:0;background:#edf1f5;color:#163047;font:13px Arial,sans-serif}form{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:12px}select,button{font:inherit;padding:6px}iframe{display:block;border:0;background:white}pre{white-space:pre-wrap;padding:12px}details{padding:10px}.capture form,.capture details{display:none}
</style>
<form id="controls">
<label>페이지 <select name="page"><option value="prototype">프로토타입</option><option value="live">운영 달력</option></select></label>
<label>화면 폭 <select name="width"><option>1440</option><option>1180</option><option>768</option><option>390</option><option>360</option></select></label>
<label>보기 <select name="view"><option value="year">연간</option><option value="month">월간</option></select></label>
<label>월 <select name="month"><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option><option>7</option><option>8</option><option>9</option><option selected>10</option><option>11</option><option>12</option></select></label>
<label><input type="checkbox" name="full">전체 높이</label><button>확인</button>
</form>
<div id="stage"><iframe id="preview" title="실제 배포된 달력"></iframe></div>
<details><summary>검수 측정값</summary><pre id="result">불러오는 중</pre></details>
<script>
const form=document.getElementById('controls'),frame=document.getElementById('preview'),result=document.getElementById('result');
const params=new URLSearchParams(location.search),widths=['1440','1180','768','390','360'];
for(const key of ['page','width','view','month'])if([...form.elements[key].options].some(o=>o.value===params.get(key)))form.elements[key].value=params.get(key);
form.elements.full.checked=params.get('full')==='1';
document.body.classList.toggle('capture',params.get('capture')==='1');
form.onsubmit=e=>{e.preventDefault();load()};
function load(){
 const width=form.elements.width.value;
 if(!widths.includes(width))return;
 frame.style.width=width+'px';frame.style.height='850px';
 const query=new URLSearchParams({view:form.elements.view.value,year:'2026',month:form.elements.month.value,v:'20261018-calendar-prototype-v03'});
 frame.src='/competition-calendar'+(form.elements.page.value==='prototype'?'-prototype':'')+'.html?'+query;
 result.textContent='불러오는 중';
}
frame.onload=async()=>{
 const doc=frame.contentDocument,win=frame.contentWindow;
 await doc.fonts.ready;
 if(!doc.querySelector('.cc-year-grid,.cc-month-layout,.cc-data-error'))await new Promise(resolve=>{
  const observer=new MutationObserver(()=>{if(doc.querySelector('.cc-year-grid,.cc-month-layout,.cc-data-error')){observer.disconnect();resolve()}});
  observer.observe(doc.getElementById('competitionCalendar'),{childList:true});
  setTimeout(()=>{observer.disconnect();resolve()},10000);
 });
 await new Promise(resolve=>requestAnimationFrame(()=>requestAnimationFrame(()=>requestAnimationFrame(resolve))));
 if(form.elements.full.checked){frame.style.height=doc.documentElement.scrollHeight+'px';win.scrollTo({top:0,behavior:'instant'})}
 const rect=selector=>{const r=doc.querySelector(selector)?.getBoundingClientRect();return r?{x:r.x,y:r.y,width:r.width,height:r.height}:null};
 const hero=doc.querySelector('.cc-calendar-hero'),style=hero?win.getComputedStyle(hero):null;
 let artwork=null;
 if(style){
  const src=style.backgroundImage.match(/url\(["']?([^"')]+)/)?.[1];
  if(src){const img=new Image();img.src=src;await img.decode();const scale=Math.min(hero.clientWidth/img.naturalWidth,hero.clientHeight/img.naturalHeight);artwork={url:src,naturalWidth:img.naturalWidth,naturalHeight:img.naturalHeight,fit:style.backgroundSize,position:style.backgroundPosition,scale,cropX:Math.max(0,img.naturalWidth*scale-hero.clientWidth),cropY:Math.max(0,img.naturalHeight*scale-hero.clientHeight)}}
 }
 const report={url:win.location.href,width:win.innerWidth,height:win.innerHeight,main:rect('main'),hero:rect('.cc-calendar-hero'),heroCorners:style?[style.borderTopLeftRadius,style.borderTopRightRadius,style.borderBottomRightRadius,style.borderBottomLeftRadius]:null,artwork,controls:rect('.cc-sticky-header'),heroGap:hero?rect('.cc-sticky-header').y-rect('.cc-calendar-hero').y-rect('.cc-calendar-hero').height:null,titleFont:hero?win.getComputedStyle(hero.querySelector('h1')).fontSize:null,monthCards:doc.querySelectorAll('.cc-month-card').length,yearColumns:doc.querySelector('.cc-year-grid')?win.getComputedStyle(doc.querySelector('.cc-year-grid')).gridTemplateColumns:null,monthWeekdays:doc.querySelector('.cc-big-weekdays')?.innerText,monthlyCalendar:rect('.cc-big-calendar'),monthlyCanvas:rect('.cc-big-calendar-layer'),dateCells:doc.querySelectorAll('.cc-date-cell,.cc-big-date-cell').length,bars:[...doc.querySelectorAll('.cc-period-bar,.cc-big-period')].map(a=>({label:a.getAttribute('aria-label'),href:a.getAttribute('href'),style:a.getAttribute('style')})),sidebarCount:doc.querySelectorAll('.kvl-global-sidebar').length,filters:[...doc.querySelectorAll('[data-filter]')].map(b=>({id:b.dataset.filter,text:b.textContent})),horizontalOverflow:doc.documentElement.scrollWidth>win.innerWidth,calendarOverflow:doc.querySelector('.cc-big-calendar')?doc.querySelector('.cc-big-calendar').scrollWidth>doc.querySelector('.cc-big-calendar').clientWidth:false,calendarLinks:[...doc.querySelectorAll('main a[href*="competition-calendar"]')].map(a=>a.getAttribute('href')),brokenImages:[...doc.images].filter(i=>!i.complete||!i.naturalWidth).map(i=>i.src)};
 result.textContent=JSON.stringify(report,null,2);
 // Optional whole-page overview: scale only the outside frame, preserving the
 // real page viewport and layout. No CSS or replacement DOM enters the page.
 if(params.get('fit')==='1'&&form.elements.full.checked){
  const scale=Math.min(1,innerWidth/win.innerWidth,(innerHeight-2)/frame.offsetHeight);
  frame.style.transformOrigin='top left';frame.style.transform='scale('+scale+')';
  const stage=document.getElementById('stage');stage.style.width=(frame.offsetWidth*scale)+'px';stage.style.height=(frame.offsetHeight*scale)+'px';stage.style.overflow='hidden';
 }

};
load();
</script>
</html>
