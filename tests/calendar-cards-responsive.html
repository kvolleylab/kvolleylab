<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>달력 화면 검증 | K-Volley Lab</title>
<style>*{box-sizing:border-box}body{margin:0;background:#eaf0f6;color:#102c49;font:14px Arial,sans-serif}header{background:white;padding:14px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}h1{font-size:18px;margin:0}label{display:flex;gap:6px;align-items:center}select,button{font:inherit;padding:7px;border:1px solid #bacbda;border-radius:6px;background:#fff}main{padding:18px;overflow:auto}.stage{margin:auto;background:white;box-shadow:0 2px 14px #102c4914;position:relative;overflow:hidden}iframe{display:block;border:0;background:#fff;transform-origin:top left}#result{font-size:12px;color:#53718d}</style></head>
<body><header><h1>달력 화면 검증</h1><label>화면 <select id="width"><option value="1600">PC 1600px</option><option value="1180">PC 1180px</option><option value="390">모바일 390px</option><option value="360">모바일 360px</option></select></label><label>보기 <select id="view"><option value="year">연간</option><option value="month">월간</option></select></label><label>월 <select id="month"><option>1</option><option selected>6</option><option>8</option><option>10</option><option>12</option></select></label><button id="apply">화면 적용</button><button id="calendar">달력으로 이동</button><span id="result"></span></header><main><div class="stage"><iframe id="calendarFrame" title="실제 달력 반응형 검증"></iframe></div></main>
<script>
const width=document.getElementById('width'),view=document.getElementById('view'),month=document.getElementById('month'),frame=document.getElementById('calendarFrame'),result=document.getElementById('result');
const q=new URLSearchParams(location.search);for(const id of ['width','view','month'])if(q.has(id))document.getElementById(id).value=q.get(id);
function apply(){const w=Number(width.value),h=w<=680?800:1000,scale=Math.min(1,(innerWidth-36)/w);frame.style.width=w+'px';frame.style.height=h+'px';frame.style.transform='scale('+scale+')';frame.parentElement.style.width=(w*scale)+'px';frame.parentElement.style.height=(h*scale)+'px';frame.src='../competition-calendar-cards-prototype.html?view='+view.value+'&year=2026&month='+month.value+(view.value==='month'?'&date=2026-'+String(month.value).padStart(2,'0')+'-25':'');history.replaceState(null,'','?'+new URLSearchParams({width:width.value,view:view.value,month:month.value}));result.textContent='화면을 불러오는 중';}
document.getElementById('apply').onclick=apply;document.getElementById('calendar').onclick=()=>{const d=frame.contentDocument;frame.contentWindow.scrollTo({top:d.getElementById('competitionCalendar').getBoundingClientRect().top+frame.contentWindow.scrollY-d.querySelector('.cc-sticky-header').offsetHeight-6,behavior:'instant'})};
frame.onload=()=>{const doc=frame.contentDocument;let n=0;const timer=setInterval(()=>{if(!doc.querySelector('.cc-card-grid,.cc-data-error')&&n++<40)return;clearInterval(timer);const grid=doc.querySelector('.cc-year-grid');result.textContent='본문 '+Math.round(doc.querySelector('.cc-main').getBoundingClientRect().width)+'px · '+(grid?frame.contentWindow.getComputedStyle(grid).gridTemplateColumns.split(' ').length+'열':'월간')+' · 가로 넘침 '+(doc.documentElement.scrollWidth>frame.clientWidth?'있음':'없음');},100)};apply();
</script></body></html>
