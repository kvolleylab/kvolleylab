<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Draft Hub 반응형 검수</title>
<style>*{box-sizing:border-box}body{margin:0;background:#eaf0f6;color:#152b47;font:14px Arial,sans-serif}header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:14px 20px;background:#fff}h1{font-size:17px;margin:0}button,select{font:inherit;padding:8px;background:#fff;border:1px solid #bccbda;border-radius:6px}main{padding:18px}.stage{margin:auto;overflow:hidden;box-shadow:0 3px 18px #152b4718}iframe{border:0;display:block;transform-origin:top left}#status{font-size:12px;color:#50657c}</style></head>
<body><header><h1>Draft Hub 반응형 검수</h1><label>화면 <select id="width"><option>1600</option><option>1180</option><option>390</option><option>360</option></select>px</label><button id="apply">화면 적용</button><button id="jump">추첨 확률로 이동</button><span id="status"></span></header><main><div class="stage"><iframe id="draftFrame" title="Draft Hub 실제 화면"></iframe></div></main>
<script>
const frame=document.getElementById('draftFrame'),width=document.getElementById('width'),status=document.getElementById('status');
const q=new URLSearchParams(location.search);if(q.has('width'))width.value=q.get('width');
function apply(){const w=Number(width.value),h=w<=600?850:1000,scale=Math.min(1,(innerWidth-36)/w);Object.assign(frame.style,{width:w+'px',height:h+'px',transform:'scale('+scale+')'});Object.assign(frame.parentElement.style,{width:w*scale+'px',height:h*scale+'px'});frame.src='../draft-hub.html?season=2026-27&gender=M&layout=cards&sort=source';history.replaceState(null,'','?width='+w);status.textContent='로딩 중';}
document.getElementById('apply').onclick=apply;
document.getElementById('jump').onclick=()=>{const d=frame.contentDocument;frame.contentWindow.scrollTo({top:d.querySelector('.da-hub-nav').getBoundingClientRect().top+frame.contentWindow.scrollY-12,behavior:'instant'});status.textContent='가로 넘침 '+(d.documentElement.scrollWidth>d.documentElement.clientWidth?'있음':'없음')+' · 팀 '+d.querySelectorAll('.da-lottery-team').length+'개';};
frame.onload=()=>status.textContent='화면 준비';apply();
</script></body></html>
