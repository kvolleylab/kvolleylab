<script>
(function(){
  'use strict';
  var params=new URLSearchParams(location.search);
  var allowed=new Set(['kovo-cup-men-2026','kovo-cup-women-2026']);

  if(!allowed.has(slug)){

    params.set('competition',slug);
    history.replaceState(null,'',location.pathname+'?'+params.toString());
  }
  window.KVL_COMPETITION_PAGE_V2={production:false,deferRender:true,collectionRoot:'/data/competitions/'};
  window.KVLCompetitionAdapterV2=function(original){
    if(!original||!allowed.has(slug)||original.gender!==(slug.includes('-women-')?'women':'men')){
      throw Error('KOVO Cup prototype data identity mismatch');
    }
    return Object.assign({},original,{
      competitionFamily:'domestic',
      structure:Object.assign({},original.structure,{
        presentation:'domestic-home-v2',
        presentationCategory:'pro-cup',

        divisionKey:original.gender,
        hubUrl:'kovo-cup.html',
        hubCategoryLabel:'프로 V-리그',
        hubLabel:'KOVO컵',
        eyebrow:'PRO VOLLEYBALL · KOVO CUP',
        heroTagline:original.officialName,
        participants:Object.assign({},original.structure.participants,{
          searchLabels:{label:'참가팀 검색',placeholder:'팀명 검색',sortNote:'조별 구분 · 가나다순'}
        })
      }),
      divisionLinks:[
        {key:'men',label:'남자부',gender:'men',url:'/kovo-cup-domestic-template-prototype.html?competition=kovo-cup-men-2026'},
        {key:'women',label:'여자부',gender:'women',url:'/kovo-cup-domestic-template-prototype.html?competition=kovo-cup-women-2026'}
      ],
      genderLinks:{
        men:'/kovo-cup-domestic-template-prototype.html?competition=kovo-cup-men-2026',
        women:'/kovo-cup-domestic-template-prototype.html?competition=kovo-cup-women-2026'
