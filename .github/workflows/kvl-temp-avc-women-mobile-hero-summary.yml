name: KVL temp AVC women mobile hero summary

on:
  push:
    branches:
      - temp-avc-women-mobile-hero-summary-2
    paths:
      - '.github/workflows/kvl-temp-avc-women-mobile-hero-summary.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: temp-avc-women-mobile-hero-summary-2
      - name: Patch AVC women mobile hero and overview summary
        shell: python
        run: |
          from pathlib import Path
          path = Path('international-competition-avc-women-continental-2026.html')
          text = path.read_text(encoding='utf-8')

          old_meta = '<p class="avc-meta">2026-08-21(금) ~ 2026-08-30(일) · 중국 톈진 · 경기시간은 한국시간(KST) 기준</p>'
          new_meta = '<p class="avc-meta"><span>2026-08-21(금) ~ 2026-08-30(일)</span><span class="kvl-hero-meta-sep"> · </span><br class="kvl-mobile-meta-break">중국 톈진 · 경기시간은 한국시간(KST) 기준</p>'
          if old_meta not in text:
              raise SystemExit('hero meta target not found')
          text = text.replace(old_meta, new_meta, 1)

          old_head = '<div class="avc-section-head"><div><p class="eyebrow">TOURNAMENT SNAPSHOT</p><h2>대회 한눈에 보기</h2></div><p>카드를 누르면 해당 페이지로 바로 이동합니다.</p></div>'
          new_head = '<div class="avc-section-head"><div><p class="eyebrow">TOURNAMENT SNAPSHOT</p><h2>대회 한눈에 보기</h2></div><p class="avc-overview-result"><strong>우승 태국</strong><span>LA올림픽 직행</span></p></div>'
          if old_head not in text:
              raise SystemExit('overview head target not found')
          text = text.replace(old_head, new_head, 1)

          marker = '  </style>'
          css = '''    .kvl-mobile-meta-break{display:none}.avc-overview-result{margin:0!important;text-align:right!important}.avc-overview-result strong,.avc-overview-result span{display:block}.avc-overview-result strong{color:var(--avc-dark);font-size:14px;font-weight:1000}.avc-overview-result span{margin-top:3px;color:#9a6d12;font-size:12px;font-weight:1000}\n    @media(max-width:680px){body[data-avc-gender="women"] .avc-status{display:none!important}body[data-avc-gender="women"] .kvl-hero-meta-sep{display:none!important}body[data-avc-gender="women"] .kvl-mobile-meta-break{display:block!important}body[data-avc-gender="women"] .avc-meta{line-height:1.65!important}body[data-avc-gender="women"] #overview .avc-section-head{align-items:flex-end!important;flex-direction:row!important;justify-content:space-between!important;gap:12px!important}body[data-avc-gender="women"] #overview .avc-section-head>div{min-width:0}body[data-avc-gender="women"] #overview .avc-section-head h2{font-size:22px!important;white-space:nowrap}body[data-avc-gender="women"] #overview .avc-overview-result{flex:0 0 auto!important;line-height:1.25!important}body[data-avc-gender="women"] #overview .avc-overview-result strong{font-size:13px!important}body[data-avc-gender="women"] #overview .avc-overview-result span{font-size:11px!important}}\n'''
          if marker not in text:
              raise SystemExit('style closing marker not found')
          text = text.replace(marker, css + marker, 1)
          path.write_text(text, encoding='utf-8')
      - name: Commit patch
        run: |
          git config user.name 'kvolleylab'
          git config user.email 'kvolleylab.team@gmail.com'
          git add international-competition-avc-women-continental-2026.html
          git commit -m 'ui: refine AVC women mobile hero summary'
          git push origin HEAD:temp-avc-women-mobile-hero-summary-2
