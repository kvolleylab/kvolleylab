name: Temporary AVC Women Mobile Score Colors
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-avc-women-mobile-score-colors.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Patch mobile knockout score colors
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('international-competition-avc-women-continental-2026.html')
          s=p.read_text(encoding='utf-8')
          marker='      html body[data-avc-gender="women"] #knockout .avc-bracket-team strong{overflow:visible!important;letter-spacing:-.045em!important;text-overflow:clip!important}\n'
          block=marker+'      html body[data-avc-gender="women"] #knockout .avc-bracket-team b{color:#263b2e!important}\n      html body[data-avc-gender="women"] #knockout .avc-bracket-team.is-winner b{color:var(--avc-primary)!important}\n'
          if 'html body[data-avc-gender="women"] #knockout .avc-bracket-team.is-winner b{color:var(--avc-primary)!important}' not in s:
              if marker not in s:
                  raise SystemExit('mobile knockout color insertion marker not found')
              s=s.replace(marker,block,1)
          p.write_text(s,encoding='utf-8')
          PY
          rm .github/workflows/tmp-avc-women-mobile-score-colors.yml
          git config user.name 'kvolleylab'
          git config user.email 'kvolleylab.team@gmail.com'
          git add international-competition-avc-women-continental-2026.html .github/workflows/tmp-avc-women-mobile-score-colors.yml
          git commit -m 'fix: align AVC women mobile bracket score colors'
          git push origin main
