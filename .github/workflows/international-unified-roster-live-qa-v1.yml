name: International Unified Roster v1 Live Pages QA

on:
  push:
    branches: [main]
    paths:
      - 'teams.html'
      - 'assets/js/kvl-international-countries-v1.js'
      - 'assets/js/kvl-international-unified-roster-v1.js'
      - 'assets/css/kvl-international-unified-roster-v1.css'
      - 'tests/international-unified-roster-live-qa-v1.cjs'
      - '.github/workflows/international-unified-roster-live-qa-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify runtime integrity and expected approved country sources
        run: |
          node --check tests/international-unified-roster-live-qa-v1.cjs
          node --test tests/international-unified-roster-live-v1.test.cjs
      - name: Install isolated Chromium
        run: |
          npm install --prefix "$RUNNER_TEMP/kvl-unified-live" --no-audit --no-fund playwright@1.56.1
          node "$RUNNER_TEMP/kvl-unified-live/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Inspect actual HTTPS production country roster PC and mobile
        env:
          KVL_PLAYWRIGHT_PATH: ${{ runner.temp }}/kvl-unified-live/node_modules/playwright
        run: node tests/international-unified-roster-live-qa-v1.cjs
      - name: Store actual production screenshots and QA report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kvl-international-unified-live-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/kvl-international-unified-live-report.json
            ${{ runner.temp }}/kvl-unified-live-*.png
          retention-days: 14
          if-no-files-found: ignore
