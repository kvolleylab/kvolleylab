name: KVL International Country v1 Live Pages QA

on:
  push:
    branches: [main]
    paths:
      - 'teams.html'
      - 'assets/js/kvl-teams-directory-v1.js'
      - 'assets/js/kvl-international-countries-v1.js'
      - 'assets/css/kvl-international-countries-v1.css'
      - 'data/international/country-directory-v1.json'
      - 'data/international/country-roster-index-v1.json'
      - 'data/international/country-selection-index-v1.json'
      - 'data/international/country-source-config-v1.json'
      - 'tests/international-country-live-qa-v1.cjs'
      - '.github/workflows/international-country-live-qa-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  actual-pages:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate live QA syntax and published source registry
        run: |
          node --check tests/international-country-live-qa-v1.cjs
          node scripts/build-international-country-index-v1.cjs --check
          node --test tests/international-country-history-v1.test.cjs
      - name: Install isolated Chromium
        run: |
          npm install --prefix "$RUNNER_TEMP/kvl-country-live" --no-audit --no-fund playwright@1.56.1
          node "$RUNNER_TEMP/kvl-country-live/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Test real published https://kvolleylab.com country directory
        env:
          KVL_PLAYWRIGHT_PATH: ${{ runner.temp }}/kvl-country-live/node_modules/playwright
        run: node tests/international-country-live-qa-v1.cjs
      - name: Upload real production screenshots and QA JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kvl-international-country-live-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/kvl-international-live-report.json
            ${{ runner.temp }}/kvl-international-live-*.png
          if-no-files-found: ignore
          retention-days: 14
