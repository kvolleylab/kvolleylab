name: Polish shared mobile combined ranking
on:
  push:
    branches: [tmp-common-combined-ranking-v1-polish]
    paths:
      - '.github/workflows/tmp-common-combined-ranking-polish.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp-common-combined-ranking-v1-polish
          fetch-depth: 0
      - name: Equalize shared row geometry and bump cache
        run: |
          python - <<'PY'
          from pathlib import Path
          css=Path('assets/css/kvl-mobile-competition-template-v3.css')
          s=css.read_text(encoding='utf-8')
          old='html body[data-avc-gender] #groups .kvl-shared-combined-result{display:flex!important;width:100%!important;min-height:38px!important;'
          new='html body[data-avc-gender] #groups .kvl-shared-combined-result{display:flex!important;width:100%!important;min-height:37px!important;'
          if old not in s: raise SystemExit('shared result geometry marker missing')
          css.write_text(s.replace(old,new,1),encoding='utf-8')
          for f in ['international-competition-avc-men-continental-2026.html','international-competition-avc-women-continental-2026.html','templates/competition-page-v1.html']:
            p=Path(f); t=p.read_text(encoding='utf-8')
            oldv='assets/css/kvl-mobile-competition-template-v3.css?v=20260908-4'
            if oldv not in t: raise SystemExit(f'cache marker missing: {f}')
            p.write_text(t.replace(oldv,'assets/css/kvl-mobile-competition-template-v3.css?v=20260908-5'),encoding='utf-8')
          PY
          git rm .github/workflows/tmp-common-combined-ranking-polish.yml
          git config user.name "kvolleylab"
          git config user.email "kvolleylab.team@gmail.com"
          git add -A
          git commit -m "fix: equalize shared combined ranking row geometry"
          git push origin HEAD:tmp-common-combined-ranking-v1-polish
