name: Temporary AVC Women PC Combined Order
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-avc-women-pc-order.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Patch AVC women combined ranking desktop order
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('international-competition-avc-women-continental-2026.html')
          s=p.read_text(encoding='utf-8')
          marker='    @media(max-width:1100px){#schedule .cd-match{grid-template-columns:90px minmax(420px,1fr)}#schedule .cd-match-board{width:100%;max-width:600px}.avc-podium{grid-template-columns:repeat(2,1fr)}}\n'
          block='''    @media(min-width:681px){\n      body[data-avc-gender="women"] #groups .kvl-women-combined-v3-line{grid-template-columns:64px 30px 118px 90px 60px 104px 104px 78px 150px!important}\n      body[data-avc-gender="women"] #groups .kvl-women-combined-v3-line>:nth-child(1){grid-column:1!important}\n      body[data-avc-gender="women"] #groups .kvl-women-combined-v3-line>:nth-child(2){grid-column:2!important}\n      body[data-avc-gender="women"] #groups .kvl-women-combined-v3-line>:nth-child(3){grid-column:3!important}\n      body[data-avc-gender="women"] #groups .kvl-women-combined-v3-line>:nth-child(4){grid-column:9!important}\n      body[data-avc-gender="women"] #groups .kvl-women-combined-v3-line>:nth-child(5){grid-column:4!important}\n      body[data-avc-gender="women"] #groups .kvl-women-combined-v3-line>:nth-child(6){grid-column:5!important}\n      body[data-avc-gender="women"] #groups .kvl-women-combined-v3-line>:nth-child(7){grid-column:6!important}\n      body[data-avc-gender="women"] #groups .kvl-women-combined-v3-line>:nth-child(8){grid-column:7!important}\n      body[data-avc-gender="women"] #groups .kvl-women-combined-v3-line>:nth-child(9){grid-column:8!important}\n      body[data-avc-gender="women"] #groups .kvl-women-combined-v3-result:not(.is-out){justify-content:center!important;color:var(--avc-dark)!important}\n      body[data-avc-gender="women"] #groups .kvl-women-combined-v3-result:not(.is-out) b{border-color:var(--avc-line)!important;background:#FFF2F7!important;color:var(--avc-dark)!important}\n      body[data-avc-gender="women"] #groups .kvl-women-combined-v3-result:not(.is-out) small{color:var(--avc-dark)!important}\n    }\n'''
          if block not in s:
              if marker not in s:
                  raise SystemExit('desktop insertion marker not found')
              s=s.replace(marker,block+marker,1)
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name 'kvolleylab'
          git config user.email 'kvolleylab.team@gmail.com'
          git add international-competition-avc-women-continental-2026.html
          git commit -m 'fix: separate AVC women desktop combined ranking order'
          git push origin main
