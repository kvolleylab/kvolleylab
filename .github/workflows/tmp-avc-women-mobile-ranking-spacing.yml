name: Temporary AVC Women Mobile Ranking Spacing Patch
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-avc-women-mobile-ranking-spacing.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Patch mobile combined-ranking spacing and badges
        run: |
          python - <<'PY'
          from pathlib import Path

          path=Path('international-competition-avc-women-continental-2026.html')
          s=path.read_text(encoding='utf-8')

          old_table='body[data-avc-gender="women"] #groups .kvl-women-combined-v3-table{min-width:742px!important}'
          new_table='body[data-avc-gender="women"] #groups .kvl-women-combined-v3-table{min-width:762px!important}'
          if old_table not in s:
            raise SystemExit('expected mobile table width not found')
          s=s.replace(old_table,new_table,1)

          old_grid='body[data-avc-gender="women"] #groups .kvl-women-combined-v3-line{grid-template-columns:44px 28px 82px 130px 76px 54px 96px 96px 76px!important;gap:6px!important;min-height:54px;padding:8px 6px!important}'
          new_grid='body[data-avc-gender="women"] #groups .kvl-women-combined-v3-line{grid-template-columns:44px 28px 102px 130px 76px 54px 96px 96px 76px!important;gap:6px!important;min-height:54px;padding:8px 6px!important}'
          if old_grid not in s:
            raise SystemExit('expected mobile grid columns not found')
          s=s.replace(old_grid,new_grid,1)

          old_b='body[data-avc-gender="women"] #groups .kvl-women-combined-v3-result b{min-height:26px!important;padding:4px 7px!important;font-size:11px!important}'
          new_b='body[data-avc-gender="women"] #groups .kvl-women-combined-v3-result b{width:62px!important;min-width:62px!important;min-height:26px!important;padding:4px 5px!important;font-size:10px!important}'
          if old_b not in s:
            raise SystemExit('expected mobile result badge rule not found')
          s=s.replace(old_b,new_b,1)

          old_out='body[data-avc-gender="women"] #groups .kvl-women-combined-v3-result.is-out{padding:5px 6px!important}'
          new_out='body[data-avc-gender="women"] #groups .kvl-women-combined-v3-result.is-out{justify-content:flex-start!important;padding:0!important;background:transparent!important;border-radius:0!important}\n      body[data-avc-gender="women"] #groups .kvl-women-combined-v3-result.is-out b{width:62px!important;min-width:62px!important;min-height:26px!important;padding:0!important;border:1px solid #e5e7eb!important;border-radius:999px!important;background:#f3f4f6!important;color:#6b7280!important;font-size:8px!important}'
          if old_out not in s:
            raise SystemExit('expected mobile out badge rule not found')
          s=s.replace(old_out,new_out,1)

          path.write_text(s,encoding='utf-8')
          PY
          git config user.name 'kvolleylab'
          git config user.email 'kvolleylab.team@gmail.com'
          git add international-competition-avc-women-continental-2026.html
          git commit -m 'fix: tune AVC women mobile ranking badges and spacing'
          git push origin HEAD:main
