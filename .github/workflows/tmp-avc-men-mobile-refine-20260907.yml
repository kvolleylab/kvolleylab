name: Temporary AVC Men Mobile Refinement

on:
  push:
    paths:
      - '.github/workflows/tmp-avc-men-mobile-refine-20260907.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply patch
        run: python .github/tmp_avc_men_mobile_refine_20260907.py
      - name: Commit patch
        run: |
          git config user.name "kvolleylab"
          git config user.email "kvolleylab.team@gmail.com"
          git add international-competition-avc-men-continental-2026.html international-competition-avc-women-continental-2026.html assets/css/kvl-mobile-competition-template-v1.css assets/css/kvl-competition-template-v1.css assets/js/kvl-competition-template-v1.js templates/competition-page-v1.html docs/KVL_MOBILE_COMPETITION_TEMPLATE_V2.md
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "fix: refine AVC men mobile template behavior"
          git push origin HEAD:main
