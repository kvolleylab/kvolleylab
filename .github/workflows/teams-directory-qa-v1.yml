name: KVL Team Directory v1 Integration and Browser QA

on:
  pull_request:
    paths:
      - 'teams.html'
      - 'assets/js/kvl-teams-directory-v1.js'
      - 'assets/css/kvl-teams-directory-v1.css'
      - 'data/team-rosters/v-league/coaches-2026-27.json'
      - 'tests/teams-directory-v1.test.cjs'
      - 'tests/teams-directory-browser-qa-v1.cjs'
      - 'tests/teams-directory-live-qa-v1.cjs'
      - '.github/workflows/teams-directory-qa-v1.yml'
  push:
    branches: [feature/teams-directory-v1-20261118]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify new team directory JavaScript and unit test syntax
        run: |
          node --check assets/js/kvl-teams-directory-v1.js
          node --check tests/teams-directory-v1.test.cjs
          node --check tests/teams-directory-browser-qa-v1.cjs
          node --check tests/teams-directory-live-qa-v1.cjs
      - name: Test real current KOVO rosters, university teams and safe profile references
        run: node --test tests/teams-directory-v1.test.cjs
      - name: Install isolated Chromium
        run: |
          npm install --prefix "$RUNNER_TEMP/kvl-td-browser" --no-audit --no-fund playwright@1.56.1
          node "$RUNNER_TEMP/kvl-td-browser/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Verify men/women, category navigation, roster reuse and mobile screenshots
        env:
          KVL_PLAYWRIGHT_PATH: ${{ runner.temp }}/kvl-td-browser/node_modules/playwright
        run: node tests/teams-directory-browser-qa-v1.cjs
      - name: Upload desktop/mobile screenshots and structured QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kvl-teams-directory-v1-browser-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/kvl-teams-directory-browser-report.json
            ${{ runner.temp }}/kvl-teams-*.png
          retention-days: 14
          if-no-files-found: ignore
