name: Validate university Player Master

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate completed university datasets
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          expected_ids = [f'KVL-P-{n:06d}' for n in range(1, 230)]
          targets = [
              Path('data/master/player_master.json'),
              Path('data/master/player_master_229_v2.json'),
          ]

          for path in targets:
              rows = json.loads(path.read_text(encoding='utf-8'))
              ids = [row['system']['player_id'] for row in rows]
              assert len(rows) == 229, f'{path}: expected 229, got {len(rows)}'
              assert ids == expected_ids, f'{path}: IDs are not continuous'
              assert len(ids) == len(set(ids)), f'{path}: duplicate IDs found'
              assert all(row['system']['status'] == 'active' for row in rows), f'{path}: inactive record found'
              assert all(row['system']['data_confidence'] == 'reviewed' for row in rows), f'{path}: unreviewed record found'
              assert all(row['system']['id_status'] == 'permanent' for row in rows), f'{path}: non-permanent ID found'
              print(f'OK: {path} — 229 continuous reviewed permanent records')

          website_rows = json.loads(targets[1].read_text(encoding='utf-8'))
          schools = {
              row.get('current_roster', {}).get('school_code')
              for row in website_rows
              if row.get('current_roster', {}).get('school_code')
          }
          assert len(schools) == 15, f'Expected 15 universities, got {len(schools)}'
          print('OK: 15 university teams')
          PY
