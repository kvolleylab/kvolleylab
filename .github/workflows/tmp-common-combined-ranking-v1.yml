name: Build shared mobile combined ranking component
on:
  push:
    branches: [tmp-common-combined-ranking-v1]
    paths:
      - '.github/workflows/tmp-common-combined-ranking-v1.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp-common-combined-ranking-v1
          fetch-depth: 0
      - name: Create shared component and migrate AVC pages
        run: |
          python - <<'PY'
          from pathlib import Path

          repo = Path('.')

          # 1) Shared renderer: one mobile component for live/complete combined ranking.
          js_path = repo / 'assets/js/kvl-mobile-combined-ranking-v1.js'
          js_path.write_text(r'''/* K-Volley Lab shared mobile combined ranking v1
   One renderer for every competition page. Only state/data vary by tournament. */
(function(){
  'use strict';
  const esc = value => String(value ?? '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
  const flagCell = row => `<span class="kvl-shared-combined-flag kvl-comp-flag-cell">${row.flag ? `<img src="${esc(row.flag)}" alt="${esc(row.team)} 국기" loading="lazy">` : ''}</span>`;
  const resultCell = row => {
    const result = row.result || {};
    if (!result.label) return '<span class="kvl-shared-combined-result"></span>';
    return `<span class="kvl-shared-combined-result${result.out ? ' is-out' : ''}"><b>${esc(result.label)}</b>${result.detail ? `<small>${esc(result.detail)}</small>` : ''}</span>`;
  };
  function render(root, options){
    if (!root) return;
    const opts = options || {};
    const complete = opts.state === 'complete';
    const rows = Array.isArray(opts.rows) ? opts.rows : [];
    const head = complete
      ? ['종합순위','국기','국가','결과','승리 경기수','승점','세트 득실률','득점 득실률','조순위']
      : ['종합순위','국기','국가','조순위','승리 경기수','승점','세트 득실률','득점 득실률'];
    const header = `<div class="kvl-shared-combined-line is-head" role="row">${head.map(label => `<span role="columnheader"${label === '국기' ? ' class="kvl-shared-combined-flag-head"' : ''}>${label}</span>`).join('')}</div>`;
    const body = rows.map(row => {
      const common = `<span class="kvl-shared-combined-rank">${esc(row.rank)}위</span>${flagCell(row)}<strong class="kvl-shared-combined-team">${esc(row.team)}</strong>`;
      const stats = `<span class="kvl-shared-combined-stat">${esc(row.wins)}승</span><span class="kvl-shared-combined-stat">${esc(row.points)}</span><span class="kvl-shared-combined-stat">${esc(row.setRatio)}</span><span class="kvl-shared-combined-stat">${esc(row.pointRatio)}</span>`;
      const cells = complete
        ? `${common}${resultCell(row)}${stats}<span class="kvl-shared-combined-stat">${esc(row.poolRank)}</span>`
        : `${common}<span class="kvl-shared-combined-stat">${esc(row.poolRank)}</span>${stats}`;
      return `<div class="kvl-shared-combined-line${row.isKorea ? ' is-korea' : ''}" role="row">${cells}</div>`;
    }).join('');
    root.innerHTML = `<div class="kvl-shared-combined-table ${complete ? 'is-complete' : 'is-live'}" role="table" aria-label="예선 종합순위" data-kvl-common-component="combined-ranking-v1" data-state="${complete ? 'complete' : 'live'}">${header}${body}</div>`;
  }
  window.KVLMobileCombinedRanking = Object.freeze({version:'1.0.0', render});
})();
''', encoding='utf-8')

          # 2) Shared geometry: women-calibrated values become the only mobile geometry for this component.
          css_path = repo / 'assets/css/kvl-mobile-competition-template-v3.css'
          css = css_path.read_text(encoding='utf-8')
          marker = '/* KVL SHARED COMBINED RANKING V1 */'
          if marker not in css:
            css += r'''

/* KVL SHARED COMBINED RANKING V1 */
.kvl-shared-combined-mobile{display:none}
@media (max-width:680px){
  html body[data-avc-gender] #groups .kvl-women-combined-desktop,
  html body[data-avc-gender] #groups .kvl-men-combined-desktop{display:none!important}
  html body[data-avc-gender] #groups .kvl-shared-combined-mobile{display:block!important}
  html body[data-avc-gender] #groups .avc-combined{overflow-x:auto!important;overflow-y:hidden!important;-webkit-overflow-scrolling:touch!important;overscroll-behavior-x:contain!important}
  html body[data-avc-gender] #groups .kvl-shared-combined-table{box-sizing:border-box;background:#fff!important}
  html body[data-avc-gender] #groups .kvl-shared-combined-table.is-live{min-width:692px!important}
  html body[data-avc-gender] #groups .kvl-shared-combined-table.is-complete{min-width:770px!important}
  html body[data-avc-gender] #groups .kvl-shared-combined-line{display:grid!important;align-items:center!important;gap:6px!important;min-height:54px!important;padding:8px 6px!important;border-top:1px solid #edf3ef!important;box-sizing:border-box!important;background:#fff!important}
  html body[data-avc-gender] #groups .kvl-shared-combined-line:first-child{border-top:0!important}
  html body[data-avc-gender] #groups .kvl-shared-combined-table.is-live .kvl-shared-combined-line{grid-template-columns:44px 28px 110px 110px 76px 54px 96px 96px!important}
  html body[data-avc-gender] #groups .kvl-shared-combined-table.is-complete .kvl-shared-combined-line{grid-template-columns:44px 28px 110px 130px 76px 54px 96px 96px 76px!important}
  html body[data-avc-gender] #groups .kvl-shared-combined-line.is-head{min-height:42px!important;background:var(--avc-soft)!important;color:var(--avc-dark)!important;font-size:10px!important;font-weight:1000!important}
  html body[data-avc-gender] #groups .kvl-shared-combined-line.is-head>span{display:flex!important;visibility:visible!important;opacity:1!important;align-items:center!important;justify-content:center!important;justify-self:stretch!important;text-align:center!important;white-space:nowrap!important}
  html body[data-avc-gender] #groups .kvl-shared-combined-flag-head{width:28px!important;justify-self:center!important}
  html body[data-avc-gender] #groups .kvl-shared-combined-flag{display:flex!important;width:28px!important;height:19px!important;align-items:center!important;justify-content:center!important;justify-self:center!important}
  html body[data-avc-gender] #groups .kvl-shared-combined-flag img{display:block!important;width:28px!important;height:19px!important;object-fit:contain!important}
  html body[data-avc-gender] #groups .kvl-shared-combined-rank{display:flex!important;align-items:center!important;justify-content:center!important;color:var(--avc-primary)!important;font-size:13px!important;font-weight:1000!important;text-align:center!important;white-space:nowrap!important}
  html body[data-avc-gender] #groups .kvl-shared-combined-team{display:flex!important;align-items:center!important;justify-content:center!important;color:var(--avc-dark)!important;font-size:13px!important;font-weight:900!important;text-align:center!important;white-space:nowrap!important}
  html body[data-avc-gender] #groups .kvl-shared-combined-stat{display:flex!important;align-items:center!important;justify-content:center!important;color:#708078!important;font-size:11px!important;font-weight:800!important;text-align:center!important;white-space:nowrap!important}
  html body[data-avc-gender] #groups .kvl-shared-combined-result{display:flex!important;width:100%!important;min-height:38px!important;align-items:center!important;justify-content:center!important;gap:6px!important;padding:0!important;color:var(--avc-dark)!important;font-size:11px!important;line-height:1.1!important}
  html body[data-avc-gender] #groups .kvl-shared-combined-result b{display:inline-flex!important;width:62px!important;min-width:62px!important;min-height:26px!important;align-items:center!important;justify-content:center!important;padding:4px 5px!important;border:1px solid var(--avc-line)!important;border-radius:999px!important;background:var(--avc-soft)!important;color:var(--avc-dark)!important;font-size:10px!important;box-sizing:border-box!important;white-space:nowrap!important}
  html body[data-avc-gender] #groups .kvl-shared-combined-result small{margin:0!important;color:var(--avc-dark)!important;font-size:11px!important;font-weight:1000!important;white-space:nowrap!important}
  html body[data-avc-gender] #groups .kvl-shared-combined-result.is-out b{border-color:#e5e7eb!important;background:#f3f4f6!important;color:#6b7280!important;font-size:8px!important}
  html body[data-avc-gender] #groups .kvl-shared-combined-line.is-korea{background:var(--avc-soft)!important}
}
'''
            css_path.write_text(css, encoding='utf-8')

          # 3) Men: preserve desktop renderer, replace mobile renderer with shared component.
          men_path = repo / 'international-competition-avc-men-continental-2026.html'
          men = men_path.read_text(encoding='utf-8')
          men = men.replace('assets/css/kvl-mobile-competition-template-v3.css?v=20260908-3','assets/css/kvl-mobile-competition-template-v3.css?v=20260908-4')
          if 'assets/js/kvl-mobile-combined-ranking-v1.js' not in men:
            men = men.replace('<script src="assets/js/unified-nav.js?v=20260802-3" defer></script>', '<script src="assets/js/kvl-mobile-combined-ranking-v1.js?v=20260908-1" defer></script>\n  <script src="assets/js/unified-nav.js?v=20260802-3" defer></script>')
          start = men.index('    const rows=projection.combinedAll||[];')
          end_marker = '    root.innerHTML=`<div class="kvl-men-combined-desktop">${desktop}</div><div class="kvl-men-combined-mobile"><div class="kvl-men-combined-table ${complete?\'is-complete\':\'is-live\'}"><div class="kvl-men-combined-line is-head">${head}</div>${body}</div></div>`;\n'
          end = men.index(end_marker, start) + len(end_marker)
          men_replacement = r'''    const rows=projection.combinedAll||[];
    const complete=projection.poolComplete;
    const opponentSeed=seed=>({1:8,8:1,4:5,5:4,2:7,7:2,3:6,6:3})[seed]||'';
    const sharedRows=rows.map(r=>({
      rank:r.combinedRank,
      team:r.team,
      flag:flagUrl(r.team),
      poolRank:`${r.pool}조 ${r.poolPosition}위`,
      wins:r.wins,
      points:r.matchPoints,
      setRatio:fmtRatio(r.setsFor,r.setsAgainst),
      pointRatio:r.pointMatches?fmtRatio(r.pointsFor,r.pointsAgainst):'-',
      isKorea:r.team==='대한민국',
      result:complete?(r.seed?{label:'8강 진출',detail:`${r.seed}-${opponentSeed(r.seed)}`,out:false}:{label:'조별리그 탈락',detail:'',out:true}):null
    }));
    root.innerHTML=`<div class="kvl-men-combined-desktop">${desktop}</div><div class="kvl-shared-combined-mobile"></div>`;
    const sharedRoot=root.querySelector('.kvl-shared-combined-mobile');
    if(window.KVLMobileCombinedRanking)window.KVLMobileCombinedRanking.render(sharedRoot,{state:complete?'complete':'live',rows:sharedRows});
'''
          men = men[:start] + men_replacement + men[end:]
          men_path.write_text(men, encoding='utf-8')

          # 4) Women: preserve desktop table, use the same mobile renderer as men.
          women_path = repo / 'international-competition-avc-women-continental-2026.html'
          women = women_path.read_text(encoding='utf-8')
          women = women.replace('assets/css/kvl-mobile-competition-template-v3.css?v=20260908-2','assets/css/kvl-mobile-competition-template-v3.css?v=20260908-4')
          if 'assets/js/kvl-mobile-combined-ranking-v1.js' not in women:
            women = women.replace('<script src="assets/js/avc-continental-gender-runtime.js?v=20260907-1" defer></script>', '<script src="assets/js/kvl-mobile-combined-ranking-v1.js?v=20260908-1" defer></script>\n  <script src="assets/js/avc-continental-gender-runtime.js?v=20260907-1" defer></script>')
          target_prefix = "    document.getElementById('combinedRankingRootV3').innerHTML=`<div class=\"kvl-women-combined-v3-table\">"
          line_start = women.index(target_prefix)
          line_end = women.index('\n', line_start) + 1
          old_line = women[line_start:line_end]
          if 'kvl-women-combined-v3-line is-head' not in old_line:
            raise SystemExit('women combined renderer line shape changed')
          women_replacement = r'''    const legacyCombined=`<div class="kvl-women-combined-desktop"><div class="kvl-women-combined-v3-table"><div class="kvl-women-combined-v3-line is-head"><span>종합순위</span><span>국기</span><span>국가</span><span>결과</span><span>승리 경기수</span><span>승점</span><span>세트 득실률</span><span>득점 득실률</span><span>조순위</span></div>${rows.map((r,i)=>`<div class="kvl-women-combined-v3-line ${r.team==='대한민국'?'is-korea':''}"><span class="kvl-women-combined-v3-rank">${i+1}위</span><span class="kvl-comp-flag-cell">${standingFlag(r.team)}</span><strong class="kvl-women-combined-v3-team">${esc(r.team)}</strong>${resultCell(r)}<span class="kvl-women-combined-v3-stat">${r.wins}승</span><span class="kvl-women-combined-v3-stat">${r.leaguePoints}</span><span class="kvl-women-combined-v3-stat">${ratioText(r.setsFor,r.setsAgainst)}</span><span class="kvl-women-combined-v3-stat">${ratioText(r.pointsFor,r.pointsAgainst)}</span><span class="kvl-women-combined-v3-stat">${r.pool}조 ${r.poolRank}위</span></div>`).join('')}</div></div><div class="kvl-shared-combined-mobile"></div>`;
    const combinedRoot=document.getElementById('combinedRankingRootV3');
    combinedRoot.innerHTML=legacyCombined;
    const sharedRows=rows.map((r,i)=>{const q=qfByTeam.get(r.team);return{rank:i+1,team:r.team,flag:flagUrl(r.team),poolRank:`${r.pool}조 ${r.poolRank}위`,wins:r.wins,points:r.leaguePoints,setRatio:ratioText(r.setsFor,r.setsAgainst),pointRatio:ratioText(r.pointsFor,r.pointsAgainst),isKorea:r.team==='대한민국',result:q?{label:'8강 진출',detail:`${q.seed}-${q.opponentSeed}`,out:false}:{label:'조별리그 탈락',detail:'',out:true}}});
    if(window.KVLMobileCombinedRanking)window.KVLMobileCombinedRanking.render(combinedRoot.querySelector('.kvl-shared-combined-mobile'),{state:'complete',rows:sharedRows});
'''
          women = women[:line_start] + women_replacement + women[line_end:]
          women_path.write_text(women, encoding='utf-8')

          # 5) Starter template loads the same shared component.
          template_path = repo / 'templates/competition-page-v1.html'
          template = template_path.read_text(encoding='utf-8')
          template = template.replace('assets/css/kvl-mobile-competition-template-v3.css?v=20260908-1','assets/css/kvl-mobile-competition-template-v3.css?v=20260908-4')
          if 'assets/js/kvl-mobile-combined-ranking-v1.js' not in template:
            template = template.replace('<script src="assets/js/unified-nav.js" defer></script>', '<script src="assets/js/unified-nav.js" defer></script>\n  <script src="assets/js/kvl-mobile-combined-ranking-v1.js?v=20260908-1" defer></script>')
          template_path.write_text(template, encoding='utf-8')

          # 6) Template documentation: renderer is now a real shared component, not page-specific CSS parity.
          doc_path = repo / 'docs/KVL_MOBILE_COMPETITION_TEMPLATE_V5.md'
          doc = doc_path.read_text(encoding='utf-8')
          doc_marker = '## Shared combined ranking component v1'
          if doc_marker not in doc:
            doc += r'''

## Shared combined ranking component v1
- Source: `assets/js/kvl-mobile-combined-ranking-v1.js`
- Geometry: `assets/css/kvl-mobile-competition-template-v3.css` under `KVL SHARED COMBINED RANKING V1`.
- AVC men/women must use this renderer for the mobile `예선 종합순위`; page-specific mobile renderers are not the source of truth.
- Live state columns: `종합순위 | 국기 | 국가 | 조순위 | 승리 경기수 | 승점 | 세트 득실률 | 득점 득실률`.
- Complete state columns: `종합순위 | 국기 | 국가 | 결과 | 승리 경기수 | 승점 | 세트 득실률 | 득점 득실률 | 조순위`.
- The state changes the column set only. Font size, flag size, row height, widths, spacing, and alignment are shared and cannot vary by competition or gender.
- 390px is the primary mobile verification width. A page is not complete until the rendered DOM contains `data-kvl-common-component="combined-ranking-v1"` and the `국기` header is visible as its own column.
'''
            doc_path.write_text(doc, encoding='utf-8')

          # Sanity assertions before committing.
          for path in [men_path,women_path,template_path]:
            text=path.read_text(encoding='utf-8')
            if 'kvl-mobile-combined-ranking-v1.js?v=20260908-1' not in text:
              raise SystemExit(f'missing shared component include: {path}')
          if 'data-kvl-common-component="combined-ranking-v1"' not in js_path.read_text(encoding='utf-8'):
            raise SystemExit('shared renderer marker missing')
          PY
          git rm .github/workflows/tmp-common-combined-ranking-v1.yml
          git config user.name "kvolleylab"
          git config user.email "kvolleylab.team@gmail.com"
          git add assets/js/kvl-mobile-combined-ranking-v1.js assets/css/kvl-mobile-competition-template-v3.css international-competition-avc-men-continental-2026.html international-competition-avc-women-continental-2026.html templates/competition-page-v1.html docs/KVL_MOBILE_COMPETITION_TEMPLATE_V5.md .github/workflows/tmp-common-combined-ranking-v1.yml
          git commit -m "refactor: use one shared mobile combined ranking component"
          git push origin HEAD:tmp-common-combined-ranking-v1
