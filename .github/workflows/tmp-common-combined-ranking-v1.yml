name: Build shared mobile combined ranking component
on:
  push:
    branches: [tmp-common-combined-ranking-v1]
    paths:
      - '.github/workflows/tmp-common-combined-ranking-v1.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp-common-combined-ranking-v1
          fetch-depth: 0
      - name: Create shared component and migrate AVC pages
        run: |
          python scripts/tmp-common-combined-ranking-v1.py
          git rm .github/workflows/tmp-common-combined-ranking-v1.yml scripts/tmp-common-combined-ranking-v1.py
          git config user.name "kvolleylab"
          git config user.email "kvolleylab.team@gmail.com"
          git add -A
          git commit -m "refactor: use one shared mobile combined ranking component"
          git push origin HEAD:tmp-common-combined-ranking-v1
