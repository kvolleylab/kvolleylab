name: KVL National Age-Team History QA v1
on:
  pull_request:
    paths:
      - 'national-team-history.html'
      - 'national-team.html'
      - 'assets/js/national-team-history.js'
      - 'assets/js/national-team-home-v2.js'
      - 'assets/js/kvl-global-sidebar-v1.js'
      - 'assets/js/unified-nav.js'
      - 'assets/js/national-player-link-status-v1.js'
      - 'player-cohort.html'
      - 'assets/css/national-age-history-v1.css'
      - 'assets/img/national-team/age-hero-approved-pc-v1.svg'
      - 'assets/img/national-team/age-hero-approved-mobile-v1.svg'
      - 'tests/national-age-history-v1.test.cjs'
      - 'tests/national-age-history-browser-v1.cjs'
      - '.github/workflows/kvl-national-age-qa-v1.yml'
  workflow_dispatch:
jobs:
  age-history:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify Javascript syntax
        run: |
          node --check assets/js/national-team-history.js
          node --check assets/js/kvl-global-sidebar-v1.js
          node --check assets/js/unified-nav.js
          node --check assets/js/national-player-link-status-v1.js
          node --check assets/js/national-team-home-v2.js
          node --check tests/national-age-history-v1.test.cjs
          node --check tests/national-age-history-browser-v1.cjs
      - name: Install isolated DOM test runner
        run: npm install --no-save --prefix "$RUNNER_TEMP/kvl-age-jsdom" jsdom@24.1.3
      - name: Check age history and national menu regressions
        env:
          KVL_JSDOM_PATH: ${{ runner.temp }}/kvl-age-jsdom/node_modules/jsdom
        run: node --test tests/national-age-history-v1.test.cjs
      - name: Install isolated Chromium for desktop and mobile review
        run: |
          npm install --no-save --prefix "$RUNNER_TEMP/kvl-age-browser" playwright@1.56.1
          node "$RUNNER_TEMP/kvl-age-browser/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Verify actual age-history layout and interactive filters in Chromium
        env:
          KVL_PLAYWRIGHT_PATH: ${{ runner.temp }}/kvl-age-browser/node_modules/playwright
        run: node tests/national-age-history-browser-v1.cjs
      - name: Preserve desktop/mobile visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kvl-national-age-ui-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/kvl-age-history-browser-report.json
            ${{ runner.temp }}/kvl-national-age-*.png
          retention-days: 14
          if-no-files-found: ignore
