name: V-League Draft Review Snapshot v1
on:
  push:
    branches: [feature/draft-profile-affiliation-20261114]
    paths:
      - '.github/workflows/vleague-draft-review-snapshot-v1.yml'
      - 'data/kovo/official-notices/2026-27/draft_registration_bridge.json'
      - 'data/draft-applicants/2026-27/education-v1.json'
      - 'assets/js/kvl-vleague-draft-bridge-v1.js'
      - 'scripts/kvl_vleague_draft_seed_reviewed.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reviewed-snapshot:
    if: github.repository == 'kvolleylab/kvolleylab'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify reviewed source and exact published bridge bytes
        run: |
          python -B scripts/kvl_vleague_draft_seed_reviewed.py --check
          python -B scripts/kvl_vleague_draft_sync.py --check
          python -B scripts/kvl_draft_education_v1.py --check
          python -B -m unittest discover -s tests -p 'test_kvl_vleague_draft_sync.py' -v
      - name: Pack real V-League source snapshot for isolated screen review
        uses: actions/upload-artifact@v4
        with:
          name: kvl-vleague-roster-review-v1
          path: |
            data/competitions/v-league-men-2026-27/data.json
            data/competitions/v-league-women-2026-27/data.json
            data/competitions/v-league-men-2026-27/rosters.json
            data/competitions/v-league-women-2026-27/rosters.json
            data/kovo/official-notices/2026-27/draft_registration_bridge.json
            data/draft-applicants/2026-27/education-v1.json
            assets/js/kvl-vleague-draft-bridge-v1.js
            assets/img/team-logos/v-league/2026-27/men/*.svg
            assets/img/team-logos/v-league/2026-27/women/*.svg
          if-no-files-found: error
          retention-days: 14
