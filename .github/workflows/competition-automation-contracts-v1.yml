name: Competition Automation Contracts v1

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/competition-automation-contracts-v1.yml'
      - '.github/workflows/kovo-official-notices-collector.yml'
      - 'scripts/kovo_official_*.py'
      - 'scripts/kovo_verify_roster_contracts.py'
      - 'scripts/kvl_player*.py'
      - 'scripts/scaffold-competition-v2.cjs'
      - 'scripts/kvl-competition-operations-v1.cjs'
      - 'data/player-updates/**'
      - 'templates/competition-*.starter.json'
      - 'tests/test_kovo_official_notices.py'
      - 'tests/test_kovo_verify_roster_contracts.py'
      - 'tests/test_kvl_player*.py'
      - 'tests/competition-operations-v1.test.cjs'
      - 'tests/competition-v2-config.test.cjs'
      - 'tests/competition-v2-production-starter.test.cjs'
  push:
    branches: [main]
    paths:
      - '.github/workflows/competition-automation-contracts-v1.yml'
      - 'scripts/kvl_player*.py'
      - 'scripts/scaffold-competition-v2.cjs'
      - 'scripts/kvl-competition-operations-v1.cjs'
      - 'data/player-updates/config.json'
      - 'data/player-updates/master_targets.json'
      - 'data/player-updates/reviewed_mappings.json'
      - 'templates/competition-operations-v1.starter.json'

permissions:
  contents: read

concurrency:
  group: competition-automation-contracts-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify official events, public review exports and read-only MASTER plans
        run: |
          python -B -m unittest discover -s tests -p 'test_kovo_official_notices.py' -v
          python -B -m unittest discover -s tests -p 'test_kovo_verify_roster_contracts.py' -v
          python -B -m unittest discover -s tests -p 'test_kvl_player*.py' -v
      - name: Verify page compatibility and operating-package readiness
        run: |
          node tests/competition-v2-config.test.cjs
          node tests/competition-v2-production-starter.test.cjs
          node tests/competition-operations-v1.test.cjs
