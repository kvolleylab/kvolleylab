name: Temporary AVC Women Stat Center Patch
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-avc-women-stat-center.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Center combined ranking stat columns
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('international-competition-avc-women-continental-2026.html')
          s = p.read_text(encoding='utf-8')
          old = 'body[data-avc-gender="women"] #groups .kvl-women-combined-v3-stat{font-size:11px!important}'
          new = old + '\n      body[data-avc-gender="women"] #groups .kvl-women-combined-v3-line>:nth-child(n+5){display:flex!important;align-items:center!important;justify-content:center!important;justify-self:stretch!important;text-align:center!important}'
          if old not in s:
              raise SystemExit('target CSS rule not found')
          if 'kvl-women-combined-v3-line>:nth-child(n+5)' not in s:
              s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          git config user.name 'kvolleylab'
          git config user.email 'kvolleylab.team@gmail.com'
          git add international-competition-avc-women-continental-2026.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix: center AVC women combined ranking stats'
          git push origin main
