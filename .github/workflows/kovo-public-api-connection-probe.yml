name: KOVO Public API Connection Probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/kovo-public-api-connection-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kovo-public-api-connection-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Probe public KOVO notice APIs anonymously
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import sys
          import urllib.error
          import urllib.parse
          import urllib.request

          HOST = "https://user-api.kovo.co.kr"
          TESTS = [
              (
                  "list",
                  "/contents/news/official-notices?" + urllib.parse.urlencode({
                      "page": 0,
                      "size": 10,
                      "sort": "order,desc",
                      "pinned": "false",
                  }),
              ),
              ("detail", "/contents/news/official-notices/155583?page=3"),
          ]

          failures = []
          for label, endpoint in TESTS:
              url = HOST + endpoint
              request = urllib.request.Request(
                  url,
                  headers={
                      "Accept": "application/json",
                      "User-Agent": "KVolleyLab-Public-Notice-Connectivity-Probe/1.0",
                  },
                  method="GET",
              )
              print(f"CHECK {label}: endpoint={endpoint}", flush=True)
              try:
                  with urllib.request.urlopen(request, timeout=18) as response:
                      status = response.status
                      content_type = response.headers.get("Content-Type", "")
                      raw = response.read(1_000_001)
                  print(f"  HTTP={status} content_type={content_type} bytes={len(raw)}")
                  if len(raw) > 1_000_000:
                      raise ValueError("Response exceeds 1 MB safety limit")
                  if status != 200:
                      raise ValueError(f"Unexpected HTTP status: {status}")
                  if "json" not in content_type.lower():
                      raise ValueError("Expected application/json")
                  data = json.loads(raw)
                  if isinstance(data, dict):
                      print(f"  JSON=object keys={list(data)[:14]}")
                      for key in ("content", "items", "results", "data"):
                          group = data.get(key)
                          if isinstance(group, list):
                              print(f"  {key}_count={len(group)}")
                              print(f"  sample_ids={[x.get('id') for x in group[:4] if isinstance(x, dict)]}")
                              break
                      if label == "detail":
                          current = data.get("current", data)
                          if isinstance(current, dict):
                              print(f"  detail_id={current.get('id')}")
                              print(f"  detail_keys={list(current)[:20]}")
                              print(f"  has_html_bodies={bool(current.get('bodies'))}")
                  elif isinstance(data, list):
                      print(f"  JSON=array length={len(data)}")
                  else:
                      print(f"  JSON=unexpected_type {type(data).__name__}")
                  print(f"PASS {label}", flush=True)
              except urllib.error.HTTPError as exc:
                  failures.append(label)
                  print(f"FAIL {label}: HTTP={exc.code}", flush=True)
              except (urllib.error.URLError, TimeoutError, ValueError, json.JSONDecodeError) as exc:
                  failures.append(label)
                  print(f"FAIL {label}: {type(exc).__name__}: {str(exc)[:220]}", flush=True)
              except Exception as exc:
                  failures.append(label)
                  print(f"FAIL {label}: {type(exc).__name__}: {str(exc)[:220]}", flush=True)

          print("RESULT:", "FAILED=" + ",".join(failures) if failures else "BOTH_PUBLIC_APIS_ACCESSIBLE")
          sys.exit(1 if failures else 0)
          PY
