name: KVL layout draft JSONB binding regression v1

on:
  pull_request:
    paths:
      - 'supabase/functions/admin-competition-layout-drafts/index.ts'
      - 'tests/kvl-layout-draft-jsonb-v1.test.cjs'
      - 'tests/kvl-layout-draft-jsonb-postgres-v1.cjs'
      - '.github/workflows/kvl-layout-jsonb-binding-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgres-jsonb:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: kvl_fixture
          POSTGRES_PASSWORD: fixture_only_not_a_real_secret
          POSTGRES_DB: kvl_fixture
        ports:
          - 5432:5432
        options: >-
          --health-cmd=pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Static admin and JSONB binding guards
        run: node tests/kvl-layout-draft-jsonb-v1.test.cjs
      - name: Install pinned Postgres.js test driver (disposable, no credentials)
        run: |
          mkdir -p "$RUNNER_TEMP/kvl-pg-driver"
          cd "$RUNNER_TEMP/kvl-pg-driver"
          npm init -y >/dev/null
          npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund postgres@3.4.5
      - name: Validate actual Postgres 17 JSONB object round-trip
        env:
          KVL_FIXTURE_DB_URL: postgres://kvl_fixture:fixture_only_not_a_real_secret@127.0.0.1:5432/kvl_fixture
        run: |
          NODE_PATH="$RUNNER_TEMP/kvl-pg-driver/node_modules" node tests/kvl-layout-draft-jsonb-postgres-v1.cjs
