name: Temporary AVC women mobile polish

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-avc-women-mobile-polish.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch AVC women mobile page and data
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          html_path = Path('international-competition-avc-women-continental-2026.html')
          data_path = Path('data/competitions/avc-women-continental-2026.json')
          workflow_path = Path('.github/workflows/tmp-avc-women-mobile-polish.yml')

          html = html_path.read_text(encoding='utf-8')

          old_vars = "let scheduleStage='전체',schedulePool='전체',allMatches=[];"
          new_vars = "let scheduleStage='전체',schedulePool='전체',allMatches=[],competitionVenue='';"
          assert old_vars in html, 'schedule state marker not found'
          html = html.replace(old_vars, new_vars, 1)

          old_detail = "const matchRow=m=>{const detail=`${m.stage}${m.stage==='조별리그'&&m.group?` · ${m.group}조`:''} · 중국 현지 ${m.localTime||''}`;return"
          new_detail = "const matchRow=m=>{const venue=competitionVenue?` · ${competitionVenue}`:'';const detail=`${m.stage}${m.stage==='조별리그'&&m.group?` · ${m.group}조`:''}${venue} · 중국 현지 ${m.localTime||''}`;return"
          assert old_detail in html, 'match detail marker not found'
          html = html.replace(old_detail, new_detail, 1)

          old_fetch = "then(data=>{allMatches=data.matches||[];renderCalendar(allMatches);"
          new_fetch = "then(data=>{competitionVenue=data.venueKo||data.venue||'';allMatches=data.matches||[];renderCalendar(allMatches);"
          assert old_fetch in html, 'data fetch marker not found'
          html = html.replace(old_fetch, new_fetch, 1)
          html = html.replace('avc-women-continental-2026.json?v=20260905-2', 'avc-women-continental-2026.json?v=20260907-1', 1)

          mobile_css = r'''
    @media(max-width:680px){
      body[data-avc-gender="women"] #schedule .cd-match-board{grid-template-columns:minmax(0,1fr) 46px minmax(0,1fr)!important;gap:8px!important;align-items:center!important}
      body[data-avc-gender="women"] #schedule .cd-side.is-left{grid-template-columns:34px minmax(0,1fr)!important;gap:3px!important}
      body[data-avc-gender="women"] #schedule .cd-side.is-right{grid-template-columns:minmax(0,1fr) 34px!important;gap:3px!important}
      body[data-avc-gender="women"] #schedule .cd-inline-logo{box-sizing:border-box!important;width:34px!important;height:24px!important;padding:0!important}
      body[data-avc-gender="women"] #schedule .cd-side strong{overflow:visible!important;font-size:18px!important;line-height:1!important;letter-spacing:-.045em!important;text-overflow:clip!important;white-space:nowrap!important}
      body[data-avc-gender="women"] #schedule .cd-score{width:46px!important;font-size:18px!important;line-height:1!important;justify-self:center!important;text-align:center!important;font-variant-numeric:tabular-nums!important}

      html body[data-avc-gender="women"] #knockout .avc-bracket-match{display:grid!important;grid-template-columns:minmax(0,1fr) minmax(0,1fr)!important;column-gap:0!important;overflow:hidden!important}
      html body[data-avc-gender="women"] #knockout .avc-bracket-match-head{grid-column:1/-1!important;padding:7px 9px!important;border-radius:11px 11px 0 0!important;font-size:9px!important}
      html body[data-avc-gender="women"] #knockout .avc-bracket-match-head strong{font-size:10px!important}
      html body[data-avc-gender="women"] #knockout .avc-bracket-match-head + .avc-bracket-team{grid-column:1!important;display:grid!important;grid-template-columns:30px minmax(0,1fr) 20px!important;gap:3px!important;min-height:44px!important;padding:7px 0 7px 7px!important;border-top:0!important}
      html body[data-avc-gender="women"] #knockout .avc-bracket-match-head + .avc-bracket-team + .avc-bracket-team{grid-column:2!important;display:grid!important;grid-template-columns:20px minmax(0,1fr) 30px!important;gap:3px!important;min-height:44px!important;padding:7px 7px 7px 0!important;border-top:0!important}
      html body[data-avc-gender="women"] #knockout .avc-bracket-team img{width:30px!important;height:21px!important;margin:0!important}
      html body[data-avc-gender="women"] #knockout .avc-bracket-match-head + .avc-bracket-team img{grid-column:1!important;grid-row:1!important;justify-self:start!important}
      html body[data-avc-gender="women"] #knockout .avc-bracket-match-head + .avc-bracket-team strong{grid-column:2!important;grid-row:1!important;justify-self:start!important;text-align:left!important}
      html body[data-avc-gender="women"] #knockout .avc-bracket-match-head + .avc-bracket-team b{grid-column:3!important;grid-row:1!important;text-align:right!important}
      html body[data-avc-gender="women"] #knockout .avc-bracket-match-head + .avc-bracket-team + .avc-bracket-team b{grid-column:1!important;grid-row:1!important;text-align:left!important}
      html body[data-avc-gender="women"] #knockout .avc-bracket-match-head + .avc-bracket-team + .avc-bracket-team b::before{content:'-';margin-right:1px}
      html body[data-avc-gender="women"] #knockout .avc-bracket-match-head + .avc-bracket-team + .avc-bracket-team strong{grid-column:2!important;grid-row:1!important;justify-self:end!important;text-align:right!important}
      html body[data-avc-gender="women"] #knockout .avc-bracket-match-head + .avc-bracket-team + .avc-bracket-team img{grid-column:3!important;grid-row:1!important;justify-self:end!important}
      html body[data-avc-gender="women"] #knockout .avc-bracket-team strong,html body[data-avc-gender="women"] #knockout .avc-bracket-team b{font-size:14px!important;line-height:1!important;white-space:nowrap!important}
      html body[data-avc-gender="women"] #knockout .avc-bracket-team strong{overflow:visible!important;text-overflow:clip!important}
    }
'''
          style_close = '  </style>'
          assert style_close in html, 'style closing marker not found'
          html = html.replace(style_close, mobile_css + style_close, 1)
          html_path.write_text(html, encoding='utf-8')

          data = data_path.read_text(encoding='utf-8')
          city_marker = '  "city": "Tianjin",\n  "organizer":'
          city_replacement = '  "city": "Tianjin",\n  "venue": "Tianjin Olympic Center Gymnasium",\n  "venueKo": "톈진 올림픽 센터 체육관",\n  "organizer":'
          assert city_marker in data, 'city marker not found'
          data = data.replace(city_marker, city_replacement, 1)

          source_marker = '    {"type":"official","label":"Volleyball World · 경기일정/결과","url":"https://en.volleyballworld.com/volleyball/competitions/avc-women-continental/schedule/"},\n    {"type":"official","label":"AVC 2026 개최 일정"'
          source_replacement = '    {"type":"official","label":"Volleyball World · 경기일정/결과","url":"https://en.volleyballworld.com/volleyball/competitions/avc-women-continental/schedule/"},\n    {"type":"official","label":"Volleyball World · 대회 프리뷰/경기장","url":"https://en.volleyballworld.com/volleyball/competitions/avc-women-continental/news/race-for-asia-s-first-olympic-ticket-to-get-underway-in-tianjin"},\n    {"type":"official","label":"AVC 2026 개최 일정"'
          assert source_marker in data, 'source marker not found'
          data = data.replace(source_marker, source_replacement, 1)
          data_path.write_text(data, encoding='utf-8')

          if workflow_path.exists():
              workflow_path.unlink()
          PY
      - name: Commit patched files
        shell: bash
        run: |
          git config user.name "kvolleylab"
          git config user.email "kvolleylab.team@gmail.com"
          git add international-competition-avc-women-continental-2026.html data/competitions/avc-women-continental-2026.json .github/workflows/tmp-avc-women-mobile-polish.yml
          git commit -m "fix: polish AVC women mobile knockout and venue"
          git push origin HEAD:main
