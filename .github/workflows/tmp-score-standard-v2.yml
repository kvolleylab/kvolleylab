name: Temporary Score Color Standardizer

on:
  push:
    branches: [tmp-score-standard-v2]
    paths:
      - '.github/workflows/tmp-score-standard-v2.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp-score-standard-v2
          fetch-depth: 0
      - name: Apply score color standard
        run: |
          python - <<'PY'
          from pathlib import Path

          css_path = Path('assets/css/avc-bracket-standard.css')
          css = css_path.read_text(encoding='utf-8')
          old_css = '.avc-bracket-standard .avc-bracket-team b{color:#9a6d12!important;'
          new_css = '.avc-bracket-standard .avc-bracket-team b{color:#4B5563!important;'
          if old_css not in css:
              raise SystemExit('shared bracket score color target not found')
          css = css.replace(old_css, new_css, 1)
          css_path.write_text(css, encoding='utf-8')

          html_path = Path('international-competition-avc-women-continental-2026.html')
          html = html_path.read_text(encoding='utf-8')
          old_loser = 'html body[data-avc-gender="women"] #knockout .avc-bracket-team b{color:#263b2e!important}'
          new_loser = 'html body[data-avc-gender="women"] #knockout .avc-bracket-team b{color:#4B5563!important}'
          old_winner = 'html body[data-avc-gender="women"] #knockout .avc-bracket-team.is-winner b{color:var(--avc-primary)!important}'
          new_winner = 'html body[data-avc-gender="women"] #knockout .avc-bracket-team.is-winner b{color:#4B5563!important}'
          if old_loser not in html or old_winner not in html:
              raise SystemExit('AVC women mobile score override target not found')
          html = html.replace(old_loser, new_loser, 1).replace(old_winner, new_winner, 1)
          html_path.write_text(html, encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          git config user.name 'kvolleylab'
          git config user.email 'kvolleylab.team@gmail.com'
          git add assets/css/avc-bracket-standard.css international-competition-avc-women-continental-2026.html
          git diff --cached --quiet && exit 0
          git commit -m 'style: standardize AVC bracket score color'
          git push origin HEAD:tmp-score-standard-v2
