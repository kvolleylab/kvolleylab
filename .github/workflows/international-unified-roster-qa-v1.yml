name: International Unified Roster v1 Integration and Chromium

on:
  pull_request:
    paths:
      - 'teams.html'
      - 'assets/js/kvl-international-countries-v1.js'
      - 'assets/js/kvl-international-unified-roster-v1.js'
      - 'assets/css/kvl-international-unified-roster-v1.css'
      - 'tests/international-unified-roster-live-v1.test.cjs'
      - 'tests/international-unified-roster-live-qa-v1.cjs'
      - 'tests/international-unified-roster-browser-v1.cjs'
      - '.github/workflows/international-unified-roster-qa-v1.yml'
  push:
    branches: [feature/international-unified-roster-live-v1]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-and-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify JavaScript code and source-read interfaces
        run: |
          node --check assets/js/kvl-international-unified-roster-v1.js
          node --check assets/js/kvl-international-countries-v1.js
          node --check tests/international-unified-roster-live-v1.test.cjs
          node --check tests/international-unified-roster-live-qa-v1.cjs
          node --check tests/international-unified-roster-browser-v1.cjs
          node scripts/build-international-country-index-v1.cjs --check
      - name: Validate all 40-country source pointers, core KVL and pro regressions
        run: |
          node --test tests/international-unified-roster-live-v1.test.cjs
          node --test tests/international-country-history-v1.test.cjs
          node --test tests/teams-directory-v1.test.cjs
      - name: Install isolated Chromium browser
        run: |
          npm install --prefix "$RUNNER_TEMP/kvl-intl-unified" --no-audit --no-fund playwright@1.56.1
          node "$RUNNER_TEMP/kvl-intl-unified/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Verify source-integrated user page on PC and mobile
        env:
          KVL_PLAYWRIGHT_PATH: ${{ runner.temp }}/kvl-intl-unified/node_modules/playwright
        run: node tests/international-unified-roster-browser-v1.cjs
      - name: Save test screenshots and structured QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kvl-international-unified-v1-browser-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/kvl-international-unified-roster-v1-report.json
            ${{ runner.temp }}/kvl-unified-country-*.png
          retention-days: 14
          if-no-files-found: ignore
