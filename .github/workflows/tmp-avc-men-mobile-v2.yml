name: Temporary AVC Men Mobile V2 Patch

on:
  push:
    paths:
      - '.github/workflows/tmp-avc-men-mobile-v2.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Patch AVC men mobile page
        shell: bash
        run: |
          git pull --ff-only origin main
          python -c "import base64,zlib;open('/tmp/patch.py','wb').write(zlib.decompress(base64.b64decode('') ))"
          python /tmp/patch.py
          git diff --check
          git diff -- international-competition-avc-men-continental-2026.html
          git config user.name "kvolleylab"
          git config user.email "kvolleylab.team@gmail.com"
          git add international-competition-avc-men-continental-2026.html
          git commit -m "feat: apply mobile template v2 to AVC men"
          git push origin HEAD:main
