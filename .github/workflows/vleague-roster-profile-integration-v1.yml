name: V-League Roster v2 + Verified Profile Integration

on:
  pull_request:
    paths:
      - 'assets/js/kvl-vleague-draft-bridge-v1.js'
      - 'assets/js/kvl-vleague-roster-v2.js'
      - 'assets/css/kvl-vleague-roster-v2.css'
      - 'assets/js/player-search-v2.js'
      - 'assets/js/player-detail-v2.js'
      - 'assets/js/kvl-competition-components-v2.js'
      - 'assets/js/kvl-competition-loader-v2.js'
      - 'competition-engine.html'
      - 'players.html'
      - 'player.html'
      - 'tests/vleague-roster-profile-integration.test.cjs'
      - 'tests/vleague-roster-v2-ui.test.cjs'
      - 'data/kovo/official-notices/2026-27/draft_registration_bridge.json'
      - 'data/draft-applicants/2026-27/education-v1.json'
      - '.github/workflows/vleague-roster-profile-integration-v1.yml'
  push:
    branches: [feature/vleague-roster-profile-integration-20261118]
    paths:
      - '.github/workflows/vleague-roster-profile-integration-v1.yml'
      - 'assets/js/kvl-vleague-draft-bridge-v1.js'
      - 'assets/js/kvl-vleague-roster-v2.js'
      - 'tests/vleague-roster-profile-integration.test.cjs'
      - 'tests/vleague-roster-v2-ui.test.cjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install DOM test dependency in isolation
        run: npm install --prefix "$RUNNER_TEMP/kvl-tests" --no-package-lock --no-audit --no-fund jsdom@26.1.0
      - name: Check updated Javascript syntax and original V-League integration
        shell: bash
        run: |
          for f in assets/js/kvl-vleague-draft-bridge-v1.js assets/js/kvl-vleague-roster-v2.js assets/js/kvl-competition-components-v2.js assets/js/kvl-competition-loader-v2.js assets/js/player-detail-v2.js assets/js/player-search-v2.js assets/js/player-canonical-identity-v1.js assets/js/player-national-history-v1.js; do
            node --check "$f"
          done
          node --check assets/js/player-workspace-v1.mjs
      - name: Verify current KOVO roster and reviewed player identity safety
        run: node --test tests/vleague-roster-profile-integration.test.cjs
      - name: Verify 2026-27 native roster and school/profiles UI
        env:
          KVL_JSDOM_PATH: ${{ runner.temp }}/kvl-tests/node_modules/jsdom
        run: node --test tests/vleague-roster-v2-ui.test.cjs
