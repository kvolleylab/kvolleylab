name: KVL temp AVC women mobile schedule sources

on:
  push:
    branches:
      - temp-avc-women-mobile-schedule-sources-use
    paths:
      - '.github/workflows/kvl-temp-avc-women-mobile-schedule-sources.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: temp-avc-women-mobile-schedule-sources-use
      - name: Patch AVC women mobile schedule and sources
        shell: python
        run: |
          from pathlib import Path
          path = Path('international-competition-avc-women-continental-2026.html')
          text = path.read_text(encoding='utf-8')
          marker = '  </style>'
          css = '''    @media(max-width:680px){\n      body[data-avc-gender="women"] #sources .avc-sources{grid-template-columns:1fr!important;gap:7px!important}\n      body[data-avc-gender="women"] #sources .avc-source{min-height:48px!important;padding:10px 12px!important;gap:10px!important}\n      body[data-avc-gender="women"] #sources .avc-source strong,body[data-avc-gender="women"] #sources .avc-source a{font-size:12px!important;line-height:1.2!important;white-space:nowrap!important}\n      body[data-avc-gender="women"] #sources .avc-source a{flex:0 0 auto!important}\n      body[data-avc-gender="women"] #schedule .cd-match-board{grid-template-columns:minmax(0,1fr) 46px minmax(0,1fr)!important;gap:8px!important;align-items:center!important}\n      body[data-avc-gender="women"] #schedule .cd-side.is-left{grid-template-columns:32px minmax(0,1fr)!important;gap:4px!important;text-align:left!important}\n      body[data-avc-gender="women"] #schedule .cd-side.is-left .cd-inline-logo{grid-column:1!important;grid-row:1!important;justify-self:start!important}\n      body[data-avc-gender="women"] #schedule .cd-side.is-left strong{grid-column:2!important;grid-row:1!important;justify-self:start!important;text-align:left!important}\n      body[data-avc-gender="women"] #schedule .cd-side.is-right{grid-template-columns:minmax(0,1fr) 32px!important;gap:4px!important;text-align:right!important}\n      body[data-avc-gender="women"] #schedule .cd-side.is-right strong{grid-column:1!important;grid-row:1!important;justify-self:end!important;text-align:right!important}\n      body[data-avc-gender="women"] #schedule .cd-side.is-right .cd-inline-logo{grid-column:2!important;grid-row:1!important;justify-self:end!important}\n      body[data-avc-gender="women"] #schedule .cd-score{width:46px!important;justify-self:center!important;text-align:center!important;font-variant-numeric:tabular-nums!important}\n    }\n'''
          if css.strip() in text:
              raise SystemExit('patch already present')
          if marker not in text:
              raise SystemExit('style closing marker not found')
          text = text.replace(marker, css + marker, 1)
          path.write_text(text, encoding='utf-8')
      - name: Commit patch
        run: |
          git config user.name 'kvolleylab'
          git config user.email 'kvolleylab.team@gmail.com'
          git add international-competition-avc-women-continental-2026.html
          git commit -m 'ui: align AVC women mobile match rows and sources'
          git push origin HEAD:temp-avc-women-mobile-schedule-sources-use
