name: KOVO Cup production + domestic template focused regression

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'data/competitions/kovo-cup-*/config.json'
      - 'data/competitions/kovo-cup-*/data.json'
      - 'data/competitions/kovo-cup-*/rosters.json'
      - 'data/sources/kovo-cup-2026/**'
      - 'tests/kovo-cup-rosters.test.cjs'
      - 'data/competitions/v-league-*/config.json'
      - 'data/competitions/v-league-*/data.json'
      - 'data/competitions/v-league-*/rosters.json'
      - 'data/sources/v-league-2026-27/**'
      - 'tests/vleague-rosters.test.cjs'
      - 'assets/js/kvl-domestic-home-v2.js'
      - 'assets/js/kvl-competition-template-v2.js'
      - 'assets/js/kvl-competition-components-v2.js'
      - 'assets/css/kvl-domestic-home-v2.css'
      - 'tests/kovo-cup-production-template-20261027.test.cjs'
      - 'tests/kovo-cup-desktop-matchup-alignment.test.cjs'
      - '.github/workflows/kovo-cup-production-20261027-smoke.yml'
  push:
    branches:
      - feature/kovo-cup-production-release-clean-20261027
      - main
    paths:
      - 'data/competitions/v-league-*/**'
      - 'tests/vleague-rosters.test.cjs'
      - 'tests/kovo-cup-production-template-20261027.test.cjs'
      - 'tests/kovo-cup-desktop-matchup-alignment.test.cjs'
      - '.github/workflows/kovo-cup-production-20261027-smoke.yml'
permissions:
  contents: read
jobs:
  focused-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: KOVO Cup data and domestic template
        run: node tests/kovo-cup-production-template-20261027.test.cjs
      - name: Domestic Cup prototype still works
        run: node tests/kovo-cup-domestic-presentation-prototype.test.cjs
      - name: Cup pool standings and logos
        run: node tests/competition-v2-pro-cup-pool-columns.test.cjs
      - name: Cup desktop lineup midpoint and five-set lane
        run: node tests/kovo-cup-desktop-matchup-alignment.test.cjs
      - name: Install DOM test dependency
        run: npm install --prefix /tmp/kvl-roster-tests --no-audit --no-fund jsdom@26.1.0
      - name: Cup roster interactions, source integrity and domestic regressions
        env:
          KVL_JSDOM_PATH: /tmp/kvl-roster-tests/node_modules/jsdom
        run: node --test tests/kovo-cup-rosters.test.cjs tests/vleague-rosters.test.cjs tests/domestic-home-v2.test.cjs
