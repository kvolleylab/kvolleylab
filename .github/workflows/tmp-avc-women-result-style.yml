name: Temporary AVC Women Result Style Patch
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-avc-women-result-style.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Patch AVC women combined-ranking result style
        run: |
          python - <<'PY'
          from pathlib import Path

          path=Path('international-competition-avc-women-continental-2026.html')
          s=path.read_text(encoding='utf-8')

          old_result="""    const resultCell=r=>{const q=qfByTeam.get(r.team);return q?`<span class=\"kvl-women-combined-v3-result\"><b>8강 진출 · ${q.seed}번 시드</b><small>${esc(q.id)} · vs ${esc(q.opponent)}(${q.opponentSeed}번)</small></span>`:`<span class=\"kvl-women-combined-v3-result is-out\"><b>조별리그 탈락</b></span>`};"""
          new_result="""    const resultCell=r=>{const q=qfByTeam.get(r.team);return q?`<span class=\"kvl-women-combined-v3-result\"><b>8강 진출</b><small>${q.seed}-${q.opponentSeed}</small></span>`:`<span class=\"kvl-women-combined-v3-result is-out\"><b>조별리그 탈락</b></span>`};"""
          if old_result not in s:
            raise SystemExit('expected resultCell source not found')
          s=s.replace(old_result,new_result,1)

          old_css=""".kvl-women-combined-v3-result{display:inline-flex;align-items:center;justify-content:center;min-height:30px;flex-direction:column;padding:4px 7px;border-radius:999px;background:#eef8f1;color:#166534;font-size:10px;font-weight:1000;line-height:1.15;white-space:nowrap;box-sizing:border-box}.kvl-women-combined-v3-result b,.kvl-women-combined-v3-result small{display:block}.kvl-women-combined-v3-result b{font-size:10px}.kvl-women-combined-v3-result small{margin-top:2px;font-size:8px;font-weight:900}.kvl-women-combined-v3-result.is-out{background:#f3f4f6;color:#6b7280}"""
          new_css=""".kvl-women-combined-v3-result{display:flex;align-items:center;justify-content:flex-start;min-height:30px;gap:7px;padding:0;background:transparent;color:#166534;font-size:10px;font-weight:1000;line-height:1.15;white-space:nowrap;box-sizing:border-box}.kvl-women-combined-v3-result b{display:inline-flex;align-items:center;justify-content:center;min-height:24px;padding:4px 7px;border:1px solid #bfe3c9;border-radius:999px;background:#eef8f1;font-size:10px;box-sizing:border-box}.kvl-women-combined-v3-result small{display:block;margin:0;color:#166534;font-size:10px;font-weight:1000}.kvl-women-combined-v3-result.is-out{justify-content:center;padding:4px 7px;border-radius:999px;background:#f3f4f6;color:#6b7280}.kvl-women-combined-v3-result.is-out b{min-height:0;padding:0;border:0;background:transparent;color:inherit}"""
          if old_css not in s:
            raise SystemExit('expected desktop result CSS not found')
          s=s.replace(old_css,new_css,1)

          old_mobile="""body[data-avc-gender=\"women\"] #groups .kvl-women-combined-v3-result{width:100%!important;min-height:38px!important;padding:5px 6px!important;font-size:11px!important;line-height:1.1!important}\n      body[data-avc-gender=\"women\"] #groups .kvl-women-combined-v3-result b{font-size:11px!important}\n      body[data-avc-gender=\"women\"] #groups .kvl-women-combined-v3-result small{margin-top:3px!important;font-size:8px!important}"""
          new_mobile="""body[data-avc-gender=\"women\"] #groups .kvl-women-combined-v3-result{width:100%!important;min-height:38px!important;gap:6px!important;padding:0!important;font-size:11px!important;line-height:1.1!important}\n      body[data-avc-gender=\"women\"] #groups .kvl-women-combined-v3-result b{min-height:26px!important;padding:4px 7px!important;font-size:11px!important}\n      body[data-avc-gender=\"women\"] #groups .kvl-women-combined-v3-result small{margin:0!important;font-size:11px!important}\n      body[data-avc-gender=\"women\"] #groups .kvl-women-combined-v3-result.is-out{padding:5px 6px!important}"""
          if old_mobile not in s:
            raise SystemExit('expected mobile result CSS not found')
          s=s.replace(old_mobile,new_mobile,1)

          path.write_text(s,encoding='utf-8')
          PY
          git config user.name 'kvolleylab'
          git config user.email 'kvolleylab.team@gmail.com'
          git add international-competition-avc-women-continental-2026.html
          git commit -m 'fix: match AVC women result seed display'
          git push origin HEAD:main
