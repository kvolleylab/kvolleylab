name: Patch shared combined ranking alignment
on:
  push:
    branches: [fix-shared-combined-align-20260908]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-shared-combined-align-20260908
      - name: Patch shared alignment and cache refs
        run: |
          python - <<'PY'
          from pathlib import Path
          css = Path('assets/css/kvl-mobile-competition-template-v3.css')
          s = css.read_text(encoding='utf-8')
          marker = '/* KVL SHARED COMBINED RANKING V1.1 BODY IDENTITY ALIGNMENT */'
          block = r'''
          
          /* KVL SHARED COMBINED RANKING V1.1 BODY IDENTITY ALIGNMENT */
          @media (max-width:680px){
            /* The first three body tracks are invariant in live/complete states. */
            html body[data-avc-gender] #groups .kvl-shared-combined-line:not(.is-head) .kvl-shared-combined-rank{
              width:44px!important;
              justify-self:center!important;
              justify-content:center!important;
              text-align:center!important;
            }
            html body[data-avc-gender] #groups .kvl-shared-combined-line:not(.is-head) .kvl-shared-combined-flag{
              width:28px!important;
              height:19px!important;
              justify-self:center!important;
              justify-content:center!important;
            }
            html body[data-avc-gender] #groups .kvl-shared-combined-line:not(.is-head) .kvl-shared-combined-team{
              width:110px!important;
              min-width:0!important;
              justify-self:start!important;
              justify-content:flex-start!important;
              text-align:left!important;
            }
            html body[data-avc-gender] #groups .kvl-shared-combined-country-head{
              grid-column:2 / span 2!important;
              justify-self:stretch!important;
              justify-content:center!important;
              text-align:center!important;
            }
          }
          '''
          if marker not in s:
              css.write_text(s.rstrip() + block + '\n', encoding='utf-8')
          docs = Path('docs/KVL_MOBILE_COMPETITION_TEMPLATE_V5.md')
          d = docs.read_text(encoding='utf-8')
          anchor = '- 남자부/여자부의 헤더·행·국기·국가명·통계 글씨크기는 동일해야 한다.'
          extra = '''- 남자부/여자부의 헤더·행·국기·국가명·통계 글씨크기는 동일해야 한다.
          - `종합순위 / 국기 / 국가명`의 **첫 3개 데이터 열은 진행 중/종료 상태와 무관하게 동일한 폭·좌표를 사용**한다.
          - 종합순위 값은 `44px` 열 중앙, 국기는 `28px` 열 중앙에 고정한다.
          - 국가명은 `110px` 열에서 **왼쪽 정렬**한다. 남녀 또는 대회 상태에 따라 가운데 정렬로 바꾸지 않는다.
          - 헤더의 `국가`는 국기+국가명 두 열 전체 중앙에 배치하며 `국기`라는 별도 헤더 문구는 표시하지 않는다.'''
          extra = '\n'.join(line.lstrip() for line in extra.splitlines())
          if extra not in d:
              if anchor not in d:
                  raise SystemExit('docs anchor missing')
              docs.write_text(d.replace(anchor, extra), encoding='utf-8')
          files = [Path('international-competition-avc-men-continental-2026.html'),Path('international-competition-avc-women-continental-2026.html'),Path('templates/competition-page-v1.html')]
          old = 'assets/css/kvl-mobile-competition-template-v3.css?v=20260908-5'
          new = 'assets/css/kvl-mobile-competition-template-v3.css?v=20260908-6'
          for p in files:
              t = p.read_text(encoding='utf-8')
              if old in t:
                  p.write_text(t.replace(old,new), encoding='utf-8')
              elif new not in t:
                  raise SystemExit(f'cache ref missing in {p}')
          PY
          git config user.name "kvolleylab"
          git config user.email "kvolleylab.team@gmail.com"
          git add assets/css/kvl-mobile-competition-template-v3.css docs/KVL_MOBILE_COMPETITION_TEMPLATE_V5.md international-competition-avc-men-continental-2026.html international-competition-avc-women-continental-2026.html templates/competition-page-v1.html
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "fix: align combined ranking identity columns"
          git push origin HEAD:fix-shared-combined-align-20260908
