name: Temporary AVC Men Overview QF Mobile Patch

on:
  push:
    paths:
      - '.github/workflows/tmp-avc-men-overview-qf-20260907.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new, label):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'[{label}] marker not found in {path}')
              text = text.replace(old, new, 1)
              p.write_text(text, encoding='utf-8')

          men = 'international-competition-avc-men-continental-2026.html'

          replace_once(
              men,
              '.avc-kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.avc-kpis article{padding:22px;border:1px solid #dfe9e3;border-radius:18px;background:var(--avc-soft)}.avc-kpis span,.avc-kpis small{display:block;color:#748397}.avc-kpis strong{display:inline-block;margin:10px 5px 0 0;color:#14532d;font-size:36px}',
              '.avc-kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px}.avc-kpis article{padding:22px;border:1px solid #dfe9e3;border-radius:18px;background:var(--avc-soft)}.avc-kpis span,.avc-kpis small{display:block;color:#748397}.avc-kpis strong{display:inline-block;margin:10px 5px 0 0;color:#14532d;font-size:36px}.avc-kpis .kvl-avc-venue-kpi{box-sizing:border-box;padding:22px;border:1px solid var(--avc-line);border-radius:18px;background:var(--avc-soft)}.avc-kpis .kvl-avc-venue-kpi span,.avc-kpis .kvl-avc-venue-kpi small{display:block;color:#748397;font-size:14px;font-weight:400;line-height:1.35}.avc-kpis .kvl-avc-venue-kpi strong{display:block;margin-top:10px;color:var(--avc-dark);font-size:20px;line-height:1.35;word-break:keep-all}.avc-kpis .kvl-avc-venue-kpi small{margin-top:3px;white-space:nowrap}',
              'men venue kpi base'
          )

          replace_once(
              men,
              '@media(max-width:900px){.avc-hero{align-items:flex-start;flex-direction:column}.avc-status{justify-content:flex-start}.avc-kpis{grid-template-columns:repeat(2,1fr)}.avc-section-head{align-items:flex-start;flex-direction:column}',
              '@media(max-width:900px){.avc-hero{align-items:flex-start;flex-direction:column}.avc-status{justify-content:flex-start}.avc-kpis{grid-template-columns:repeat(2,1fr)}.avc-kpis .kvl-avc-venue-kpi{grid-column:1/-1}.avc-section-head{align-items:flex-start;flex-direction:column}',
              'men venue kpi tablet span'
          )

          replace_once(
              men,
              '.kvl-mobile-only{display:none!important}.kvl-mobile-meta-break{display:none}.kvl-nav-mobile{display:none}.kvl-men-combined-mobile{display:none!important}',
              '.kvl-mobile-only{display:none!important}.kvl-mobile-meta-break{display:none}.kvl-nav-mobile{display:none}.kvl-men-combined-mobile{display:none!important}.kvl-qf-mobile-matchup{display:none!important}',
              'mobile qf hidden default'
          )

          replace_once(
              men,
              '      body[data-avc-gender="men"] #overview .kvl-overview-badges.kvl-mobile-only{display:flex!important;margin-top:10px!important}\n',
              '      body[data-avc-gender="men"] #overview .avc-kpis .kvl-avc-venue-kpi{grid-column:1/-1!important;min-height:92px!important;padding:13px 12px!important;border-radius:14px!important}\n      body[data-avc-gender="men"] #overview .avc-kpis .kvl-avc-venue-kpi strong{font-size:20px!important;line-height:1.2!important;letter-spacing:-.035em!important;white-space:nowrap!important}\n',
              'men venue kpi mobile'
          )

          qf_css_anchor = '      html body[data-avc-gender="men"] #knockout .avc-bracket-team-copy small{display:block!important;margin-top:3px!important;color:#6f7f76!important;font-size:10px!important;font-weight:850!important;line-height:1.25!important;white-space:normal!important}\n'
          qf_css_new = qf_css_anchor + '''      html body[data-avc-gender="men"] #knockout .avc-round-qf .avc-bracket-match>.avc-bracket-team{display:none!important}\n      html body[data-avc-gender="men"] #knockout .kvl-qf-mobile-matchup{display:grid!important;grid-template-columns:minmax(0,1fr) 24px minmax(0,1fr)!important;align-items:center!important;gap:5px!important;padding:10px 8px!important;border-top:1px solid #edf3ef!important;background:#fff!important}\n      html body[data-avc-gender="men"] #knockout .kvl-qf-mobile-side{display:flex!important;min-width:0!important;flex-direction:column!important;align-items:stretch!important;justify-content:center!important}\n      html body[data-avc-gender="men"] #knockout .kvl-qf-mobile-main{display:flex!important;min-width:0!important;align-items:center!important;gap:4px!important;white-space:nowrap!important}\n      html body[data-avc-gender="men"] #knockout .kvl-qf-mobile-side.is-left .kvl-qf-mobile-main{justify-content:flex-start!important}\n      html body[data-avc-gender="men"] #knockout .kvl-qf-mobile-side.is-right .kvl-qf-mobile-main{justify-content:flex-end!important}\n      html body[data-avc-gender="men"] #knockout .kvl-qf-mobile-main img{display:block!important;flex:0 0 auto!important;width:25px!important;height:18px!important;object-fit:contain!important;background:#fff!important}\n      html body[data-avc-gender="men"] #knockout .kvl-qf-mobile-main strong{overflow:visible!important;color:#263b2e!important;font-size:11px!important;font-weight:950!important;line-height:1.2!important;text-overflow:clip!important;white-space:nowrap!important}\n      html body[data-avc-gender="men"] #knockout .kvl-qf-mobile-main span:not(.kvl-qf-mobile-seed){color:#51675a!important;font-size:9.5px!important;font-weight:900!important;line-height:1.2!important;white-space:nowrap!important}\n      html body[data-avc-gender="men"] #knockout .kvl-qf-mobile-seed{display:grid!important;flex:0 0 auto!important;place-items:center!important;width:24px!important;height:24px!important;border:1px dashed #b8cdc0!important;border-radius:50%!important;color:#287345!important;font-size:9px!important;font-weight:1000!important}\n      html body[data-avc-gender="men"] #knockout .kvl-qf-mobile-side>small{display:block!important;margin-top:4px!important;color:#7a897f!important;font-size:9px!important;font-weight:850!important;line-height:1.2!important;text-align:center!important;white-space:nowrap!important}\n      html body[data-avc-gender="men"] #knockout .kvl-qf-mobile-vs{color:#4B5563!important;font-size:10px!important;font-weight:1000!important;text-align:center!important}\n'''
          replace_once(men, qf_css_anchor, qf_css_new, 'men qf mobile css')

          replace_once(
              men,
              '    <div class="avc-kpis"><article><span>참가국</span><strong id="teamCount">12</strong><small>개국</small></article><article><span>조별리그</span><strong id="groupCount">3</strong><small>개 조</small></article><article><span>전체 일정</span><strong id="matchCount">26</strong><small>경기</small></article><article><span>8강 진출</span><strong>8</strong><small>개국</small></article></div>\n    <div class="kvl-overview-badges kvl-mobile-only"><span class="kvl-overview-venue"><b>경기장</b><span>기타큐슈시 종합체육관</span></span></div>',
              '    <div class="avc-kpis"><article><span>참가국</span><strong id="teamCount">12</strong><small>개국</small></article><article><span>조별리그</span><strong id="groupCount">3</strong><small>개 조</small></article><article><span>전체 일정</span><strong id="matchCount">26</strong><small>경기</small></article><article><span>8강 진출</span><strong>8</strong><small>개국</small></article><div class="kvl-avc-venue-kpi" aria-label="대회 장소: 일본 후쿠오카 기타큐슈시 종합체육관"><span>장소</span><strong>일본 후쿠오카</strong><small>기타큐슈시 종합체육관</small></div></div>',
              'men overview venue html'
          )

          old_bracket = '''  const bracketTeam=(m,key)=>{const p=participant(m,key);const icon=p.team?`<img src="${flagUrl(p.team)}" alt="${esc(p.team)} 국기" loading="lazy">`:`<span>${p.seed||'?'}</span>`;return `<div class="avc-bracket-team ${p.team?'':'is-tbd'}">${icon}<div class="avc-bracket-team-copy"><strong>${esc(p.main)}</strong>${p.sub?`<small>${esc(p.sub)}</small>`:''}</div></div>`};\n  const bracketMatch=m=>{if(!m)return '<article class="avc-bracket-match"><div class="avc-bracket-match-head"><strong>TBD</strong><span>일정 미정</span></div></article>';return `<article class="avc-bracket-match"><div class="avc-bracket-match-head"><strong>${esc(m.id)}</strong><span>${esc(m.date.slice(5))} · ${esc(m.time)}</span></div>${bracketTeam(m,'A')}${bracketTeam(m,'B')}</article>`};'''
          new_bracket = '''  const bracketTeam=(m,key)=>{const p=participant(m,key);const icon=p.team?`<img src="${flagUrl(p.team)}" alt="${esc(p.team)} 국기" loading="lazy">`:`<span>${p.seed||'?'}</span>`;return `<div class="avc-bracket-team ${p.team?'':'is-tbd'}">${icon}<div class="avc-bracket-team-copy"><strong>${esc(p.main)}</strong>${p.sub?`<small>${esc(p.sub)}</small>`:''}</div></div>`};\n  const qfMobileSide=(m,key,position)=>{const p=qfParticipant(m,key),seedText=`예선 종합 ${p.seed}위`,teamText=p.team||'',flag=teamText?`<img src="${flagUrl(teamText)}" alt="${esc(teamText)} 국기" loading="lazy">`:`<span class="kvl-qf-mobile-seed">${p.seed||'?'}</span>`,status=p.confirmed?'확정':teamText?'현재 예상':'대진 대기',main=position==='left'?`${flag}<strong>${esc(teamText||seedText)}</strong>${teamText?`<span>${esc(seedText)}</span>`:''}`:`${teamText?`<span>${esc(seedText)}</span>`:''}<strong>${esc(teamText||seedText)}</strong>${flag}`;return `<div class="kvl-qf-mobile-side is-${position}"><div class="kvl-qf-mobile-main">${main}</div><small>${esc(status)}</small></div>`};\n  const qfMobileMatchup=m=>m?.stage==='8강'?`<div class="kvl-qf-mobile-matchup">${qfMobileSide(m,'A','left')}<b class="kvl-qf-mobile-vs">VS</b>${qfMobileSide(m,'B','right')}</div>`:'';\n  const bracketMatch=m=>{if(!m)return '<article class="avc-bracket-match"><div class="avc-bracket-match-head"><strong>TBD</strong><span>일정 미정</span></div></article>';return `<article class="avc-bracket-match"><div class="avc-bracket-match-head"><strong>${esc(m.id)}</strong><span>${esc(m.date.slice(5))} · ${esc(m.time)}</span></div>${qfMobileMatchup(m)}${bracketTeam(m,'A')}${bracketTeam(m,'B')}</article>`};'''
          replace_once(men, old_bracket, new_bracket, 'men bracket renderer')

          # Independent template: replace the old small venue badge with a full-width location KPI card.
          js = 'assets/js/kvl-competition-template-v1.js'
          old_overview = '''  function overview(cfg){\n    const stats=Array.isArray(cfg.overviewStats)?cfg.overviewStats:[];\n    const kpis=stats.length?`<div class="kvl-comp-kpis">${stats.map(s=>`<article class="kvl-comp-kpi"><span class="kvl-comp-kpi-label">${esc(s.label)}</span><div class="kvl-comp-kpi-value"><strong>${esc(s.value)}</strong><small>${esc(s.unit||'')}</small></div></article>`).join('')}</div>`:'';\n    const venue=cfg.location?.venue||'';\n    const venueBadge=venue?`<div class="kvl-comp-overview-badges"><span class="kvl-comp-venue-badge"><b>경기장</b><span>${esc(venue)}</span></span></div>`:'';\n    return `${sectionHead(cfg,'overview')}${kpis}${venueBadge}<div class="kvl-comp-slot" data-kvl-slot="overview-extra"></div>`;\n  }'''
          new_overview = '''  function overview(cfg){\n    const stats=Array.isArray(cfg.overviewStats)?cfg.overviewStats:[];\n    const place=[cfg.location?.country,cfg.location?.city,cfg.location?.venue].filter(Boolean).join(' ');\n    const venueKpi=place?`<div class="kvl-comp-venue-kpi" aria-label="대회 장소: ${esc(place)}"><span class="kvl-comp-kpi-label">장소</span><strong>${esc(place)}</strong></div>`:'';\n    const kpis=(stats.length||venueKpi)?`<div class="kvl-comp-kpis ${venueKpi?'has-venue':''}">${stats.map(s=>`<article class="kvl-comp-kpi"><span class="kvl-comp-kpi-label">${esc(s.label)}</span><div class="kvl-comp-kpi-value"><strong>${esc(s.value)}</strong><small>${esc(s.unit||'')}</small></div></article>`).join('')}${venueKpi}</div>`:'';\n    return `${sectionHead(cfg,'overview')}${kpis}<div class="kvl-comp-slot" data-kvl-slot="overview-extra"></div>`;\n  }'''
          replace_once(js, old_overview, new_overview, 'template venue renderer')

          css = 'assets/css/kvl-competition-template-v1.css'
          replace_once(
              css,
              '.kvl-comp-kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.kvl-comp-kpi{padding:20px 22px;border:1px solid var(--kvl-comp-line);border-radius:18px;background:var(--kvl-comp-soft)}.kvl-comp-kpi-label{display:block;color:#748397;font-size:14px}.kvl-comp-kpi-value{display:flex;align-items:baseline;gap:3px;margin-top:10px}.kvl-comp-kpi-value strong{color:var(--kvl-comp-primary);font-size:30px;line-height:1}.kvl-comp-kpi-value small{color:#748397;font-size:13px;font-weight:800}\n.kvl-comp-overview-badges{display:none}.kvl-comp-venue-badge{display:inline-flex;max-width:100%;align-items:center;gap:7px;padding:7px 10px;border:1px solid var(--kvl-comp-line);border-radius:999px;background:var(--kvl-comp-soft);box-sizing:border-box}.kvl-comp-venue-badge b{color:var(--kvl-comp-primary);font-size:10px;font-weight:1000;white-space:nowrap}.kvl-comp-venue-badge span{overflow:hidden;color:var(--kvl-comp-muted);font-size:10px;font-weight:850;text-overflow:ellipsis;white-space:nowrap}.kvl-comp-calendar-time{font-size:8px;line-height:1.1}',
              '.kvl-comp-kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.kvl-comp-kpis.has-venue{grid-template-columns:repeat(5,minmax(0,1fr))}.kvl-comp-kpi{padding:20px 22px;border:1px solid var(--kvl-comp-line);border-radius:18px;background:var(--kvl-comp-soft)}.kvl-comp-kpi-label{display:block;color:#748397;font-size:14px}.kvl-comp-kpi-value{display:flex;align-items:baseline;gap:3px;margin-top:10px}.kvl-comp-kpi-value strong{color:var(--kvl-comp-primary);font-size:30px;line-height:1}.kvl-comp-kpi-value small{color:#748397;font-size:13px;font-weight:800}.kvl-comp-venue-kpi{box-sizing:border-box;padding:20px 22px;border:1px solid var(--kvl-comp-line);border-radius:18px;background:var(--kvl-comp-soft)}.kvl-comp-venue-kpi strong{display:block;margin-top:10px;color:var(--kvl-comp-primary);font-size:20px;font-weight:900;line-height:1.35;word-break:keep-all}.kvl-comp-calendar-time{font-size:8px;line-height:1.1}',
              'template venue css base'
          )
          replace_once(
              css,
              '@media(max-width:900px){.kvl-comp-kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}',
              '@media(max-width:900px){.kvl-comp-kpis,.kvl-comp-kpis.has-venue{grid-template-columns:repeat(2,minmax(0,1fr))}.kvl-comp-venue-kpi{grid-column:1/-1}}',
              'template venue css tablet'
          )
          replace_once(
              css,
              '.kvl-comp-section{padding:22px 16px}.kvl-comp-section-head{align-items:flex-start;flex-direction:column}.kvl-comp-section-head p{text-align:left}.kvl-comp-kpis{grid-template-columns:1fr 1fr;gap:10px}.kvl-comp-kpi{padding:16px}.kvl-comp-kpi-value strong{font-size:26px}.kvl-comp-overview-badges{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}}',
              '.kvl-comp-section{padding:22px 16px}.kvl-comp-section-head{align-items:flex-start;flex-direction:column}.kvl-comp-section-head p{text-align:left}.kvl-comp-kpis,.kvl-comp-kpis.has-venue{grid-template-columns:1fr 1fr;gap:10px}.kvl-comp-kpi{padding:16px}.kvl-comp-kpi-value strong{font-size:26px}.kvl-comp-venue-kpi{grid-column:1/-1;min-height:92px;padding:13px 12px;border-radius:14px}.kvl-comp-venue-kpi strong{font-size:20px;line-height:1.25;letter-spacing:-.025em}}',
              'template venue css mobile'
          )

          docs = 'docs/KVL_MOBILE_COMPETITION_TEMPLATE_V2.md'
          replace_once(
              docs,
              '- 한눈에 보기에는 `경기장` 정보를 작은 공통 뱃지로 기본 제공한다.',
              '- 한눈에 보기의 개최지는 작은 뱃지가 아니라 KPI 영역과 같은 크기의 `장소` 카드로 제공한다. `장소` 라벨 아래에 `국가/도시 + 경기장` 전체 정보를 표시하고, 모바일에서는 2열 KPI 아래 전체 폭을 사용한다.',
              'template docs venue rule'
          )
          p = Path(docs)
          text = p.read_text(encoding='utf-8')
          marker = '- v2 / 2026-09-07: **특정 대회를 기준본으로 지정하지 않는 독립 템플릿 원칙으로 수정.** 실제 대회는 구현 사례로만 취급하고, 별도 템플릿·공통 파일·이 문서를 Source of Truth로 확정.'
          if marker in text and '장소 KPI 카드' not in text:
              text = text.replace(marker, marker + '\n- v2 보완 / 2026-09-07: 한눈에 보기의 개최지 표기를 작은 경기장 뱃지에서 전체 폭 `장소 KPI 카드`로 변경.', 1)
              p.write_text(text, encoding='utf-8')

          starter = 'templates/competition-page-v1.html'
          replace_once(starter, 'kvl-competition-template-v1.css?v=20260907-2', 'kvl-competition-template-v1.css?v=20260907-3', 'template css cache key')
          replace_once(starter, 'kvl-competition-template-v1.js?v=20260907-2', 'kvl-competition-template-v1.js?v=20260907-3', 'template js cache key')
          PY
      - name: Commit patch
        shell: bash
        run: |
          git config user.name 'kvolleylab'
          git config user.email 'kvolleylab.team@gmail.com'
          git add international-competition-avc-men-continental-2026.html assets/js/kvl-competition-template-v1.js assets/css/kvl-competition-template-v1.css docs/KVL_MOBILE_COMPETITION_TEMPLATE_V2.md templates/competition-page-v1.html
          if git diff --cached --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git commit -m 'fix: align AVC men venue card and QF mobile matchup'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
