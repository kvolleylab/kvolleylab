name: Patch shared combined ranking country header
on:
  push:
    branches: [tmp-combined-country-header]
permissions:
  contents: write
jobs:
  patch:
    if: "${{ github.event.head_commit.message != 'fix: unify combined ranking country header' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp-combined-country-header
      - name: Patch cache refs
        run: |
          python - <<'PY'
          from pathlib import Path
          files = [
              Path('international-competition-avc-men-continental-2026.html'),
              Path('international-competition-avc-women-continental-2026.html'),
              Path('templates/competition-page-v1.html'),
          ]
          for p in files:
              s = p.read_text(encoding='utf-8')
              old = 'assets/js/kvl-mobile-combined-ranking-v1.js?v=20260908-1'
              new = 'assets/js/kvl-mobile-combined-ranking-v1.js?v=20260908-2'
              if old not in s:
                  raise SystemExit(f'missing cache ref in {p}')
              p.write_text(s.replace(old,new), encoding='utf-8')
          PY
          git config user.name "kvolleylab"
          git config user.email "kvolleylab.team@gmail.com"
          git add international-competition-avc-men-continental-2026.html international-competition-avc-women-continental-2026.html templates/competition-page-v1.html
          git commit -m "fix: unify combined ranking country header"
          git push origin HEAD:tmp-combined-country-header
