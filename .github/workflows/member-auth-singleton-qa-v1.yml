name: KVL Mobile Admin Auth Singleton QA

on:
  pull_request:
    paths:
      - 'assets/js/kvl-supabase-browser-v1.mjs'
      - 'assets/js/member-login-v1.mjs'
      - 'assets/js/member-session-v1.mjs'
      - 'assets/js/member-access-gate-v1.mjs'
      - 'assets/js/team-roster-member-summary-v1.mjs'
      - 'assets/js/unified-nav.js'
      - 'member-login.html'
      - 'teams.html'
      - 'tests/member-auth-singleton-v1.test.cjs'
      - 'tests/member-auth-singleton-browser-v1.cjs'
      - '.github/workflows/member-auth-singleton-qa-v1.yml'
  push:
    branches: [main]
    paths:
      - 'assets/js/kvl-supabase-browser-v1.mjs'
      - 'assets/js/member-login-v1.mjs'
      - 'assets/js/member-session-v1.mjs'
      - 'assets/js/member-access-gate-v1.mjs'
      - 'assets/js/team-roster-member-summary-v1.mjs'
      - 'assets/js/unified-nav.js'
      - 'member-login.html'
      - 'teams.html'
      - 'tests/member-auth-singleton-v1.test.cjs'
      - 'tests/member-auth-singleton-browser-v1.cjs'
      - '.github/workflows/member-auth-singleton-qa-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mobile-admin-auth:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify singleton source contract
        run: |
          node --check tests/member-auth-singleton-v1.test.cjs
          node --check tests/member-auth-singleton-browser-v1.cjs
          node --test tests/member-auth-singleton-v1.test.cjs
      - name: Install isolated Chromium
        run: |
          npm install --prefix "$RUNNER_TEMP/kvl-auth-singleton" --no-audit --no-fund playwright@1.56.1
          node "$RUNNER_TEMP/kvl-auth-singleton/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Serve branch and verify mobile admin session fan-out
        env:
          KVL_PLAYWRIGHT_PATH: ${{ runner.temp }}/kvl-auth-singleton/node_modules/playwright
          KVL_TEST_BASE: http://127.0.0.1:4177
        run: |
          python3 -m http.server 4177 --bind 127.0.0.1 >"$RUNNER_TEMP/kvl-auth-http.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4177/teams.html >/dev/null; then break; fi
            sleep 1
          done
          node tests/member-auth-singleton-browser-v1.cjs
