name: Temporary AVC Women Cache Bust

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'chore: temporary AVC cache bust runner'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch AVC women page
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('international-competition-avc-women-continental-2026.html')
          text = path.read_text(encoding='utf-8')

          required = {
              'assets/css/kvl-mobile-competition-template-v1.css?v=20260907-1': 'assets/css/kvl-mobile-competition-template-v1.css?v=20260907-2',
              'assets/js/unified-nav.js?v=20260907-4': 'assets/js/unified-nav.js?v=20260907-5',
          }
          for old, new in required.items():
              if old not in text:
                  raise SystemExit(f'missing expected marker: {old}')
              text = text.replace(old, new)

          marker = '<script src="assets/js/unified-nav.js?v=20260907-5" defer></script>'
          runtime = '<script src="assets/js/avc-continental-gender-runtime.js?v=20260907-1" defer></script>'
          if runtime not in text:
              if marker not in text:
                  raise SystemExit('unified nav marker missing after version update')
              text = text.replace(marker, runtime + '\n  ' + marker, 1)

          text = text.replace('combinedRankingRoot', 'combinedRankingRootV3')
          text = text.replace('kvl-combined-', 'kvl-women-combined-v3-')

          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit patch and remove temporary workflow
        run: |
          rm .github/workflows/tmp-avc-women-cache-bust.yml
          git config user.name "kvolleylab"
          git config user.email "kvolleylab.team@gmail.com"
          git add international-competition-avc-women-continental-2026.html .github/workflows/tmp-avc-women-cache-bust.yml
          git commit -m "fix: isolate AVC women combined ranking cache"
          git push origin HEAD:main
