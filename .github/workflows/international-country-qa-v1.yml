name: International Country Directory and Roster History v1

on:
  pull_request:
    paths:
      - 'teams.html'
      - 'assets/js/kvl-teams-directory-v1.js'
      - 'assets/js/kvl-international-countries-v1.js'
      - 'assets/css/kvl-international-countries-v1.css'
      - 'data/international/country-*v1.json'
      - 'scripts/build-international-country-index-v1.cjs'
      - 'tests/international-country-*v1.cjs'
      - '.github/workflows/international-country-qa-v1.yml'
  push:
    branches: [feature/international-country-roster-history-v1-20261118]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-and-browser-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Syntax validate isolated international modules and tests
        run: |
          node --check assets/js/kvl-teams-directory-v1.js
          node --check assets/js/kvl-international-countries-v1.js
          node --check scripts/build-international-country-index-v1.cjs
          node --check tests/international-country-history-v1.test.cjs
          node --check tests/international-country-browser-qa-v1.cjs
      - name: Validate deterministic indexes against published source files
        run: node scripts/build-international-country-index-v1.cjs --check
      - name: Validate countries, rosters and selection evidence without mutating source
        run: |
          node --test tests/international-country-history-v1.test.cjs
          node --test tests/teams-directory-v1.test.cjs
      - name: Install isolated Chromium runtime
        run: |
          npm install --prefix "${{ runner.temp }}/kvl-intl-browser" --no-audit --no-fund playwright@1.56.1
          node "${{ runner.temp }}/kvl-intl-browser/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Verify actual filtered country pages, snapshot navigation and mobile display
        env:
          KVL_PLAYWRIGHT_PATH: ${{ runner.temp }}/kvl-intl-browser/node_modules/playwright
        run: node tests/international-country-browser-qa-v1.cjs
      - name: Preserve isolated UI screenshots and structured verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kvl-international-country-v1-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/kvl-international-countries-browser-report.json
            ${{ runner.temp }}/kvl-international-country-*.png
          retention-days: 14
          if-no-files-found: ignore
