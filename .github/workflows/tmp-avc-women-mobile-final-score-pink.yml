name: Temporary AVC Women Mobile Final Score Pink

on:
  push:
    branches: [tmp-avc-women-mobile-final-score-pink]
    paths:
      - '.github/workflows/tmp-avc-women-mobile-final-score-pink.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp-avc-women-mobile-final-score-pink
          fetch-depth: 0
      - name: Apply mobile final score pink
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('international-competition-avc-women-continental-2026.html')
          s = p.read_text(encoding='utf-8')
          old1 = 'html body[data-avc-gender="women"] #knockout .avc-bracket-team b{color:#4B5563!important}'
          new1 = 'html body[data-avc-gender="women"] #knockout .avc-bracket-team b{color:var(--avc-primary)!important}'
          old2 = 'html body[data-avc-gender="women"] #knockout .avc-bracket-team.is-winner b{color:#4B5563!important}'
          new2 = 'html body[data-avc-gender="women"] #knockout .avc-bracket-team.is-winner b{color:var(--avc-primary)!important}'
          if old1 not in s or old2 not in s:
              raise SystemExit('mobile final score color target not found')
          s = s.replace(old1, new1, 1).replace(old2, new2, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          git config user.name 'kvolleylab'
          git config user.email 'kvolleylab.team@gmail.com'
          git add international-competition-avc-women-continental-2026.html
          git diff --cached --quiet && exit 0
          git commit -m 'style: set AVC women mobile final scores pink'
          git push origin HEAD:tmp-avc-women-mobile-final-score-pink
