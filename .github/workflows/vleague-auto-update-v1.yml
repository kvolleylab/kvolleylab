name: V-League Auto Update v1

on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish approved match data and the separately gated player pilot (each activation required)'
        type: boolean
        default: false
      player_master_access_check:
        description: '선수 MASTER 접근만 확인 (수정·게시 없음)'
        type: boolean
        default: false
  pull_request:
    branches: [main]
    paths:
      - 'scripts/kovo_vleague_*.py'
      - 'scripts/kvl_competition_lifecycle.py'
      - 'tests/test_kovo_vleague_*.py'
      - 'tests/test_kvl_competition_lifecycle.py'
      - 'config/automation/vleague-2026-27_v1.json'
      - 'data/automation/archive/vleague-2026-27-regular/**'
      - 'tests/fixtures/kovo_vleague/**'
      - 'tests/vleague-*.test.cjs'
      - '.github/workflows/vleague-auto-update-v1.yml'
  schedule:
    # Default cron is UTC. Daily reconciliation: 09:17 KST.
    - cron: '17 0 * * *'
    # 12:07-23:52 KST, every 15 minutes, away from the top of the hour.
    # No fixed-latency guarantee: reconcile regular season + QPO/PO/championship.
    - cron: '7,22,37,52 3-14 * * *'

permissions:
  contents: read

concurrency:
  group: kvl-vleague-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  lifecycle:
    if: >-
      inputs.player_master_access_check != true &&
      github.repository == 'kvolleylab/kvolleylab' &&
      (github.event_name != 'schedule' || vars.KVL_VLEAGUE_UPDATE_APPROVED == 'true') &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
    outputs:
      allow_update: ${{ steps.window.outputs.allow_update }}
      phase: ${{ steps.window.outputs.phase }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Evaluate the reviewed season window before source requests or dependency installs
        id: window
        run: python3 -B scripts/kvl_competition_lifecycle.py --root . --report "$RUNNER_TEMP/kvl-vleague-lifecycle/lifecycle.json" --github-output "$GITHUB_OUTPUT"
      - name: Keep the sanitized window decision
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vleague-lifecycle-${{ github.run_id }}
          path: ${{ runner.temp }}/kvl-vleague-lifecycle/lifecycle.json
          retention-days: 7
          if-no-files-found: warn
      - name: Summarize the update window separately from sporting completion
        if: always()
        env:
          LIFECYCLE_PHASE: ${{ steps.window.outputs.phase }}
          UPDATE_ALLOWED: ${{ steps.window.outputs.allow_update }}
        run: |
          printf '### V-League update window\n\nPhase: `%s` · Update allowed: `%s`\n\nA closed window stops updates; it does not certify season completion or archive verification.\n' "$LIFECYCLE_PHASE" "$UPDATE_ALLOWED" >> "$GITHUB_STEP_SUMMARY"

  check:
    needs: lifecycle
    if: >-
      inputs.player_master_access_check != true &&
      always() && !cancelled() &&
      github.repository == 'kvolleylab/kvolleylab' &&
      (github.event_name != 'schedule' || vars.KVL_VLEAGUE_UPDATE_APPROVED == 'true') &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) &&
      (github.event_name == 'pull_request' || needs.lifecycle.outputs.allow_update == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Source, standings, MASTER and publication safety tests
        run: |
          python -B -m unittest discover -s tests -p 'test_kovo_vleague_*.py' -v
          python -B -m unittest discover -s tests -p 'test_kvl_competition_lifecycle.py' -v
      - name: Inspect the current Pages configuration without deploying
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -B scripts/kovo_vleague_ops.py inspect-pages --report "$RUNNER_TEMP/kvl-vleague-preview/pages-configuration.json"
      - name: Install existing DOM test dependency outside the checkout
        run: npm install --prefix "$RUNNER_TEMP/kvl-vleague-deps" --no-audit --no-fund jsdom@26.1.0
      - name: Preserve existing V-League page behavior
        env:
          KVL_JSDOM_PATH: ${{ runner.temp }}/kvl-vleague-deps/node_modules/jsdom
        run: node --test tests/vleague-rosters.test.cjs tests/vleague-match-summary.test.cjs tests/vleague-postseason.test.cjs
      - name: Recheck the live clock immediately before preview collection
        id: preview-window
        run: python -B scripts/kvl_competition_lifecycle.py --root . --report "$RUNNER_TEMP/kvl-vleague-preview/lifecycle.json" --github-output "$GITHUB_OUTPUT"
      - name: Verify real official full-season data without changing MASTER or site
        if: steps.preview-window.outputs.allow_update == 'true'
        run: python -B scripts/kovo_vleague_update.py --root . --output "$RUNNER_TEMP/kvl-vleague-preview"
      - name: Render real candidate scores and standings through the existing engine
        if: steps.preview-window.outputs.allow_update == 'true'
        env:
          KVL_JSDOM_PATH: ${{ runner.temp }}/kvl-vleague-deps/node_modules/jsdom
          KVL_VLEAGUE_CANDIDATE_ROOT: ${{ runner.temp }}/kvl-vleague-preview/candidate
        run: node --test tests/vleague-auto-update-ui.test.cjs
      - name: Keep sanitized verification report and public candidate JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vleague-preview-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/kvl-vleague-preview/report.json
            ${{ runner.temp }}/kvl-vleague-preview/report.md
            ${{ runner.temp }}/kvl-vleague-preview/lifecycle.json
            ${{ runner.temp }}/kvl-vleague-preview/pages-configuration.json
            ${{ runner.temp }}/kvl-vleague-preview/candidate/
          retention-days: 7
          if-no-files-found: warn
      - name: Publish check summary
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/kvl-vleague-preview/report.md" ]; then
            cat "$RUNNER_TEMP/kvl-vleague-preview/report.md" >> "$GITHUB_STEP_SUMMARY"
          fi

  publish:
    needs: [lifecycle, check]
    if: >-
      inputs.player_master_access_check != true &&
      needs.lifecycle.result == 'success' && needs.lifecycle.outputs.allow_update == 'true' && needs.check.result == 'success' &&
      github.repository == 'kvolleylab/kvolleylab' && github.ref == 'refs/heads/main' &&
      vars.KVL_VLEAGUE_UPDATE_APPROVED == 'true' &&
      (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.publish))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pages: write
      id-token: write
    env:
      KVL_VLEAGUE_PUBLISH_APPROVED: 'true'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Recheck the live clock before authentication or publishing
        id: window
        run: python -B scripts/kvl_competition_lifecycle.py --root . --report "$RUNNER_TEMP/kvl-vleague-publish/lifecycle.json" --github-output "$GITHUB_OUTPUT"
      - name: Verify current main and the existing Pages branch deployment
        if: steps.window.outputs.allow_update == 'true'
        run: python -B scripts/kovo_vleague_ops.py preflight --root . --report "$RUNNER_TEMP/kvl-vleague-publish/preflight.json"
      - name: Authenticate only the trusted publisher to the existing MASTER
        if: steps.window.outputs.allow_update == 'true'
        id: google-auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.KVL_GOOGLE_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.KVL_GOOGLE_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/spreadsheets
          create_credentials_file: false
          export_environment_variables: false
      - name: Collect fresh data, apply precise MASTER cells, verify readback and generate data
        if: steps.window.outputs.allow_update == 'true'
        env:
          KVL_GOOGLE_ACCESS_TOKEN: ${{ steps.google-auth.outputs.access_token }}
        run: python -B scripts/kovo_vleague_update.py --root . --publish --output "$RUNNER_TEMP/kvl-vleague-publish"
      - name: Commit only approved V-League generated paths
        if: steps.window.outputs.allow_update == 'true'
        shell: bash
        run: |
          python -B scripts/kvl_competition_lifecycle.py --root . --require-open --report "$RUNNER_TEMP/kvl-vleague-publish/lifecycle.json"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- data/competitions/v-league-men-2026-27/data.json data/competitions/v-league-women-2026-27/data.json data/kovo/vleague/2026-27/state_v1.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update verified V-League results and standings'
            python -B scripts/kvl_competition_lifecycle.py --root . --require-open --report "$RUNNER_TEMP/kvl-vleague-publish/lifecycle.json"
            git push origin HEAD:main
          fi
      - name: Request Pages build explicitly and verify published data
        if: steps.window.outputs.allow_update == 'true'
        run: |
          python -B scripts/kvl_competition_lifecycle.py --root . --require-open --report "$RUNNER_TEMP/kvl-vleague-publish/lifecycle.json"
          python -B scripts/kovo_vleague_ops.py deploy --root . --sha "$(git rev-parse HEAD)" --report "$RUNNER_TEMP/kvl-vleague-publish/deploy.json"
      - name: Keep sanitized publication receipts only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vleague-publish-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/kvl-vleague-publish/lifecycle.json
            ${{ runner.temp }}/kvl-vleague-publish/report.json
            ${{ runner.temp }}/kvl-vleague-publish/report.md
            ${{ runner.temp }}/kvl-vleague-publish/preflight.json
            ${{ runner.temp }}/kvl-vleague-publish/deploy.json
          retention-days: 7
          if-no-files-found: warn

  player_master_pilot:
    # Wait for the match publisher before taking a fresh main checkout. The
    # player's monitoring window is independent of the match/season end gate.
    needs: publish
    if: >-
      inputs.player_master_access_check != true &&
      always() && !cancelled() &&
      github.repository == 'kvolleylab/kvolleylab' && github.ref == 'refs/heads/main' &&
      ((github.event_name == 'schedule' && github.event.schedule == '17 0 * * *') ||
       (github.event_name == 'workflow_dispatch' && inputs.publish))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pages: write
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check the one-event approval and player window before any Google authentication
        id: player-gate
        run: python -B scripts/kvl_player_master_pilot.py --preflight --root . --output "$RUNNER_TEMP/kvl-player-master-pilot" --github-output "$GITHUB_OUTPUT"
      - name: Verify the fresh checkout still matches main
        if: steps.player-gate.outputs.ready == 'true'
        shell: bash
        run: |
          python -B - <<'PY'
          import subprocess
          head = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          remote = subprocess.check_output(['git', 'ls-remote', 'origin', 'refs/heads/main'], text=True).split()
          if len(remote) != 2 or remote[0] != head:
              raise SystemExit('Player pilot blocked: main changed before authentication')
          PY
          python -B -m unittest discover -s tests -p 'test_kvl_player_master*.py' -v
          python -B scripts/kvl_player_master_pilot.py --preflight --require-ready --root . --output "$RUNNER_TEMP/kvl-player-master-pilot/pre-auth"
      - name: Authenticate the existing trusted service account only for an activated pilot
        if: steps.player-gate.outputs.ready == 'true'
        id: player-google-auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.KVL_GOOGLE_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.KVL_GOOGLE_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/spreadsheets
          create_credentials_file: false
          export_environment_variables: false
      - name: Recheck the official revision, apply one approved MASTER event and verify readback
        if: steps.player-gate.outputs.ready == 'true'
        env:
          KVL_GOOGLE_ACCESS_TOKEN: ${{ steps.player-google-auth.outputs.access_token }}
        run: python -B scripts/kvl_player_master_pilot.py --apply --root . --output "$RUNNER_TEMP/kvl-player-master-pilot"
      - name: Commit only verified current-season roster and event provenance files
        if: steps.player-gate.outputs.ready == 'true'
        shell: bash
        run: |
          python -B scripts/kvl_player_master_pilot.py --preflight --require-ready --root . --output "$RUNNER_TEMP/kvl-player-master-pilot/pre-commit"
          python -B - <<'PY'
          import subprocess
          allowed = {
              'data/competitions/v-league-men-2026-27/rosters.json',
              'data/competitions/v-league-women-2026-27/rosters.json',
              'data/player-updates/applied_master_events.json',
          }
          changed = set(subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines())
          changed.update(subprocess.check_output(['git', 'ls-files', '--others', '--exclude-standard'], text=True).splitlines())
          if changed - allowed:
              raise SystemExit('Player pilot blocked: generated files exceed the approved scope')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- data/competitions/v-league-men-2026-27/rosters.json data/competitions/v-league-women-2026-27/rosters.json data/player-updates/applied_master_events.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update verified player MASTER pilot export'
            python -B scripts/kvl_player_master_pilot.py --preflight --require-ready --root . --output "$RUNNER_TEMP/kvl-player-master-pilot/pre-push"
            git push origin HEAD:main
          fi
      - name: Verify the Pages build commit and exact roster/provenance bytes
        if: steps.player-gate.outputs.ready == 'true'
        run: python -B scripts/kvl_player_master_publish.py --root . --sha "$(git rev-parse HEAD)" --output "$RUNNER_TEMP/kvl-player-master-pilot"
      - name: Keep only sanitized pilot decisions and verified receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: player-master-pilot-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/kvl-player-master-pilot/report.json
            ${{ runner.temp }}/kvl-player-master-pilot/receipt.json
            ${{ runner.temp }}/kvl-player-master-pilot/export.json
            ${{ runner.temp }}/kvl-player-master-pilot/deploy.json
          retention-days: 7
          if-no-files-found: warn
      - name: Summarize player activation separately from match publication
        if: always()
        env:
          PLAYER_PILOT_READY: ${{ steps.player-gate.outputs.ready }}
          PLAYER_PILOT_REASON: ${{ steps.player-gate.outputs.reason }}
        run: |
          printf '### Player MASTER pilot\n\nReady: `%s` · Gate: `%s`\n\nOnly a verified one-event approval can activate Google authentication and publication. A blocked gate performs no player MASTER write or export. The sanitized receipts distinguish MASTER verification from Pages verification.\n' "$PLAYER_PILOT_READY" "$PLAYER_PILOT_REASON" >> "$GITHUB_STEP_SUMMARY"

  player_master_access_check:
    # Manual read-only diagnostic in the existing WIF-trusted workflow.
    if: >-
      github.repository == 'kvolleylab/kvolleylab' &&
      github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' &&
      inputs.player_master_access_check == true
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      id-token: write
    env:
      KVL_PLAYER_MASTER_ACCESS_CHECK: 'true'
      KVL_PLAYER_MASTER_SERVICE_ACCOUNT: ${{ vars.KVL_GOOGLE_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate the fixed read-only target before authentication
        run: python -B scripts/kvl_player_master_access_check.py --preflight --root . --output "$RUNNER_TEMP/kvl-player-master-access"
      - name: Authenticate the existing service account with Sheets read-only scope
        id: access-google-auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.KVL_GOOGLE_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.KVL_GOOGLE_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/spreadsheets.readonly
          create_credentials_file: false
          export_environment_variables: false
      - name: Read only the verified workbook metadata and two header rows
        env:
          KVL_GOOGLE_ACCESS_TOKEN: ${{ steps.access-google-auth.outputs.access_token }}
        run: python -B scripts/kvl_player_master_access_check.py --read --root . --output "$RUNNER_TEMP/kvl-player-master-access"
      - name: Keep only the sanitized access report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: player-master-access-${{ github.run_id }}
          path: ${{ runner.temp }}/kvl-player-master-access/report.json
          retention-days: 7
          if-no-files-found: warn
      - name: Summarize access independently from update activation
        if: always()
        run: |
          python -B - <<'PY'
          import json, os
          from pathlib import Path
          path = Path(os.environ['RUNNER_TEMP']) / 'kvl-player-master-access/report.json'
          report = json.loads(path.read_text()) if path.is_file() else {}
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
              out.write('### Player MASTER read-only access check\n\n')
              out.write('Status: `' + str(report.get('status', 'NOT_VERIFIED')) + '`\n\n')
              out.write('Read access verified: `' + str(report.get('read_access_verified', False)).lower() + '`\n\n')
              out.write('This diagnostic reads metadata and two header rows only. Player values, history and site data are unchanged. It does not verify actual writes or approve an effective date.\n')
          PY

  notify_failure:
    needs: [lifecycle, check, publish]
    if: >-
      inputs.player_master_access_check != true &&
      always() && github.ref == 'refs/heads/main' && github.repository == 'kvolleylab/kvolleylab' &&
      vars.KVL_VLEAGUE_UPDATE_APPROVED == 'true' &&
      (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.publish)) &&
      (needs.lifecycle.result == 'failure' || needs.check.result == 'failure' || needs.publish.result == 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 4
    permissions:
      contents: read
      issues: write
    env:
      KVL_VLEAGUE_PUBLISH_APPROVED: 'true'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: vleague-*-${{ github.run_id }}
          path: ${{ runner.temp }}/kvl-vleague-notify
          merge-multiple: false
      - name: Deduplicate failure Issue without raw MASTER or secret data
        shell: bash
        run: |
          base="$RUNNER_TEMP/kvl-vleague-notify"
          publisher="$base/vleague-publish-$GITHUB_RUN_ID"
          report="$base/vleague-preview-$GITHUB_RUN_ID/report.json"
          if [ ! -f "$report" ]; then
            report="$base/vleague-lifecycle-$GITHUB_RUN_ID/lifecycle.json"
          fi
          if [ -f "$publisher/report.json" ]; then
            report="$publisher/report.json"
          fi
          ops="$publisher/preflight.json"
          if [ -f "$publisher/deploy.json" ]; then
            ops="$publisher/deploy.json"
          fi
          if [ -f "$publisher/lifecycle.json" ] && python -c 'import json, sys; sys.exit(json.load(open(sys.argv[1]))["status"] != "FAILED")' "$publisher/lifecycle.json"; then
            ops="$publisher/lifecycle.json"
          fi
          python -B scripts/kovo_vleague_ops.py notify-failure --report "$report" --ops-report "$ops" --run-url "https://github.com/kvolleylab/kvolleylab/actions/runs/$GITHUB_RUN_ID"
