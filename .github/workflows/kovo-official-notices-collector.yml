name: KOVO Official Notices Collector

on:
  workflow_dispatch:
    inputs:
      max_pages:
        description: 'Recent public notice pages to check (1-200)'
        type: string
        required: false
        default: '12'
      max_details:
        description: 'Max matching posts to fetch (1-1000)'
        type: string
        required: false
        default: '180'
      notice_id:
        description: 'Optional single KOVO notice ID'
        type: string
        required: false
        default: ''
  schedule:
    - cron: '13 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/kovo-official-notices-collector.yml'
      - 'scripts/kovo_official_notices.py'
      - 'scripts/kovo_official_change_events.py'
      - 'tests/test_kovo_official_notices.py'
      - 'scripts/kovo_verify_roster_contracts.py'
      - 'tests/test_kovo_verify_roster_contracts.py'
      - 'scripts/kvl_player_updates.py'
      - 'tests/test_kvl_player_updates.py'
      - 'scripts/kvl_player_master_plan.py'
      - 'tests/test_kvl_player_master_plan.py'
      - 'scripts/kovo_team_roster_publish.py'
      - 'scripts/kovo_team_roster_public_verify.py'
      - 'tests/test_kovo_team_roster_publish.py'
      - 'data/team-rosters/v-league/index.json'
      - 'data/team-rosters/v-league/automation.json'
      - 'data/player-updates/config.json'
      - 'data/player-updates/reviewed_mappings.json'
      - 'data/player-updates/master_targets.json'

permissions:
  contents: write
  pages: write

concurrency:
  group: kovo-official-notices-collector-main
  cancel-in-progress: false

jobs:
  collect:
    if: github.repository == 'kvolleylab/kvolleylab' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run collector unit tests
        run: |
          python -m unittest discover -s tests -p test_kovo_official_notices.py -v
          python -m unittest discover -s tests -p test_kovo_verify_roster_contracts.py -v
          python -m unittest discover -s tests -p test_kvl_player_updates.py -v
          python -m unittest discover -s tests -p test_kvl_player_master_plan.py -v
          python -m unittest discover -s tests -p test_kovo_team_roster_publish.py -v
      - name: Check monitoring period and season review deadline before network access
        id: period
        run: python scripts/kvl_player_updates.py --check-window --github-output "$GITHUB_OUTPUT"
      - name: Select adaptive team-roster cadence
        id: roster-cadence
        run: python scripts/kovo_team_roster_publish.py --check-cadence --github-output "$GITHUB_OUTPUT"
      - name: Download official public notices without credentials
        if: steps.period.outputs.active == 'true' && steps.roster-cadence.outputs.run == 'true'
        env:
          MAX_PAGES: ${{ inputs.max_pages || '12' }}
          MAX_DETAILS: ${{ inputs.max_details || '180' }}
          NOTICE_ID: ${{ inputs.notice_id || '' }}
        shell: bash
        run: |
          python scripts/kvl_player_updates.py --require-active-window
          if [ -n "$NOTICE_ID" ]; then
            python scripts/kovo_official_notices.py --max-pages 0 --max-details 1 --notice-id "$NOTICE_ID"
          else
            python scripts/kovo_official_notices.py --max-pages "$MAX_PAGES" --max-details "$MAX_DETAILS"
          fi
      - name: Build unreviewed candidate roster, salary and change queue
        if: steps.period.outputs.active == 'true' && steps.roster-cadence.outputs.run == 'true'
        run: python scripts/kovo_verify_roster_contracts.py
      - name: Publish safe current V-League team roster snapshots
        id: roster-publish
        if: steps.period.outputs.active == 'true' && steps.roster-cadence.outputs.run == 'true'
        shell: bash
        run: |
          python scripts/kovo_team_roster_publish.py --publish --report "$RUNNER_TEMP/kovo-team-roster/report.json"
          if git diff --quiet -- data/competitions/v-league-men-2026-27/rosters.json data/competitions/v-league-women-2026-27/rosters.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Version player evidence and collect separate news metadata
        if: steps.period.outputs.active == 'true' && steps.roster-cadence.outputs.run == 'true'
        run: python scripts/kvl_player_updates.py --collect-news
      - name: Report verified MASTER targets and local plan readiness without external access
        if: steps.period.outputs.active == 'true' && steps.roster-cadence.outputs.run == 'true'
        run: python scripts/kvl_player_master_plan.py
      - name: Store diagnostic summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kovo-notice-report
          path: |
            data/kovo/official-notices/2026-27/run_report.json
            data/player-updates/run_report.json
          retention-days: 14
          if-no-files-found: ignore
      - name: Commit normalized facts and verified current roster snapshots
        id: commit
        if: steps.period.outputs.active == 'true' && steps.roster-cadence.outputs.run == 'true'
        shell: bash
        run: |
          python scripts/kvl_player_updates.py --validate-public
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/kovo/official-notices/2026-27/index.json data/kovo/official-notices/2026-27/registration_rows.csv data/kovo/official-notices/2026-27/change_events.csv data/kovo/official-notices/2026-27/roster_projection.json data/kovo/official-notices/2026-27/roster_review_queue.json
          if [ -f data/kovo/official-notices/2026-27/latest_changes.json ]; then
            git add data/kovo/official-notices/2026-27/latest_changes.json
          fi
          git add data/player-updates/official_candidates.json data/player-updates/reviewed_events.json data/player-updates/news_candidates.json data/player-updates/master_change_plan.json
          git add data/competitions/v-league-men-2026-27/rosters.json data/competitions/v-league-women-2026-27/rosters.json
          if git diff --cached --quiet; then
            echo "No source notice or roster changes to commit"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          else
            python scripts/kvl_player_updates.py --require-active-window
            git commit -m "data(kovo): update notices and current V-League rosters [skip ci]"
            python scripts/kvl_player_updates.py --require-active-window
            git push origin HEAD:main
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          fi
      - name: Request Pages build for roster changes
        if: steps.roster-publish.outputs.changed == 'true' && steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          test "$GITHUB_REPOSITORY" = "kvolleylab/kvolleylab"
          test "$GITHUB_REF" = "refs/heads/main"
          test "$(git rev-parse HEAD)" = "${{ steps.commit.outputs.sha }}"
          mkdir -p "$RUNNER_TEMP/kovo-team-roster"
          gh api --method POST "/repos/$GITHUB_REPOSITORY/pages/builds" > "$RUNNER_TEMP/kovo-team-roster/pages.json"
      - name: Verify exact roster JSON on public Pages
        if: steps.roster-publish.outputs.changed == 'true' && steps.commit.outputs.changed == 'true'
        run: python -B scripts/kovo_team_roster_public_verify.py --root . --sha "${{ steps.commit.outputs.sha }}" --report "$RUNNER_TEMP/kovo-team-roster/public-readback.json"
      - name: Store team roster publication receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kovo-team-roster-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/kovo-team-roster/report.json
            ${{ runner.temp }}/kovo-team-roster/pages.json
            ${{ runner.temp }}/kovo-team-roster/public-readback.json
          retention-days: 14
          if-no-files-found: ignore
