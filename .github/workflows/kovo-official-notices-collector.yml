name: KOVO Official Notices Collector

on:
  workflow_dispatch:
    inputs:
      max_pages:
        description: 'Recent public notice pages to check (1-200)'
        type: string
        required: false
        default: '12'
      max_details:
        description: 'Max matching posts to fetch (1-1000)'
        type: string
        required: false
        default: '180'
      notice_id:
        description: 'Optional single KOVO notice ID'
        type: string
        required: false
        default: ''
      publish_bridge:
        description: 'After explicit repository approval, verify/build the current draft roster bridge even when unchanged'
        type: boolean
        required: false
        default: false
  schedule:
    - cron: '13 23 * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/kovo-official-notices-collector.yml'
      - 'scripts/kovo_official_notices.py'
      - 'scripts/kovo_official_change_events.py'
      - 'tests/test_kovo_official_notices.py'
      - 'scripts/kovo_verify_roster_contracts.py'
      - 'tests/test_kovo_verify_roster_contracts.py'
      - 'scripts/kvl_player_updates.py'
      - 'tests/test_kvl_player_updates.py'
      - 'scripts/kvl_player_master_plan.py'
      - 'tests/test_kvl_player_master_plan.py'
      - 'data/player-updates/config.json'
      - 'data/player-updates/reviewed_mappings.json'
      - 'data/player-updates/master_targets.json'
      - 'scripts/kvl_vleague_draft_sync.py'
      - 'scripts/kvl_vleague_draft_deploy.py'
      - 'assets/js/kvl-vleague-draft-bridge-v1.js'

permissions:
  contents: write
  pages: write

concurrency:
  group: kovo-official-notices-collector-main
  cancel-in-progress: false

jobs:
  collect:
    if: github.repository == 'kvolleylab/kvolleylab' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run collector unit tests
        run: |
          python -m unittest discover -s tests -p test_kovo_official_notices.py -v
          python -m unittest discover -s tests -p test_kovo_verify_roster_contracts.py -v
          python -m unittest discover -s tests -p test_kvl_player_updates.py -v
          python -m unittest discover -s tests -p test_kvl_player_master_plan.py -v
      - name: Check monitoring period and season review deadline before network access
        id: period
        run: python scripts/kvl_player_updates.py --check-window --github-output "$GITHUB_OUTPUT"
      - name: Download official public notices without credentials
        if: steps.period.outputs.active == 'true'
        env:
          MAX_PAGES: ${{ inputs.max_pages || '12' }}
          MAX_DETAILS: ${{ inputs.max_details || '180' }}
          NOTICE_ID: ${{ inputs.notice_id || '' }}
        shell: bash
        run: |
          python scripts/kvl_player_updates.py --require-active-window
          if [ -n "$NOTICE_ID" ]; then
            python scripts/kovo_official_notices.py --max-pages 0 --max-details 1 --notice-id "$NOTICE_ID"
          else
            python scripts/kovo_official_notices.py --max-pages "$MAX_PAGES" --max-details "$MAX_DETAILS"
          fi
      - name: Build unreviewed candidate roster, salary and change queue
        if: steps.period.outputs.active == 'true'
        run: python scripts/kovo_verify_roster_contracts.py
      - name: Version player evidence and collect separate news metadata
        if: steps.period.outputs.active == 'true'
        run: python scripts/kvl_player_updates.py --collect-news
      - name: Report verified MASTER targets and local plan readiness without external access
        if: steps.period.outputs.active == 'true'
        run: python scripts/kvl_player_master_plan.py
      - name: Store diagnostic summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kovo-notice-report
          path: |
            data/kovo/official-notices/2026-27/run_report.json
            data/player-updates/run_report.json
            data/kovo/official-notices/2026-27/draft_registration_bridge.json
          retention-days: 14
          if-no-files-found: ignore
      - name: Build source-verified draft registrations and limited professional profiles
        id: draft-bridge
        if: steps.period.outputs.active == 'true'
        continue-on-error: true
        run: python -B scripts/kvl_vleague_draft_sync.py --write
      - name: Commit normalized facts and independently reviewed draft projection (never write Drive MASTER)
        id: bridge-commit
        if: steps.period.outputs.active == 'true'
        shell: bash
        run: |
          python scripts/kvl_player_updates.py --validate-public
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/kovo/official-notices/2026-27/index.json data/kovo/official-notices/2026-27/registration_rows.csv data/kovo/official-notices/2026-27/change_events.csv data/kovo/official-notices/2026-27/roster_projection.json data/kovo/official-notices/2026-27/roster_review_queue.json
          if [ -f data/kovo/official-notices/2026-27/latest_changes.json ]; then
            git add data/kovo/official-notices/2026-27/latest_changes.json
          fi
          git add data/player-updates/official_candidates.json data/player-updates/reviewed_events.json data/player-updates/news_candidates.json data/player-updates/master_change_plan.json
          if [ "${{ steps.draft-bridge.outcome }}" = 'success' ] && [ -f data/kovo/official-notices/2026-27/draft_registration_bridge.json ]; then
            git add -- data/kovo/official-notices/2026-27/draft_registration_bridge.json
          fi
          if git diff --cached --name-only | grep -Fxq data/kovo/official-notices/2026-27/draft_registration_bridge.json; then
            echo 'bridge_changed=true' >> "$GITHUB_OUTPUT"
          else
            echo 'bridge_changed=false' >> "$GITHUB_OUTPUT"
          fi
          if git diff --cached --quiet; then
            echo "No source notice changes to commit"
          else
            python scripts/kvl_player_updates.py --require-active-window
            git commit -m "data(kovo): update normalized official notices [skip ci]"
            python scripts/kvl_player_updates.py --require-active-window
            git push origin HEAD:main
          fi
      - name: Request trusted Pages build and verify the draft bridge
        if: >-
          steps.period.outputs.active == 'true' &&
          steps.draft-bridge.outcome == 'success' &&
          vars.KVL_DRAFT_ROSTER_PUBLISH_APPROVED == 'true' &&
          (steps.bridge-commit.outputs.bridge_changed == 'true' ||
           (github.event_name == 'workflow_dispatch' && inputs.publish_bridge == true))
        env:
          KVL_DRAFT_ROSTER_PUBLISH_APPROVED: 'true'
          GH_TOKEN: ${{ github.token }}
        run: python -B scripts/kvl_vleague_draft_deploy.py --root . --sha "$(git rev-parse HEAD)" --report "$RUNNER_TEMP/draft-pages-receipt.json"
      - name: Record sanitized Pages receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kovo-draft-pages-receipt
          path: ${{ runner.temp }}/draft-pages-receipt.json
          retention-days: 14
          if-no-files-found: ignore
