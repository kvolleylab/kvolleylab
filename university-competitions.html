<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>대학배구 대회 | K-Volley Lab</title>
  <meta name="description" content="K-Volley Lab의 대학배구 대회를 연도별로 확인하세요.">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/site-theme-light.css">
  <style>
    :root{
      /* 대학대회 목록 페이지 크기 조절값 — 숫자만 바꾸면 됨 */
      --uc-card-min-height: 350px;
      --uc-title-size: 23px;
      --uc-official-name-size: 14px;
      --uc-date-size: 14px;
      --uc-series-size: 12px;
      --uc-podium-title-size: 14px;
      --uc-rank-size: 13px;
      --uc-card-padding: 24px;
    }
    .uc-main{max-width:1180px;margin:0 auto;padding:34px 20px 80px}.uc-hero{display:flex;align-items:center;justify-content:space-between;gap:24px;padding:34px 38px;border:1px solid #dbe2ea;border-radius:30px;background:linear-gradient(135deg,#17365d,#0f2745);color:#fff}.uc-hero-copy{display:flex;align-items:center;gap:18px}.uc-hero-logo{width:72px;display:flex;align-items:center;justify-content:center;flex:0 0 auto}.uc-hero-logo img{display:block;width:72px;height:auto;max-height:72px;object-fit:contain;image-rendering:auto;filter:drop-shadow(0 2px 8px rgba(0,0,0,.16))}.uc-hero p{margin:0;color:#dbe7f5}.uc-hero .eyebrow{margin-bottom:8px;color:#c9a24a;font-size:12px;font-weight:900;letter-spacing:.12em}.uc-hero h1{margin:0 0 10px;color:#fff!important;font-size:38px}.uc-summary{display:flex;gap:10px;flex-wrap:wrap}.uc-summary span{padding:9px 13px;border:1px solid rgba(255,255,255,.18);border-radius:999px;background:rgba(255,255,255,.08);font-size:12px;font-weight:900}.uc-year{margin-top:32px}.uc-head{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;margin-bottom:16px}.uc-head h2{margin:0;color:#17365d}.uc-head p{margin:0;color:#64748b}.uc-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.uc-card{display:flex;flex-direction:column;min-height:var(--uc-card-min-height);overflow:hidden;border:1px solid #dbe2ea;border-radius:24px;background:#fff;color:inherit;box-shadow:0 10px 28px rgba(15,23,42,.06);transition:transform .16s ease,box-shadow .16s ease,border-color .16s ease}.uc-card:hover{transform:translateY(-1px);border-color:#c9a44c;box-shadow:0 14px 30px rgba(154,109,18,.08)}.uc-card-main{display:grid;grid-template-columns:minmax(0,.95fr) minmax(250px,1.05fr);gap:0;align-items:stretch;flex:1}.uc-card-info{min-width:0;display:flex;flex-direction:column;padding:var(--uc-card-padding);color:inherit;text-decoration:none;transition:background .16s ease}.uc-card-info:hover,.uc-card-info:focus-visible{background:#fffdf7;outline:none}.uc-card-info:hover .uc-card-body h3,.uc-card-info:focus-visible .uc-card-body h3{color:#9a6d12}.uc-card-info:hover .uc-card-link,.uc-card-info:focus-visible .uc-card-link{text-decoration:underline}.uc-card-top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}.uc-card-series{font-size:var(--uc-series-size);line-height:1.2;font-weight:900;color:#c08f23;letter-spacing:.12em}.uc-status{padding:6px 9px;border-radius:999px;font-size:11px;font-weight:900;background:#e8f5e9;color:#166534;white-space:nowrap}.uc-card-body h3{margin:0 0 10px;color:#17365d;font-size:var(--uc-title-size);line-height:1.35;transition:color .16s ease}.uc-card-body p{margin:0;color:#64748b;line-height:1.65;font-size:var(--uc-official-name-size)}.uc-date{margin-top:15px;font-size:var(--uc-date-size);font-weight:800;color:#334155}.uc-card-link{display:inline-flex;margin-top:auto;padding-top:20px;color:#9a6d12;font-size:13px;font-weight:900}.uc-podiums{display:grid;grid-template-columns:1fr 1fr;gap:9px;padding:var(--uc-card-padding);border-left:1px solid #e2e8f0;background:linear-gradient(180deg,#fbfcfe,#f5f8fb);align-content:start}.uc-podium{padding:13px 11px;border:1px solid #e5e7eb;border-radius:12px;background:#fff}.uc-podium strong{display:block;margin-bottom:8px;color:#17365d;font-size:var(--uc-podium-title-size);text-align:center}.uc-rank{display:grid;grid-template-columns:18px 1fr;gap:6px;align-items:center;padding:4px 0;font-size:var(--uc-rank-size);color:#475569;white-space:nowrap;text-align:left}.uc-rank .medal{font-size:15px}.uc-rank.is-champion span:last-child{font-weight:900;color:#0f2745}.uc-empty{padding:34px;border:1px dashed #cbd5e1;border-radius:20px;background:#f8fafc;color:#64748b;text-align:center}.uc-note{margin-top:22px;padding:18px 20px;border-left:4px solid #c9a24a;border-radius:14px;background:#fff8e6;color:#536477;line-height:1.7}.uc-load-sentinel{height:1px}.uc-loading{padding:20px;text-align:center;color:#64748b;font-size:13px}@media(max-width:1040px){.uc-card-main{grid-template-columns:1fr}.uc-podiums{border-left:0;border-top:1px solid #e2e8f0}}@media(max-width:900px){.uc-grid{grid-template-columns:1fr}.uc-card-main{grid-template-columns:minmax(0,.95fr) minmax(250px,1.05fr)}.uc-podiums{border-left:1px solid #e2e8f0;border-top:0}}@media(max-width:760px){:root{--uc-card-min-height:0;--uc-title-size:22px;--uc-official-name-size:14px;--uc-date-size:14px;--uc-rank-size:13px;--uc-card-padding:20px}.uc-main{padding:18px 12px 60px}.uc-hero{align-items:flex-start;flex-direction:column;padding:24px}.uc-hero-copy{align-items:center}.uc-hero-logo{width:58px}.uc-hero-logo img{width:58px;max-height:58px}.uc-hero h1{font-size:30px}.uc-head{align-items:flex-start;flex-direction:column}.uc-grid{grid-template-columns:1fr}.uc-card-main{display:flex;flex-direction:column}.uc-podiums{grid-template-columns:1fr 1fr;border-left:0;border-top:1px solid #e2e8f0}.uc-card-link{padding-top:16px}}@media(max-width:480px){.uc-podiums{grid-template-columns:1fr}}
  </style>
  <script src="assets/js/unified-nav.js?v=20260729-2" defer></script>
</head>
<body>
<header class="site-header"><a class="site-logo" href="index.html">K-Volley Lab</a><nav class="site-nav"></nav></header>
<main class="uc-main">
  <section class="uc-hero">
    <div class="uc-hero-copy"><div class="uc-hero-logo"><img src="assets/images/universities/kuvf-logo.png?v=20260825-2" alt="한국대학배구연맹 로고"></div><div><p class="eyebrow">UNIVERSITY COMPETITIONS</p><h1>대학배구 대회</h1><p>연도별 연맹대회의 일정과 최종 결과를 확인하세요.</p></div></div>
    <div class="uc-summary"><span id="ucYearCount">연도 -개</span><span id="ucCompetitionCount">대회 -개</span></div>
  </section>
  <div id="ucYears"></div>
  <div id="ucLoading" class="uc-loading"></div>
  <div id="ucLoadSentinel" class="uc-load-sentinel" aria-hidden="true"></div>
  <div class="uc-note">최신 연도를 먼저 표시하고, 과거 연도는 아래로 스크롤할 때 순차적으로 불러옵니다.</div>
</main>
<footer class="site-footer">© 2026 K-Volley Lab. Korean Volleyball Data & Analytics.</footer>
<script>
(()=>{
  const esc=v=>String(v??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]));
  const days=['일','월','화','수','목','금','토'];
  const dateWithWeekday=value=>{if(!value)return '일정 미정';const [y,m,d]=value.split('-').map(Number);return `${value}(${days[new Date(y,m-1,d).getDay()]})`};
  const medal=rank=>rank===1?'🏆':rank===2?'🥈':'🥉';
  const podiumHtml=p=>`<div class="uc-podium"><strong>${esc(p.division)}</strong>${(p.rankings||[]).map(r=>`<div class="uc-rank ${r.rank===1?'is-champion':''}"><span class="medal">${medal(r.rank)}</span><span>${r.rank}위 ${esc(r.team)}</span></div>`).join('')}</div>`;
  const cardHtml=item=>`<article class="uc-card"><div class="uc-card-main"><a class="uc-card-info" href="${esc(item.pagePath)}"><div class="uc-card-top"><span class="uc-card-series">${esc(item.series||'대학대회')}</span><span class="uc-status">대회 종료</span></div><div class="uc-card-body"><h3>${esc(item.shortName)}</h3><p>${esc(item.name)}</p><div class="uc-date">${esc(dateWithWeekday(item.startDate))} ~ ${esc(dateWithWeekday(item.endDate))}</div></div><span class="uc-card-link">대회 보기 →</span></a><div class="uc-podiums" aria-label="최종 순위">${(item.podiums||[]).map(podiumHtml).join('')}</div></div></article>`;
  const yearsRoot=document.getElementById('ucYears'),loading=document.getElementById('ucLoading'),sentinel=document.getElementById('ucLoadSentinel');
  let manifest=[],index=0,loadingNow=false,totalCompetitions=0;
  async function loadNextYear(){if(loadingNow||index>=manifest.length)return;loadingNow=true;loading.textContent='이전 연도 불러오는 중…';const meta=manifest[index++];try{const res=await fetch(meta.dataPath,{cache:'no-store'});if(!res.ok)throw new Error(res.status);const data=await res.json();const list=data.competitions||[];totalCompetitions+=list.length;document.getElementById('ucCompetitionCount').textContent=`대회 ${totalCompetitions}개`;const section=document.createElement('section');section.className='uc-year';section.innerHTML=`<div class="uc-head"><div><p class="eyebrow">${meta.year} SEASON</p><h2>${esc(meta.label||`${meta.year} 대학대회`)}</h2></div><p>종료 대회의 최종 순위까지 함께 보관합니다.</p></div><div class="uc-grid">${list.map(cardHtml).join('')||'<div class="uc-empty">등록된 대회가 없습니다.</div>'}</div>`;yearsRoot.appendChild(section)}catch{const err=document.createElement('div');err.className='uc-empty';err.textContent=`${meta.year}년 대회 데이터를 불러오지 못했습니다.`;yearsRoot.appendChild(err)}finally{loadingNow=false;loading.textContent=index<manifest.length?'아래로 스크롤하면 이전 연도를 불러옵니다.':''}}
  fetch('data/competitions/university-years.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error(r.status);return r.json()}).then(data=>{manifest=(data.years||[]).sort((a,b)=>b.year-a.year);document.getElementById('ucYearCount').textContent=`연도 ${manifest.length}개`;loadNextYear();const observer=new IntersectionObserver(entries=>{if(entries.some(e=>e.isIntersecting))loadNextYear()},{rootMargin:'500px 0px'});observer.observe(sentinel)}).catch(()=>{yearsRoot.innerHTML='<div class="uc-empty">대회 연도 목록을 불러오지 못했습니다.</div>'});
})();
</script>
</body>
</html>
